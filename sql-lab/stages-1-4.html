<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RouteCraft SQL Lab · Stages 1–4</title>
</head>
<body>
<div style="font-family:Arial,sans-serif;padding:24px">טוען את RouteCraft · Stages 1–4…</div>
<script>
(async()=>{
  const paths=Array.from({length:8},(_,i)=>`stages-1-4-data/part-${i+1}.txt`);
  const parts=await Promise.all(paths.map(async p=>{
    const r=await fetch(p,{cache:"no-store"});
    if(!r.ok) throw new Error(`Failed to load ${p}: ${r.status}`);
    return (await r.text()).trim();
  }));
  const b64=parts.join("");
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html=await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  document.body.innerHTML='<pre style="direction:ltr;text-align:left;padding:20px">'+String(err)+'</pre>';
});
</script>
</body>
</html>
