{title:"שפת הקורס",short:"שפת הקורס",eye:"פתיחה · המודל לפני התחביר",intro:true,context:"לפני שמתחילים לכתוב SQL, מיישרים קו על השפה שבה נתאר נתונים. המטרה היא להפריד בין המודל הרלציוני לבין האופן שבו SQL מציג תוצאות.",task:"עברו על מפת המונחים למטה. לא צריך לשנן; המילון הקבוע בצד יישאר זמין לאורך כל הקורס.",pred:"Database → Relation (טבלה) → Attribute (עמודה) / Tuple (שורה) / Value (ערך). Schema = המבנה; Instance = הנתונים ברגע נתון; Domain = הערכים המותרים; Grain = מה מייצגת שורה אחת.",starter:"",expected:null,note:"המונחים האלה הם שפת העבודה שלנו. אפשר לחזור למילון בכל שלב.",hints:["המילון בצד נשאר זמין לכל אורך המסלול."],solution:"Relation היא המקבילה התאורטית לטבלה במודל הרלציוני. Relation היא קבוצה של tuples: אין בה tuple כפול ואין משמעות לסדר. תוצאת SQL עשויה להכיל שורות כפולות, וסדר מופיע רק כשמגדירים אותו במפורש.",principle:"לפני תחביר SQL, מגדירים במדויק מה הנתונים מייצגים."},
{title:"ממפים את רשת התפעול",short:"מיפוי database",mapping:true,eye:"שלב 1 בחקירה · להבין את הנתונים",context:"קיבלתם database של רשת משלוחים בלי מילון נתונים מוכן. לפני שמחשבים ביצועים, צריך לגלות מה מייצגת row אחת בכל relation ואיך הישויות קשורות.",task:"התחילו ב-depots, ואז חקרו גם drivers, vehicles, vehicle_trackers, routes, stops, shipments ו-route_shipments. המטרה היא להסיק מה מייצגת row אחת בכל relation ואיך הישויות קשורות, מתוך ה-keys והחזרות שאתם רואים.",pred:"אל תנחשו לפי שמות בלבד. חפשו Primary Key, Foreign Key, UNIQUE וערכים שחוזרים. Cardinality ואופציונליות הן שאלות נפרדות.",starter:"",expected:null,note:"בחרו Grain לכל relation ואת סוג הקשר באמצעות 1:1, ‏1:M או M:M בלבד.",hints:["איזה attribute מזהה tuple באופן ייחודי?","בדקו היכן depot_id ו-route_id חוזרים.","vehicle_trackers.vehicle_id הוא UNIQUE; בצד השני עדיין יכולה להיות אופציונליות."],solution:"depots: שורה לאתר תפעולי. vehicles: שורה לרכב. vehicle_trackers: שורה להתקן מעקב ולכל היותר אחת לרכב. routes: שורה למסלול. stops: שורה לעצירה. shipments: שורה למשלוח. route_shipments: שורה לשיוך בין מסלול למשלוח. depot→routes ו-route→stops הם 1:M; vehicle→tracker הוא 1:1; routes↔shipments הוא M:M דרך הגשר.",principle:"Grain = מה מייצגת שורה אחת."},

{title:"אילו אתרים נושאים עומס דרך גבוה?",short:"אתרים מעל סף",eye:"בקשה ניהולית · סף על סיכום",context:"מנהל הרשת רוצה להתמקד ב-depots שסך מרחקי המסלולים המתוכננים שלהם הוא לפחות 200 ק״מ.",task:"מנהל הרשת צריך לזהות את ה-depots שעוברים את סף העומס ולראות מה המרחק המצטבר שתוכנן בכל אחד מהם.",output:"depot_name, total_km · מיון לפי total_km מהגבוה לנמוך.",pred:"האם הסף חל על route בודדת או על סך routes של depot?",predQuiz:[{q:"מתי אפשר להעריך את התנאי total_km >= 200?",opts:[["before","לפני שמקבצים"],["after","אחרי שמסכמים לכל depot"],["never","אי אפשר"]],ans:"after",why:"הסף חל על aggregate של group, ולכן נבדק אחרי יצירת הקבוצות."}],starter:"",expected:"SELECT d.depot_name,SUM(r.distance_km) total_km FROM depots d INNER JOIN routes r ON r.depot_id=d.depot_id GROUP BY d.depot_id,d.depot_name HAVING SUM(r.distance_km)>=200 ORDER BY total_km DESC;",note:"הבחינו בין filter על row לבין filter על group.",hints:["קבצו לפי depot.","סכמו distance_km בכל קבוצה.","סינון aggregate מתבצע ב-HAVING."],solution:"SELECT d.depot_name,SUM(r.distance_km) AS total_km FROM depots d INNER JOIN routes r ON r.depot_id=d.depot_id GROUP BY d.depot_id,d.depot_name HAVING SUM(r.distance_km)>=200 ORDER BY total_km DESC;",principle:"HAVING מסנן groups לפי ערך aggregate; WHERE מסנן input rows לפני aggregation."},
{title:"איך נראית הפעילות בכל יום?",short:"דוח יומי",eye:"שינוי יחידת ניתוח · מסלולים ליום",context:"ישיבת הבוקר צריכה תמונה יומית במקום רשימת routes בודדות.",task:"בנו שורה לכל service_date ובה מספר המסלולים, המרחק הכולל ומספר המסלולים שהושלמו.",output:"service_date, route_count, total_km, completed_routes · מיון לפי service_date.",pred:"איזו יחידה נעלמת ואיזו יחידה נוצרת בתוצאה?",predQuiz:[{q:"מה ה-output Grain החדש?",opts:[["route","route"],["depot","depot"],["day","service_date"],["vehicle","vehicle"]],ans:"day",why:"ה-rows המקוריות מתקבצות לשורה אחת לכל תאריך שירות."}],starter:"",expected:"SELECT service_date,COUNT(*) route_count,SUM(distance_km) total_km,SUM(CASE WHEN status='completed' THEN 1 ELSE 0 END) completed_routes FROM routes GROUP BY service_date ORDER BY service_date;",note:"הקיבוץ משנה את משמעות row אחת.",hints:["service_date הוא ה-key של ה-Grain החדש.","COUNT(*) סופר routes בכל יום.","CASE יכול להפוך תנאי completed ל-1 או 0 לפני SUM."],solution:"SELECT service_date,COUNT(*) AS route_count,SUM(distance_km) AS total_km,SUM(CASE WHEN status='completed' THEN 1 ELSE 0 END) AS completed_routes FROM routes GROUP BY service_date ORDER BY service_date;",principle:"GROUP BY משנה Grain: כמה source rows הופכות ל-row אחת לכל קבוצה."},
{title:"כמה מקטעים עבר כל משלוח?",short:"מסלולי shipment",eye:"מסלול שעובר דרך גשר",scratch:"ציירו routes מצד אחד ו-shipments מצד שני. באמצע שימו route_shipments וכתבו מה מייצגת row בגשר.",context:"משלוחים יכולים לעבור ביותר ממסלול אחד בזמן העברה בין אתרים. מנהלת השירות רוצה לדעת כמה route segments הוקצו לכל shipment, כולל כאלה שלא שובצו.",task:"מנהלת השירות רוצה לראות לכל shipment כמה route segments הוקצו לו, כולל shipments שעדיין לא שובצו.",output:"tracking_code, route_count · מיון לפי shipment_id.",pred:"מה ה-Grain של relation הגשר, ומה הוא אומר על הקשר הכולל?",predQuiz:[{q:"מה cardinality בין routes ל-shipments דרך הגשר?",opts:[["1:1","1:1"],["1:M","1:M"],["M:M","M:M"]],ans:"M:M",why:"route יכולה לשאת כמה shipments, ו-shipment יכולה לעבור בכמה routes."}],starter:"",expected:"SELECT s.tracking_code,COUNT(rs.route_id) route_count FROM shipments s LEFT OUTER JOIN route_shipments rs ON rs.shipment_id=s.shipment_id GROUP BY s.shipment_id,s.tracking_code ORDER BY s.shipment_id;",note:"הגשר מייצג relationships, לא רק פרטי משלוח.",hints:["התחילו מכל shipments כדי לשמור גם shipment ללא assignment.","כל row בגשר מייצגת route↔shipment אחת.","COUNT(rs.route_id) סופר את קשרי המסלול בפועל."],solution:"SELECT s.tracking_code,COUNT(rs.route_id) AS route_count FROM shipments s LEFT OUTER JOIN route_shipments rs ON rs.shipment_id=s.shipment_id GROUP BY s.shipment_id,s.tracking_code ORDER BY s.shipment_id;",principle:"Bridge relation מפרקת M:M לשני קשרי 1:M; כל row בה מייצגת relationship."},
{title:"תמונת כוח אדם ופעילות לכל אתר",short:"שני ענפים",eye:"שני מקורות מדדים · בדיקת ניפוח",scratch:"ציירו depot עם ענף drivers וענף routes. עבור Riverbend Crossdock שרטטו 3×3 combinations, ואז סמנו מה צריך להיות ה-Grain לפני החיבור הסופי.",context:"מנהלת האזור רוצה report אחד עם כוח אדם ופעילות מסלולים ברמת depot. לשני המדדים יש child rows עצמאיות.",task:"מנהלת האזור צריכה report ברמת depot שמחבר תמונת כוח אדם עם היקף פעילות המסלולים, בלי לאבד אתר שאין בו עדיין פעילות.",output:"depot_name, driver_count, route_count, total_km · מיון לפי depot_id.",pred:"חזו מה יקרה ל-counts ול-SUM אם תחברו את שני הענפים הגולמיים ישירות.",requireNote:true,starter:"",expected:"WITH drv AS (SELECT depot_id,COUNT(*) driver_count FROM drivers GROUP BY depot_id), rte AS (SELECT depot_id,COUNT(*) route_count,SUM(distance_km) total_km FROM routes GROUP BY depot_id) SELECT d.depot_name,COALESCE(drv.driver_count,0) driver_count,COALESCE(rte.route_count,0) route_count,COALESCE(rte.total_km,0) total_km FROM depots d LEFT OUTER JOIN drv ON drv.depot_id=d.depot_id LEFT OUTER JOIN rte ON rte.depot_id=d.depot_id ORDER BY d.depot_id;",note:"כתבו מה יוכפל ולמה, ואז תכננו row אחת לכל depot מכל ענף.",hints:["זהו 1:M × 1:M.","צמצמו כל child ל-row אחת לכל depot לפני החיבור.","CTE אחד ל-drivers ו-CTE אחד ל-routes."],solution:"WITH drv AS (SELECT depot_id,COUNT(*) AS driver_count FROM drivers GROUP BY depot_id), rte AS (SELECT depot_id,COUNT(*) AS route_count,SUM(distance_km) AS total_km FROM routes GROUP BY depot_id) SELECT d.depot_name,COALESCE(drv.driver_count,0) AS driver_count,COALESCE(rte.route_count,0) AS route_count,COALESCE(rte.total_km,0) AS total_km FROM depots d LEFT OUTER JOIN drv ON drv.depot_id=d.depot_id LEFT OUTER JOIN rte ON rte.depot_id=d.depot_id ORDER BY d.depot_id;",principle:"כששני ענפי 1:M תורמים מדדים, מבצעים pre-aggregation לכל ענף לפני JOIN."},
{title:"Capstone: איפה נדרשת התערבות?",short:"Capstone",eye:"משימה פתוחה · לבחור כלים",scratch:"מפו את ה-relations הרלוונטיים. סמנו איזה relation תורם values למדד, אילו relations רק בודקים תנאי, ואיפה צריך לשמור rows גם בלי match.",context:"ראש המשמרת רוצה shortlist של depots שבהם נמסרו לפחות 40 חבילות, הופיע לפחות route delayed, ואין route cancelled.",task:"ה-shortlist צריך לזהות את ה-depots שעומדים בכל שלושת התנאים העסקיים ולתת לראש המשמרת את היקף המסירות בכל אחד מהם.",output:"depot_name, delivered_packages · מיון לפי depot_name.",pred:"מה תהיה row אחת בתוצאה הסופית?",requireNote:true,starter:"",expected:"SELECT d.depot_name,SUM(s.delivered_packages) delivered_packages FROM depots d INNER JOIN routes r ON r.depot_id=d.depot_id INNER JOIN stops s ON s.route_id=r.route_id WHERE EXISTS (SELECT 1 FROM routes rd WHERE rd.depot_id=d.depot_id AND rd.status='delayed') AND NOT EXISTS (SELECT 1 FROM routes rc WHERE rc.depot_id=d.depot_id AND rc.status='cancelled') GROUP BY d.depot_id,d.depot_name HAVING SUM(s.delivered_packages)>=40 ORDER BY d.depot_name;",note:"הסבירו בקצרה למה כל relation מחוברת או נבדקת.",hints:["stops מכילה את values שצריך לסכם.","delayed הוא תנאי קיום בלבד.","cancelled הוא תנאי היעדר; הסף נבדק אחרי aggregation."],solution:"SELECT d.depot_name,SUM(s.delivered_packages) AS delivered_packages FROM depots d INNER JOIN routes r ON r.depot_id=d.depot_id INNER JOIN stops s ON s.route_id=r.route_id WHERE EXISTS (SELECT 1 FROM routes rd WHERE rd.depot_id=d.depot_id AND rd.status='delayed') AND NOT EXISTS (SELECT 1 FROM routes rc WHERE rc.depot_id=d.depot_id AND rc.status='cancelled') GROUP BY d.depot_id,d.depot_name HAVING SUM(s.delivered_packages)>=40 ORDER BY d.depot_name;",principle:"במשימה פתוחה בוחרים פעולה לפי תפקיד relation: מדד, קיום, היעדר או שמירת Grain."},
{title:"מבחן קבלה: reconcile תוכנית מול ביצוע",short:"מבחן קבלה",eye:"Database + בקשה עסקית · בלי שם כלי",scratch:"שרטטו את ה-relations הרלוונטיים, רשמו 2–4 מספרי בקרה, והחליטו כיצד לטפל במסלול ללא stops ובדיווח NULL.",context:"זהו פורמט של מבחן עבודה: קיבלתם database וחשד לפער תפעולי. אין מסלול תחבירי מוכתב.",task:"Operations רוצים לזהות routes שאינן cancelled ושבהן הביצוע בפועל נמוך מהתכנון. דיווח delivered_packages חסר מייצג שאין כמות מסירה מדווחת לאותה stop, ולכן לצורך הבדיקה הוא נחשב 0.",output:"depot_name, route_code, status, planned_packages, delivered_packages, gap · מיון לפי gap מהגדול לקטן ואז route_code.",pred:"מה תהיה row אחת בתוצאה הסופית?",requireNote:true,starter:"",expected:"SELECT d.depot_name,r.route_code,r.status,COALESCE(SUM(s.planned_packages),0) planned_packages,COALESCE(SUM(s.delivered_packages),0) delivered_packages,COALESCE(SUM(s.planned_packages),0)-COALESCE(SUM(s.delivered_packages),0) gap FROM depots d INNER JOIN routes r ON r.depot_id=d.depot_id LEFT OUTER JOIN stops s ON s.route_id=r.route_id WHERE r.status<>'cancelled' GROUP BY r.route_id,d.depot_name,r.route_code,r.status HAVING COALESCE(SUM(s.delivered_packages),0)<COALESCE(SUM(s.planned_packages),0) ORDER BY gap DESC,r.route_code;",note:"אל תחפשו שם של operator; התחילו מה-Grain ומהמשמעות העסקית של NULL.",hints:["row אחת בפלט מייצגת route.","route ללא stops צריכה להישאר כדי שתוכלו להחליט אם יש בה gap.","הסינון על הפער נעשה אחרי סיכום stops לכל route."],solution:"SELECT d.depot_name,r.route_code,r.status,COALESCE(SUM(s.planned_packages),0) AS planned_packages,COALESCE(SUM(s.delivered_packages),0) AS delivered_packages,COALESCE(SUM(s.planned_packages),0)-COALESCE(SUM(s.delivered_packages),0) AS gap FROM depots d INNER JOIN routes r ON r.depot_id=d.depot_id LEFT OUTER JOIN stops s ON s.route_id=r.route_id WHERE r.status<>'cancelled' GROUP BY r.route_id,d.depot_name,r.route_code,r.status HAVING COALESCE(SUM(s.delivered_packages),0)<COALESCE(SUM(s.planned_packages),0) ORDER BY gap DESC,r. const GLOSSARY=[
 ["relation","המקבילה התאורטית לטבלה במודל הרלציוני; relation היא קבוצה לא-מסודרת של tuples ללא כפילויות."],
 ["tuple","רשומה אחת בתוך relation, שמכילה value לכל attribute לפי ה-schema."],
 ["attribute","שדה במבנה של relation — המקבילה התאורטית לעמודה."],
 ["value","הערך הקונקרטי שנמצא ב-attribute של tuple מסוים."],
 ["instance","אוסף ה-tuples שקיימים ב-database ברגע נתון."],
 ["schema","המבנה המוגדר של ה-database: relations, attributes, domains ואילוצים."],
 ["domain","קבוצת הערכים שה-attribute רשאי לקבל."],
 ["grain","מה tuple אחת ב-relation או בתוצאה מייצגת מבחינה עסקית."],
 ["Primary Key","attribute או צירוף attributes שמזהה כל tuple באופן ייחודי."],
 ["Foreign Key","attribute שמפנה למפתח ב-relation אחר וכך מייצג קשר בין ישויות."],
 ["UNIQUE","אילוץ שמונע חזרה של אותו ערך או צירוף ערכים באותו שדה או צירוף שדות."],
 ["cardinality","כמה מופעים מצד אחד של קשר יכולים להתאים למופעים בצד השני, למשל 1:1, 1:M או M:M."],
 ["NULL","סמן ב-SQL לחוסר ערך ידוע או רלוונטי; הוא אינו value רגיל."],
 ["three-valued logic","לוגיקה שבה תנאי SQL יכול להיות TRUE, FALSE או UNKNOWN, בין היתר בגלל NULL."],
 ["aggregate","פונקציה שמסכמת כמה rows לערך אחד, למשל COUNT או SUM."],
 ["scalar subquery","תת-שאילתה שמחזירה value יחיד ולכן יכולה לשמש כביטוי."],
 ["correlated subquery","תת-שאילתה שמתייחסת ל-row מהשאילתה החיצונית ולכן נבחנת בהקשר שלה."],
 ["anti-join","דפוס שמחזיר rows מצד אחד שאין להן match בצד השני, למשל באמצעות NOT EXISTS."],
 ["bridge relation","relation שמייצגת קשר M:M באמצעות Foreign Keys לשני הצדדים."],
 ["fan-out","התרבות rows בעקבות JOIN עם כמה matches, שעלולה לנפח ספירות וסכומים."],
 ["pre-aggregation","צמצום relation ל-Grain הרצוי באמצעות aggregation לפני שמחברים אותה ב-JOIN."]
];

function formatStageTerms(text,seen){
 let out=esc(text||'');
 const defs=[["relation","טבלה"],["tuple","שורה"],["attribute","עמודה"],["value","ערך"]];
 defs.forEach(([term,he])=>{
   if(seen.has(term))return;
   const re=new RegExp("\\b"+term+"\\b(?!\\s*\\("+he+"\\))","i");
   if(re.test(out)){out=out.replace(re,term+" ("+he+")");seen.add(term);}
 });
 return out;
}

function fanoutApproach(sql){
 const q=String(sql||"");
 if(/\bEXISTS\s*\(/i.test(q))return "exists";
 if(/\bDISTINCT\b/i.test(q))return "distinct";
 if(/\bGROUP\s+BY\b/i.test(q))return "group";
 if(/\bLEFT\s+(?:OUTER\s+)?JOIN\b/i.test(q))return "left";
 if(/\bINNER\s+JOIN\b/i.test(q)||/\bJOIN\b/i.test(q))return "join";
 if(/\bWHERE\b/i.test(q))return "filter";
 return "other";
}

 }
 if(approach==="filter"){
   return "התוצאה במקרה נכונה, אבל סינון אינו פתרון כללי ל-fan-out. אם יישארו 2 drivers ו-3 routes עדיין ייווצרו 6 combinations, וסינון שלא נדרש משנה את השאלה העסקית.";

 if(approach==="left"){

const SQL_HINT_KEYWORDS=[
 "SELECT","FROM","WHERE","INNER JOIN","LEFT OUTER JOIN","ON","AS","AND","OR","NOT",
 "EXISTS","NOT EXISTS","GROUP BY","HAVING","ORDER BY","ASC","DESC","DISTINCT",
 "COUNT","SUM","AVG","MIN","MAX","COALESCE","CASE","WHEN","THEN","ELSE","END","WITH","NULL","IS NULL","IS NOT NULL"
];
const SQL_RESERVED_ALIAS=new Set(["WHERE","INNER","LEFT","RIGHT","FULL","JOIN","ON","GROUP","ORDER","HAVING","LIMIT","UNION","AND","OR","AS"]);

function aliasMapFromSql(sql){
 const map={};
 const re=/\b(?:FROM|JOIN)\s+([A-Za-z_][A-Za-z0-9_]*)(?:\s+(?:AS\s+)?([A-Za-z_][A-Za-z0-9_]*))?/gi;
 let m;
 while((m=re.exec(String(sql||"")))){
   const table=m[1],alias=m[2];
   if(!DOMAINS[table])continue;
   map[table]=table;
   if(alias&&!SQL_RESERVED_ALIAS.has(alias.toUpperCase()))map[alias]=table;
 }
 return map;
}
function completionItem(text,label,type){
 return {text:text,displayText:text+(label?"  · "+label:""),className:type?"sql-hint-"+type:""};
}
function sqlCompletionHint(editor){
 const cur=editor.getCursor();
 const line=editor.getLine(cur.line);
 const before=line.slice(0,cur.ch);
 const aliases=aliasMapFromSql(editor.getValue());
 let from=CodeMirror.Pos(cur.line,cur.ch),to=CodeMirror.Pos(cur.line,cur.ch),prefix="",items=[];

 const dotted=before.match(/([A-Za-z_][A-Za-z0-9_]*)\.([A-Za-z_][A-Za-z0-9_]*)?$/);
 if(dotted){
   const qualifier=dotted[1],table=aliases[qualifier]||(DOMAINS[qualifier]?qualifier:null);
   prefix=dotted[2]||"";
   from=CodeMirror.Pos(cur.line,cur.ch-prefix.length);
   if(table)items=Object.keys(DOMAINS[table]).map(col=>completionItem(col,table,"column"));
 }else{
   const word=before.match(/[A-Za-z_][A-Za-z0-9_]*$/);
   prefix=word?word[0]:"";
   from=CodeMirror.Pos(cur.line,cur.ch-prefix.length);
   const context=before.slice(0,cur.ch-prefix.length);
   const wantsTable=/\b(?:FROM|JOIN)\s*$/i.test(context);
   if(wantsTable){
     items=Object.keys(DOMAINS).map(t=>completionItem(t,"relation","table"));
   }else{
     const tables=Object.keys(DOMAINS).map(t=>completionItem(t,"relation","table"));
     const columns=[];
     Object.keys(DOMAINS).forEach(t=>Object.keys(DOMAINS[t]).forEach(col=>columns.push(completionItem(col,t,"column"))));
     const keywords=SQL_HINT_KEYWORDS.map(k=>completionItem(k,"SQL","keyword"));
     items=[...tables,...columns,...keywords];
   }
 }

 const p=prefix.toLowerCase();
 items=items.filter(x=>!p||x.text.toLowerCase().startsWith(p));
 const seen=new Set();
 items=items.filter(x=>{const k=x.text+"|"+x.displayText;if(seen.has(k))return false;seen.add(k);return true;});
 return {list:items,from:from,to:to};
}
function showSqlHints(editor,force){
 if(!window.CodeMirror||!CodeMirror.showHint)return;
 if(!force){
   const cur=editor.getCursor(),line=editor.getLine(cur.line).slice(0,cur.ch);
   const dotted=/[A-Za-z_][A-Za-z0-9_]*\.[A-Za-z0-9_]*$/.test(line);
   const word=(line.match(/[A-Za-z_][A-Za-z0-9_]*$/)||[""])[0];
   if(!dotted&&word.length<2)return;
 }
 CodeMirror.showHint(editor,sqlCompletionHint,{completeSingle:false,alignWithWord:true});
}

function checkStructured(){

 const cardExpected={veh_tracker:"1:1",depot_drivers:"1:M",depot_routes:"1:M",route_stops:"1:M",route_shipments:"M:M"};
 const missing=[...Object.keys(grainExpected).filter(x=>!g[x]),...Object.keys(cardExpected).filter(x=>!k[x])];
 if(missing.length) return {ok:false,msg:"עוד לא. נשארו שדות שלא מולאו."};
 const badGrain=Object.keys(grainExpected).filter(x=>g[x]!==grainExpected[x]);

 if(badGrain.length||badCard.length){
   const parts=[];
   if(badGrain.length) parts.push("בדקו שוב את ה-Grain של: "+badGrain.join(", "));
   if(badCard.length) parts.push("בדקו שוב את ה-cardinality של: "+badCard.map(x=>({veh_tracker:"vehicles → vehicle_trackers",depot_drivers:"depots → drivers",depot_routes:"depots → routes",route_stops:"routes → stops",route_shipments:"routes ↔ shipments"}[x])).join(", "));
   return {ok:false,msg:parts.join(" · ")};
 }
 return {ok:true,msg:"נכון. עכשיו יש לנו מיפוי ברור: מה כל row מייצגת ואיך הישויות קשורות זו לזו."};

function applyTheme(){document.documentElement.setAttribute('data-theme',state.theme==='dark'?'dark':'light');}
function mountEditor(){
 cm=null;
 const ta=document.getElementById('sql');
 if(!ta)return;
 if(window.CodeMirror){
   cm=CodeMirror.fromTextArea(ta,{mode:'text/x-sql',lineNumbers:true,matchBrackets:true,direction:'ltr',lineWrapping:true,extraKeys:{
     'Ctrl-Enter':runCurrent,'Cmd-Enter':runCurrent,
     'Ctrl-Z':editor=>editor.undo(),'Cmd-Z':editor=>editor.undo(),
     'Ctrl-Y':editor=>editor.redo(),'Cmd-Shift-Z':editor=>editor.redo(),
     'Ctrl-Space':editor=>showSqlHints(editor,true)
   }});
   cm.setSize('100%',260);
   cm.on('change',()=>{state.sql[state.stage]=cm.getValue();save();invalidateResult();});
   cm.on('cursorActivity',()=>{rememberEditorCursor();});
   cm.on('focus',()=>{rememberEditorCursor();});
   lastEditorCursor=cm.getDoc().getCursor();
   cm.on('inputRead',(editor,change)=>{
     if(change&&change.origin==="complete")return;
     const typed=((change&&change.text)||[]).join("");
     if(/[A-Za-z0-9_.]/.test(typed))setTimeout(()=>{if(cm===editor)showSqlHints(editor,false);},0);
   });
 }
}
function invalidateResult(){

 const qf=document.getElementById('queryFeedback');if(qf)qf.remove();
}
function runCurrent(){
 const val=pendingRunSql!==null?pendingRunSql:runnableSql();
 pendingRunSql=null;
 if(!val.trim()){lastResult=null;lastError='כתבו שאילתת SQL לפני ההרצה.';render();return;}
 if(!state.attempted.includes(state.stage))state.attempted.push(state.stage);
 save();
 try{lastResult=exec(val);lastError='';queryFeedback='';}
 catch(e){lastResult=null;lastError=friendlySqlError(e.message,val,state.stage);queryFeedback='';}
 render();
}

   const answers=(state.predAnswers||{})[k]||{};
   if(!answers[qi]){
     const qbox=btn.closest('.pred-q');
     if(qbox){
       let msg=qbox.querySelector('.pred-inline-msg');
       if(!msg){msg=document.createElement('div');msg.className='feedback bad pred-inline-msg';qbox.appendChild(msg);}
       msg.textContent='בחרו תשובה לפני הבדיקה.';
     }
     return;
   }
   if(state.predChecked[k]===true)state.predChecked[k]={};
   if(!state.predChecked[k]||typeof state.predChecked[k]!=='object')state.predChecked[k]={};
   state.predChecked[k][qi]=true;
   save();render();
 });
 const toggleRelations=document.getElementById('toggleRelations');const toggleOutput=document.getElementById('toggleOutput');
 if(toggleOutput)toggleOutput.onclick=()=>{state.outputOpen[state.stage]=!state.outputOpen[state.stage];save();render();};
 
 if(toggleRelations)toggleRelations.onclick=()=>{state.graphOpen[state.stage]=!relationGraphOpen();save();render();};

 const runBtn=document.getElementById('run');
 if(runBtn){
   runBtn.onmousedown=()=>{pendingRunSql=runnableSql();};
   runBtn.onclick=runCurrent;
 }

 const hintBtn=document.getElementById('hint');
 if(hintBtn)hintBtn.onclick=()=>{const i=state.hint[state.stage];state.hint[state.stage]=i===undefined?0:Math.min(i+1,curr().hints.length-1);save();render();};
 const solutionBtn=document.getElementById('solution');
 if(solutionBtn)solutionBtn.onclick=()=>{if(!state.solution[state.stage]&&state.hint[state.stage]===undefined&&!confirm('להציג את הפתרון המלא? כדאי קודם לנסות רמז ולהריץ ניסיון משלכם.'))return;state.solution[state.stage]=!state.solution[state.stage];save();render();};

 const clearStage=document.getElementById('clearStage');
 if(clearStage)clearStage.onclick=()=>{if(confirm('לנקות את ה-SQL, ההסבר, הרמז והפתרון של השלב הנוכחי? שאר ההתקדמות תישמר.')){delete state.sql[state.stage];delete state.notes[state.stage];delete state.scratch[state.stage];delete state.predAnswers[state.stage];delete state.predChecked[state.stage];delete state.outputOpen[state.stage];delete state.hint[state.stage];delete state.solution[state.stage];delete state.graphOpen[state.stage];state.attempted=(state.attempted||[]).filter(i=>i!==state.stage);state.completed=state.completed.filter(i=>i!==state.stage);state.skipped=(state.skipped||[]).filter(i=>i!==state.stage);save();clearTransient();render();}};

 const checkQueryNow=()=>{
   const val=editorValue();
   try{
     if(curr().requireNote&&!(state.notes[state.stage]||'').trim()){
       queryFeedback='לפני שבודקים: רשמו קודם את התחזית/ההסבר שלכם בשדה למטה. אפשר להריץ ולחקור, אבל הבדיקה הסופית מחייבת לנסח מה אתם חושבים.';
       save();render();return;
     }
     if(val.trim()&&!state.attempted.includes(state.stage))state.attempted.push(state.stage);
     if(!val.trim()){queryFeedback='כתבו שאילתת SQL לפני הבדיקה.';}
     else if(curr().mapping){
       const user=exec(val);
       queryFeedback='השאילתה תקינה ורצה. התקבלו '+user.values.length+' rows ו-'+user.columns.length+' columns. עכשיו השתמשו בנתונים כדי להסיק Grain ו-cardinality.';
     }else{
       const user=exec(val),exp=exec(curr().expected);
       if(sameResultValues(user,exp)){
         queryFeedback=curr().fanoutTrap?fanoutCorrectFeedback(val):(user.columns.join('|')===exp.columns.join('|')?'נכון. השאילתה מחזירה את התוצאה הצפויה.':'נכון. הערכים נכונים. שמות העמודות שונים מהפתרון, וזה לא פוסל את השאילתה.');
         if(!done(state.stage))state.completed.push(state.stage);
         state.skipped=(state.skipped||[]).filter(i=>i!==state.stage);
       }else{
         const trap=curr().fanoutTrap?fanoutWrongFeedback(val,user,exp):"";
         queryFeedback=trap||diagnoseResult(user,exp,state.stage);
       }
     }
   }catch(e){queryFeedback='לא ניתן להריץ את השאילתה: '+friendlySqlError(e.message,val,state.stage);}
   save();render();
 };
 const checkQuery=document.getElementById('checkQuery');
 if(checkQuery)checkQuery.onclick=checkQueryNow;

 const checkIntro=document.getElementById('checkIntro');
 if(checkIntro)checkIntro.onclick=()=>{if(!done(state.stage))state.completed.push(state.stage);state.skipped=(state.skipped||[]).filter(i=>i!==state.stage);feedback='מעולה. אפשר להמשיך — והמילון יישאר זמין בצד.';save();render();};

 const checkAnswer=document.getElementById('check');
 if(checkAnswer)checkAnswer.onclick=()=>{const r=checkStructured();feedback=r.msg;if(r.ok){if(!done(state.stage))state.completed.push(state.stage);state.skipped=(state.skipped||[]).filter(i=>i!==state.stage);}save();render();};

 const checkDec=document.getElementById('checkDecision');
 if(checkDec)checkDec.onclick=()=>{const r=checkDecision();feedback=r.msg;if(r.ok){if(!done(state.stage))state.completed.push(state.stage);state.skipped=(state.skipped||[]).filter(i=>i!==state.stage);}save();render();};

 document.getElementById('prev').onclick=()=>{if(state.stage>0){state.stage--;save();clearTransient();render();}};
 document.getElementById('next').onclick=()=>{if(done(state.stage)&&state.stage<STAGES.length-1){state.stage++;save();clearTransient();render();}};
 document.getElementById('reset').onclick=()=>{if(confirm('לאפס את כל ההתקדמות והכתיבה?')){localStorage.removeItem(STORAGE_KEY);state=defaults();clearTransient();render();}};

 const theme=document.getElementById('theme');
 if(theme)theme.onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';save();render();};

 const exp=document.getElementById('export');
 if(exp)exp.onclick=()=>{
   const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
   const url=URL.createObjectURL(blob);
   const a=document.createElement('a');a.href=url;a.download='routecraft-progress.json';a.click();
   URL.revokeObjectURL(url);
 };
 const impBtn=document.getElementById('importBtn'),impFile=document.getElementById('importFile');
 if(impBtn&&impFile){
   impBtn.onclick=()=>impFile.click();
   impFile.onchange=()=>{
     const file=impFile.files[0];if(!file)return;
     const r=new FileReader();
     r.onload=()=>{try{const parsed=JSON.parse(r.result);state=migrateState(parsed);save();clearTransient();render();alert('ההתקדמות יובאה בהצלחה.');}catch(e){alert('קובץ לא תקין: '+e.message);}};
     r.readAsText(file);
   };
 }
}
async function init(){
 try{
   const SQL=await initSqlJs({locateFile:f=>'https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/'+f});
   db=new SQL.Database();
   db.run(SEED_SQL);
 }catch(e){dbError='SQLite לא נטען: '+e.message;}
 render();
}
render();init();
</script>
