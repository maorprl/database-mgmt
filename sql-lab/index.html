OM stops s WHERE s.route_id=r.route_id) AS stop_count,COALESCE((SELECT SUM(s.delivered_packages) FROM stops s WHERE s.route_id=r.route_id),0) AS delivered_packages FROM routes r ORDER BY r.route_id;"}],starter:"",expected:"SELECT r.route_code,COUNT(s.stop_id) stop_count,COALESCE(SUM(s.delivered_packages),0) delivered_packages FROM routes r LEFT OUTER JOIN stops s ON s.route_id=r.route_id GROUP BY r.route_id,r.route_code ORDER BY r.route_id;",note:"הפרידו בין שמירת ה-parent לבין חישוב המדדים.",hints:["שמרו כל route בצד שמאל.","COUNT(s.stop_id) אינו סופר את row ה-NULL שנוצרה ללא match.","COALESCE הופך SUM ללא values ל-0."],solution:"SELECT r.route_code,COUNT(s.stop_id) AS stop_count,COALESCE(SUM(s.delivered_packages),0) AS delivered_packages FROM routes r LEFT OUTER JOIN stops s ON s.route_id=r.route_id GROUP BY r.route_id,r.route_code ORDER BY r.route_id;",principle:"כדי לשמור parents עם אפס matches, משלבים LEFT OUTER JOIN עם COUNT(column) ו-COALESCE."},
{title:"מה בדיוק אנחנו סופרים?",short:"שלוש ספירות",eye:"משמעות המדד · rows, values וקטגוריות",context:"בקרת איכות רוצה להבדיל בין rows שנוצרו בחיבור, stops אמיתיות, דיווחי הגעה וסטטוסים שונים.",task:"בקרת האיכות צריכה ארבעה מדדי ספירה לכל route כדי להבחין בין rows שנוצרו, stops אמיתיות, דיווחי הגעה וסטטוסים שונים — גם כשאין stops.",output:"route_code, joined_rows, stop_count, reported_arrivals, status_variety · joined_rows=מספר rows לאחר החיבור; stop_count=stops אמיתיות; reported_arrivals=arrived_at שאינו NULL; status_variety=מספר arrival_status שונים · מיון לפי route_id.",pred:"חזו את ארבעת הערכים למסלול ללא stops.",predQuiz:[{q:"מה COUNT(*) מחזיר למסלול שנשמר ללא match?",opts:[["zero","0"],["one","1"],["null","NULL"]],ans:"one",why:"החיבור החיצוני יוצר row אחת עם NULL בצד ה-stops, ו-COUNT(*) סופר אותה."},{q:"מה COUNT(s.stop_id) מחזיר באותו מצב?",opts:[["zero","0"],["one","1"],["null","NULL"]],ans:"zero",why:"COUNT(column) מתעלם מ-NULL."},{q:"מה COUNT(DISTINCT s.arrival_status) מחזיר?",opts:[["zero","0"],["one","1"],["null","NULL"]],ans:"zero",why:"אין status שאינו NULL לספור."}],lesson:"COUNT(*) סופר rows. COUNT(column) סופר רק values שאינם NULL. COUNT(DISTINCT column) סופר values שונים שאינם NULL.",operation:{"mode":"guided","tool":"COUNT לפי משמעות","model":"אחרי LEFT JOIN יכולה להיות row גם בלי stop אמיתית, וחלק מהערכים בתוך stop יכולים להיות NULL.","need":"לחשב כמה סוגי ספירה שונים, כאשר כל אחד מהם סופר דבר מעט אחר.","reminder":"תזכורת: COUNT(*) סופר rows; COUNT(column) סופר values שאינם NULL; COUNT(DISTINCT column) סופר values שונים שאינם NULL.","q":"איזה סוג COUNT מתאים לכל מדד?","opts":[["variants","לבחור צורת COUNT לפי מה שכל metric מייצג"],["all-star","להשתמש ב-COUNT(*) לכולם"],["all-id","להשתמש ב-COUNT(stop_id) לכולם"],["sum","להשתמש רק ב-SUM"]],"ans":"variants","why":"כל COUNT עונה על שאלה שונה: rows, values שאינם NULL, או values שונים.","hint":"בדקו מה בדיוק אמור להיספר בכל column, ומה קורה כאשר הערך NULL.","alt":"SUM(CASE WHEN ... THEN 1 ELSE 0 END) יכול לחקות חלק מהספירות, אבל COUNT המתאים לרוב מבטא את הכוונה בצורה פשוטה יותר."},sanity:{"q":"ב־RB-0821-B יש 2 stop rows. רק לאחת יש arrived_at, וה-statuses הם late ו־pending. מה הערכים joined_rows / stop_count / reported_arrivals / status_variety?","opts":[["2-2-1-2","2 / 2 / 1 / 2"],["2-2-2-2","2 / 2 / 2 / 2"],["2-1-1-2","2 / 1 / 1 / 2"],["1-2-1-1","1 / 2 / 1 / 1"]],"ans":"2-2-1-2","why":"יש 2 joined rows, שני stop_id לא־NULL, arrived_at אחד לא־NULL ושני ערכי arrival_status שונים.","after":"בדקו את RB-0821-B: 2 / 2 / 1 / 2. אחר כך השוו למסלול ללא stops כדי לראות את ההבדל בין COUNT(*) ל־COUNT(column)."},altSolutions:[{"label":"Conditional counting","sql":"SELECT r.route_code,COUNT(*) AS joined_rows,SUM(CASE WHEN s.stop_id IS NOT NULL THEN 1 ELSE 0 END) AS stop_count,SUM(CASE WHEN s.arrived_at IS NOT NULL THEN 1 ELSE 0 END) AS reported_arrivals,COUNT(DISTINCT s.arrival_status) AS status_variety FROM routes r LEFT OUTER JOIN stops s ON s.route_id=r.route_id GROUP BY r.route_id,r.route_code ORDER BY r.route_id;"}],starter:"",expected:"SELECT r.route_code,COUNT(*) joined_rows,COUNT(s.stop_id) stop_count,COUNT(s.arrived_at) reported_arrivals,COUNT(DISTINCT s.arrival_status) status_variety FROM routes r LEFT OUTER JOIN stops s ON s.route_id=r.route_id GROUP BY r.route_id,r.route_code ORDER BY r.route_id;",note:"אותו input יכול להפיק מדדים שונים לפי מה שהפונקציה סופרת.",hints:["COUNT(*) סופר rows.","COUNT(column) סופר values שאינם NULL.","COUNT(DISTINCT column) סופר values שונים שאינם NULL."],solution:"SELECT r.route_code,COUNT(*) AS joined_rows,COUNT(s.stop_id) AS stop_count,COUNT(s.arrived_at) AS reported_arrivals,COUNT(DISTINCT s.arrival_status) AS status_variety FROM routes r LEFT OUTER JOIN stops s ON s.route_id=r.route_id GROUP BY r.route_id,r.route_code ORDER BY r.route_id;",principle:"COUNT(*) סופר rows; COUNT(column) מתעלם מ-NULL; COUNT(DISTINCT column) סופר values שונים."},
{title:"אילו אתרים נושאים עומס דרך גבוה?",short:"אתרים מעל סף",eye:"בקשה ניהולית · סף על סיכום",context:"מנהל הרשת רוצה להתמקד ב-depots שסך מרחקי המסלולים המתוכננים שלהם הוא לפחות 200 ק״מ.",task:"מנהל הרשת צריך לזהות את ה-depots שעוברים את סף העומס ולראות מה המרחק המצטבר שתוכנן בכל אחד מהם.",output:"depot_name, total_km · מיון לפי total_km מהגבוה לנמוך.",pred:"האם הסף חל על route בודדת או על סך routes של depot?",predQuiz:[{q:"מתי אפשר להעריך את התנאי total_km >= 200?",opts:[["before","לפני שמקבצים"],["after","אחרי שמסכמים לכל depot"],["never","אי אפשר"]],ans:"after",why:"הסף חל על aggregate של group, ולכן נבדק אחרי יצירת הקבוצות."}],lesson:"WHERE מסנן rows לפני aggregation. HAVING מסנן קבוצות אחרי GROUP BY — ולכן תנאי על SUM או COUNT שייך בדרך כלל ל־HAVING.",operation:{"mode":"teach","tool":"GROUP BY + HAVING","newTool":"HAVING","model":"לכל depot יכולות להיות כמה routes, ולכל route יש distance_km.","need":"לחשב מרחק כולל לכל depot, ואז להשאיר רק depots שסך המרחק שלהם לפחות 200 ק״מ.","why":"קודם מאגדים routes לכל depot. אחר כך HAVING משאיר רק קבוצות שסך המרחק שלהן לפחות 200.","alt":"אפשר לבצע aggregation ב-CTE או subquery ואז להשתמש ב-WHERE על total_km בשאילתה החיצונית. זו אלטרנטיבה שקולה."},sanity:{"q":"Northgate כולל 84+126 ק״מ, ו־Riverbend כולל 62+118+55 ק״מ. עם HAVING של total_km >= 200, מי אמור לעבור?","opts":[["ng","Northgate Hub בלבד"],["rb","Riverbend Crossdock בלבד"],["ng-rb","Northgate Hub + Riverbend Crossdock"],["all","כל ה-depots"]],"ans":"ng-rb","why":"Northgate מסכם ל־210 ק״מ ו־Riverbend ל־235 ק״מ; שניהם עוברים את הסף.","after":"התוצאה אמורה לכלול Riverbend Crossdock = 235 ו־Northgate Hub = 210, בסדר יורד לפי total_km."},altSolutions:[{"label":"Subquery + WHERE","sql":"SELECT depot_name,total_km FROM (SELECT d.depot_id,d.depot_name,SUM(r.distance_km) AS total_km FROM depots d INNER JOIN routes r ON r.depot_id=d.depot_id GROUP BY d.depot_id,d.depot_name) x WHERE total_km>=200 ORDER BY total_km DESC;"}],starter:"",expected:"SELECT d.depot_name,SUM(r.distance_km) total_km FROM depots d INNER JOIN routes r ON r.depot_id=d.depot_id GROUP BY d.depot_id,d.depot_name HAVING SUM(r.distance_km)>=200 ORDER BY total_km DESC;",note:"הבחינו בין filter על row לבין filter על group.",hints:["קבצו לפי depot.","סכמו distance_km בכל קבוצה.","סינון aggregate מתבצע ב-HAVING."],solution:"SELECT d.depot_name,SUM(r.distance_km) AS total_km FROM depots d INNER JOIN routes r ON r.depot_id=d.depot_id GROUP BY d.depot_id,d.depot_name HAVING SUM(r.distance_km)>=200 ORDER BY total_km DESC;",principle:"HAVING מסנן groups לפי ערך aggregate; WHERE מסנן input rows לפני aggregation."},
{title:"איך נראית הפעילות בכל יום?",short:"דוח יומי",eye:"שינוי יחידת ניתוח · מסלולים ליום",context:"ישיבת הבוקר צריכה תמונה יומית במקום רשימת routes בודדות.",task:"בנו שורה לכל service_date ובה מספר המסלולים, המרחק הכולל ומספר המסלולים שהושלמו.",output:"service_date, route_count, total_km, completed_routes · מיון לפי service_date.",pred:"איזו יחידה נעלמת ואיזו יחידה נוצרת בתוצאה?",predQuiz:[{q:"מה ה-output Grain החדש?",opts:[["route","route"],["depot","depot"],["day","service_date"],["vehicle","vehicle"]],ans:"day",why:"ה-rows המקוריות מתקבצות לשורה אחת לכל תאריך שירות."}],lesson:"אין כאן JOIN: כל הנתונים כבר נמצאים ב־routes. GROUP BY service_date משנה את ה־Grain מ־route ל־day, ו־CASE בתוך aggregate מאפשר לספור רק rows שעומדות בתנאי.",operation:{"mode":"teach","tool":"GROUP BY + conditional aggregation","newTool":"CASE בתוך aggregation","model":"כל row ב-routes היא route אחת עם service_date, status ו-distance_km.","need":"לאחד את ה-routes של אותו יום ל-row אחת שמסכמת את הפעילות באותו תאריך.","why":"כל הנתונים כבר נמצאים ב-routes. GROUP BY service_date יוצר row אחת לכל יום, וה-CASE סופר רק routes שהושלמו.","alt":"ב-SQLite אפשר גם להשתמש ב-COUNT(*) FILTER (WHERE status='completed'). שתי הדרכים נכונות; CASE היא תבנית נפוצה וניידת."},sanity:{"q":"ב־2026-08-21 יש 4 routes במרחקים 126, 118, 69 ו־51 ק״מ; 3 מהן completed. מה צריכה להיות שורת היום?","opts":[["4-364-3","route_count = 4, total_km = 364, completed_routes = 3"],["4-364-4","4 / 364 / 4"],["3-364-3","3 / 364 / 3"],["4-313-3","4 / 313 / 3"]],"ans":"4-364-3","why":"ה-Grain החדש הוא service_date: ארבע ה-routes מתכנסות ל-row אחת עם סכום 364 ושלוש completed.","after":"חפשו את 2026-08-21: route_count = 4, total_km = 364, completed_routes = 3."},altSolutions:[{"label":"COUNT + CASE","sql":"SELECT service_date,COUNT(*) AS route_count,SUM(distance_km) AS total_km,COUNT(CASE WHEN status='completed' THEN 1 END) AS completed_routes FROM routes GROUP BY service_date ORDER BY service_date;"}],starter:"",expected:"SELECT service_date,COUNT(*) route_count,SUM(distance_km) total_km,SUM(CASE WHEN status='completed' THEN 1 ELSE 0 END) completed_routes FROM routes GROUP BY service_date ORDER BY service_date;",note:"הקיבוץ משנה את משמעות row אחת.",hints:["service_date הוא ה-key של ה-Grain החדש.","COUNT(*) סופר routes בכל יום.","CASE יכול להפוך תנאי completed ל-1 או 0 לפני SUM."],solution:"SELECT service_date,COUNT(*) AS route_count,SUM(distance_km) AS total_km,SUM(CASE WHEN status='completed' THEN 1 ELSE 0 END) AS completed_routes FROM routes GROUP BY service_date ORDER BY service_date;",principle:"GROUP BY משנה Grain: כמה source rows הופכות ל-row אחת לכל קבוצה."},
{title:"כמה מקטעים עבר כל משלוח?",short:"מסלולי shipment",eye:"מסלול שעובר דרך גשר",scratch:"ציירו routes מצד אחד ו-shipments מצד שני. באמצע שימו route_shipments וכתבו מה מייצגת row בגשר.",context:"משלוחים יכולים לעבור ביותר ממסלול אחד בזמן העברה בין אתרים. מנהלת השירות רוצה לדעת כמה route segments הוקצו לכל shipment, כולל כאלה שלא שובצו.",task:"מנהלת השירות רוצה לראות לכל shipment כמה route segments הוקצו לו, כולל shipments שעדיין לא שובצו.",output:"tracking_code, route_count · מיון לפי shipment_id.",pred:"מה ה-Grain של relation הגשר, ומה הוא אומר על הקשר הכולל?",predQuiz:[{q:"מה cardinality בין routes ל-shipments דרך הגשר?",opts:[["1:1","1:1"],["1:M","1:M"],["M:M","M:M"]],ans:"M:M",why:"route יכולה לשאת כמה shipments, ו-shipment יכולה לעבור בכמה routes."}],lesson:"Bridge relation מפרקת M:M לשני קשרי 1:M. כל row ב־route_shipments מייצגת relationship אחד בין route ל־shipment.",operation:{"mode":"independent","tool":"LEFT OUTER JOIN לגשר + GROUP BY","model":"route_shipments היא טבלת הגשר בין routes ל-shipments. כל row בה היא שיוך אחד בין route ל-shipment.","need":"להחזיר row אחת לכל shipment ולספור בכמה routes הוא שובץ. Shipment בלי שיוך צריך לקבל 0.","q":"איך שומרים את כל ה-shipments וסופרים את השיוכים של כל אחד?","opts":[["left-group","LEFT JOIN shipments → route_shipments ואז GROUP BY shipment"],["inner","INNER JOIN בלבד"],["exists","EXISTS בלבד"],["cross","CROSS JOIN routes × shipments"]],"ans":"left-group","why":"route_shipments מכילה row אחת לכל שיוך. LEFT JOIN שומר גם shipment בלי שיוך, ו-GROUP BY סופר את השיוכים לכל shipment.","hint":"route_shipments היא המקום שבו מתועדים השיוכים עצמם.","alt":"Correlated subquery שמבצעת COUNT(*) ב-route_shipments עבור כל shipment יכולה להחזיר אותה תוצאה."},sanity:{"q":"RC-94004 מופיע ב־route_shipments פעמיים — על routes 1003 ו־1004. מה route_count שלו צריך להיות?","opts":[["0","0"],["1","1"],["2","2"],["4","4"]],"ans":"2","why":"כל row בגשר מייצגת שיוך route–shipment אחד; לכן שתי rows עבור shipment משמען שני route segments.","after":"RC-94004 אמור לקבל route_count = 2. RC-94015, שאינו מופיע בגשר, אמור להישאר בדוח עם 0."},altSolutions:[{"label":"Correlated subquery","sql":"SELECT s.tracking_code,(SELECT COUNT(*) FROM route_shipments rs WHERE rs.shipment_id=s.shipment_id) AS route_count FROM shipments s ORDER BY s.shipment_id;"}],starter:"",expected:"SELECT s.tracking_code,COUNT(rs.route_id) route_count FROM shipments s LEFT OUTER JOIN route_shipments rs ON rs.shipment_id=s.shipment_id GROUP BY s.shipment_id,s.tracking_code ORDER BY s.shipment_id;",note:"הגשר מייצג relationships, לא רק פרטי משלוח.",hints:["התחילו מכל shipments כדי לשמור גם shipment ללא assignment.","כל row בגשר מייצגת route↔shipment אחת.","COUNT(rs.route_id) סופר את קשרי המסלול בפועל."],solution:"SELECT s.tracking_code,COUNT(rs.route_id) AS route_count FROM shipments s LEFT OUTER JOIN route_shipments rs ON rs.shipment_id=s.shipment_id GROUP BY s.shipment_id,s.tracking_code ORDER BY s.shipment_id;",principle:"Bridge relation מפרקת M:M לשני קשרי 1:M; כל row בה מייצגת relationship."},
{title:"תמונת כוח אדם ופעילות לכל אתר",short:"שני ענפים",eye:"שני מקורות מדדים · בדיקת ניפוח",scratch:"ציירו depot עם ענף drivers וענף routes. סמנו את ה-Grain של כל מקור ואת ה-Grain שבו הייתם רוצים לחבר את המדדים הסופיים.",context:"מנהלת האזור רוצה report אחד עם כוח אדם ופעילות מסלולים ברמת depot. לשני המדדים יש child rows עצמאיות.",task:"מנהלת האזור צריכה report ברמת depot שמראה כמה drivers משויכים לכל אתר, כמה routes תוכננו ממנו ומה המרחק הכולל של אותם routes. גם depot בלי פעילות צריך להישאר בדוח.",output:"depot_name, driver_count, route_count, total_km · מיון לפי depot_id.",pred:"חזו מה יקרה ל-counts ול-SUM אם תחברו את שני הענפים הגולמיים ישירות.",requireNote:true,lesson:"כששני ענפי 1:M תורמים metrics, JOIN גולמי יכול לנפח COUNT וגם SUM. הפתרון הבטוח הוא קודם לאגד כל ענף ל־Grain המשותף, ורק אז לחבר.",operation:{"mode":"teach","tool":"Pre-aggregation / CTE לפני JOIN","newTool":"Pre-aggregation","model":"ל-depot יש שני ענפים נפרדים: drivers ו-routes. אם מחברים את שניהם גולמית, rows עלולות להכפיל זו את זו.","need":"להחזיר row אחת לכל depot עם מספר drivers, מספר routes וסך המרחק, בלי לנפח אף מדד.","why":"אם נחבר drivers ו-routes ישירות, כל driver יכול להיפגש עם כל route באותו depot. לכן מסכמים כל ענף קודם ל-row אחת לכל depot ורק אז מחברים.","alt":"אפשר להשתמש ב-correlated subqueries נפרדות לכל metric. COUNT(DISTINCT ...) יכול לתקן חלק מה-counts, אבל אינו פתרון כללי ל-SUM ועלול להסתיר בעיית Grain."},sanity:{"q":"לפני החיבור הסופי, מה ה-baseline של Riverbend Crossdock במקור? ספרו ב־drivers וב־routes וסכמו distance_km.","opts":[["3-3-235","3 drivers / 3 routes / 235 km"],["9-9-705","9 / 9 / 705"],["3-9-705","3 / 9 / 705"],["3-3-705","3 / 3 / 705"]],"ans":"3-3-235","why":"במקור יש 3 drivers ו־3 routes, והמרחקים 62+118+55 מסתכמים ל־235. JOIN גולמי בין הענפים עלול לנפח את המדדים.","after":"ב-row של Riverbend Crossdock הדוח צריך לשמר בדיוק 3 drivers, 3 routes ו־235 km. אם קיבלתם 9 או 705, ה-fan-out נכנס ל-aggregation."},altSolutions:[{"label":"Correlated subqueries","sql":"SELECT d.depot_name,(SELECT COUNT(*) FROM drivers dr WHERE dr.depot_id=d.depot_id) AS driver_count,(SELECT COUNT(*) FROM routes r WHERE r.depot_id=d.depot_id) AS route_count,COALESCE((SELECT SUM(r.distance_km) FROM routes r WHERE r.depot_id=d.depot_id),0) AS total_km FROM depots d ORDER BY d.depot_id;"}],starter:"",expected:"WITH drv AS (SELECT depot_id,COUNT(*) driver_count FROM drivers GROUP BY depot_id), rte AS (SELECT depot_id,COUNT(*) route_count,SUM(distance_km) total_km FROM routes GROUP BY depot_id) SELECT d.depot_name,COALESCE(drv.driver_count,0) driver_count,COALESCE(rte.route_count,0) route_count,COALESCE(rte.total_km,0) total_km FROM depots d LEFT OUTER JOIN drv ON drv.depot_id=d.depot_id LEFT OUTER JOIN rte ON rte.depot_id=d.depot_id ORDER BY d.depot_id;",note:"כתבו מה יוכפל ולמה, ואז תכננו row אחת לכל depot מכל ענף.",hints:["זהו 1:M × 1:M.","צמצמו כל child ל-row אחת לכל depot לפני החיבור.","CTE אחד ל-drivers ו-CTE אחד ל-routes."],solution:"WITH drv AS (SELECT depot_id,COUNT(*) AS driver_count FROM drivers GROUP BY depot_id), rte AS (SELECT depot_id,COUNT(*) AS route_count,SUM(distance_km) AS total_km FROM routes GROUP BY depot_id) SELECT d.depot_name,COALESCE(drv.driver_count,0) AS driver_count,COALESCE(rte.route_count,0) AS route_count,COALESCE(rte.total_km,0) AS total_km FROM depots d LEFT OUTER JOIN drv ON drv.depot_id=d.depot_id LEFT OUTER JOIN rte ON rte.depot_id=d.depot_id ORDER BY d.depot_id;",principle:"כששני ענפי 1:M תורמים מדדים, מבצעים pre-aggregation לכל ענף לפני JOIN."},
{title:"Capstone: איפה נדרשת התערבות?",short:"Capstone",eye:"משימה פתוחה · לבחור כלים",scratch:"מפו את ה-relations הרלוונטיים. סמנו איזה relation תורם values למדד, אילו relations רק בודקים תנאי, ואיפה צריך לשמור rows גם בלי match.",context:"ראש המשמרת רוצה shortlist של depots שבהם נמסרו לפחות 40 חבילות, הופיע לפחות route delayed, ואין route cancelled.",task:"ה-shortlist צריך לזהות את ה-depots שעומדים בכל שלושת התנאים העסקיים ולתת לראש המשמרת את היקף המסירות בכל אחד מהם.",output:"depot_name, delivered_packages · מיון לפי depot_name.",pred:"מה תהיה row אחת בתוצאה הסופית?",requireNote:true,operation:{"mode":"independent","tool":"JOIN לערכים + EXISTS/NOT EXISTS לתנאים + GROUP BY/HAVING","model":"חלק מה-relations מספקות ערכים לדוח, וחלק רק קובעות אם depot עומד בתנאי.","need":"להחזיר depot רק אם הוא עומד בכל התנאים, ובמקביל לחשב עבורו את סך delivered_packages.","q":"איזו דרך נותנת לכל relation תפקיד ברור: מדד, קיום או היעדר?","opts":[["roles","JOIN למסלול שמספק values; EXISTS/NOT EXISTS לתנאי קיום; GROUP BY/HAVING למדד המצטבר"],["join-all","JOIN לכל דבר ואז DISTINCT"],["exists-all","EXISTS לכל relation בלי JOIN"],["group-first","GROUP BY depots לפני שמגיעים ל-stops"]],"ans":"roles","why":"stops נותנת את המספר שאותו מסכמים. delayed ו-cancelled הן תנאי כן/לא. לכן JOIN משמש למדד, EXISTS ו-NOT EXISTS לתנאים, ו-GROUP BY/HAVING לסיכום.","hint":"סמנו ליד כל relation: האם היא נותנת מספר לפלט, או רק בודקת תנאי?","alt":"אפשר להכין CTEs מצטברים מראש למסירות ולסטטוסים ואז לחבר ביניהם ברמת depot. זו דרך טובה במיוחד בדוחות גדולים."},sanity:{"q":"בדיקה ידנית של התנאים מראה של־Riverbend ול־Hillview יש delayed route, אין cancelled route, וסך delivered_packages שלהם עובר 40. מי אמור להישאר ב-shortlist?","opts":[["rb","Riverbend Crossdock בלבד"],["hv","Hillview Station בלבד"],["rb-hv","Riverbend Crossdock + Hillview Station"],["all","כל ה-depots עם route"]],"ans":"rb-hv","why":"שני ה-depots עומדים בכל שלושת התנאים; שאר ה-depots נכשלים לפחות באחד מהם.","after":"התוצאה אמורה להכיל Hillview Station = 75 ו־Riverbend Crossdock = 82 delivered_packages."},altSolutions:[{"label":"CTEs לפי תפקיד","sql":"WITH delivered AS (SELECT r.depot_id,SUM(s.delivered_packages) AS delivered_packages FROM routes r INNER JOIN stops s ON s.route_id=r.route_id GROUP BY r.depot_id), flags AS (SELECT depot_id,MAX(CASE WHEN status='delayed' THEN 1 ELSE 0 END) AS has_delayed,MAX(CASE WHEN status='cancelled' THEN 1 ELSE 0 END) AS has_cancelled FROM routes GROUP BY depot_id) SELECT d.depot_name,del.delivered_packages FROM depots d INNER JOIN delivered del ON del.depot_id=d.depot_id INNER JOIN flags f ON f.depot_id=d.depot_id WHERE del.delivered_packages>=40 AND f.has_delayed=1 AND f.has_cancelled=0 ORDER BY d.depot_name;"}],starter:"",expected:"SELECT d.depot_name,SUM(s.delivered_packages) delivered_packages FROM depots d INNER JOIN routes r ON r.depot_id=d.depot_id INNER JOIN stops s ON s.route_id=r.route_id WHERE EXISTS (SELECT 1 FROM routes rd WHERE rd.depot_id=d.depot_id AND rd.status='delayed') AND NOT EXISTS (SELECT 1 FROM routes rc WHERE rc.depot_id=d.depot_id AND rc.status='cancelled') GROUP BY d.depot_id,d.depot_name HAVING SUM(s.delivered_packages)>=40 ORDER BY d.depot_name;",note:"הסבירו בקצרה למה כל relation מחוברת או נבדקת.",hints:["stops מכילה את values שצריך לסכם.","delayed הוא תנאי קיום בלבד.","cancelled הוא תנאי היעדר; הסף נבדק אחרי aggregation."],solution:"SELECT d.depot_name,SUM(s.delivered_packages) AS delivered_packages FROM depots d INNER JOIN routes r ON r.depot_id=d.depot_id INNER JOIN stops s ON s.route_id=r.route_id WHERE EXISTS (SELECT 1 FROM routes rd WHERE rd.depot_id=d.depot_id AND rd.status='delayed') AND NOT EXISTS (SELECT 1 FROM routes rc WHERE rc.depot_id=d.depot_id AND rc.status='cancelled') GROUP BY d.depot_id,d.depot_name HAVING SUM(s.delivered_packages)>=40 ORDER BY d.depot_name;",principle:"במשימה פתוחה בוחרים פעולה לפי תפקיד relation: מדד, קיום, היעדר או שמירת Grain."},
{title:"מבחן קבלה: reconcile תוכנית מול ביצוע",short:"מבחן קבלה",eye:"Database + בקשה עסקית · בלי שם כלי",scratch:"שרטטו את ה-relations הרלוונטיים, רשמו 2–4 מספרי בקרה, והחליטו כיצד לטפל במסלול ללא stops ובדיווח NULL.",context:"זהו פורמט של מבחן עבודה: קיבלתם database וחשד לפער תפעולי. אין מסלול תחבירי מוכתב.",task:"Operations רוצים לזהות routes שאינן cancelled ושבהן הביצוע בפועל נמוך מהתכנון. דיווח delivered_packages חסר מייצג שאין כמות מסירה מדווחת לאותה stop, ולכן לצורך הבדיקה הוא נחשב 0.",output:"depot_name, route_code, status, planned_packages, delivered_packages, gap · מיון לפי gap מהגדול לקטן ואז route_code.",pred:"מה תהיה row אחת בתוצאה הסופית?",requireNote:true,operation:{"mode":"guided","tool":"LEFT JOIN + GROUP BY + COALESCE + HAVING","model":"ל-route יכולות להיות כמה stops, ובחלק מה-stops delivered_packages הוא NULL.","need":"להחזיר row אחת לכל route רלוונטית, להשוות planned מול delivered, ולזהות רק routes שבהן הביצוע נמוך מהתכנון.","reminder":"תזכורת: LEFT JOIN שומר parent ללא child; GROUP BY מחזיר Grain של route; COALESCE נותן ערך חלופי ל-NULL; HAVING מסנן לפי aggregate.","q":"איזה רצף פעולות שומר routes, מסכם stops ומסנן לפי הפער?","opts":[["combo","LEFT JOIN → GROUP BY route → COALESCE על aggregates → HAVING"],["inner","INNER JOIN → WHERE delivered < planned"],["exists","EXISTS בלבד"],["distinct","JOIN → DISTINCT בלי aggregation"]],"ans":"combo","why":"LEFT JOIN שומר routes גם בלי stops, GROUP BY מסכם לכל route, COALESCE מטפל ב-NULL, ו-HAVING משאיר רק routes שבהן הביצוע נמוך מהתכנון.","hint":"פרקו את הבעיה: מי חייב להישאר, מה ה-Grain הסופי, מה עושים עם NULL, ומתי משווים את הסכומים.","alt":"אפשר לאגד stops ב-CTE ברמת route ואז LEFT JOIN ל-routes ולסנן ב-WHERE בשאילתה החיצונית. IFNULL הוא גם חלופה SQLite-ית ל-COALESCE."},sanity:{"q":"ב־RB-0821-B תוכננו 40+27 חבילות. דווחו 25 ו־NULL, כאשר NULL נחשב 0. מה ה-gap של ה-route?","opts":[["15","15"],["27","27"],["42","42"],["67","67"]],"ans":"42","why":"planned = 67, delivered = 25, ולכן gap = 42.","after":"חפשו RB-0821-B: planned_packages = 67, delivered_packages = 25, gap = 42. זהו anchor טוב לבדיקת כל לוגיקת ה-reconcile."},altSolutions:[{"label":"CTE ברמת route","sql":"WITH stop_totals AS (SELECT route_id,COALESCE(SUM(planned_packages),0) AS planned_packages,COALESCE(SUM(delivered_packages),0) AS delivered_packages FROM stops GROUP BY route_id) SELECT d.depot_name,r.route_code,r.status,COALESCE(st.planned_packages,0) AS planned_packages,COALESCE(st.delivered_packages,0) AS delivered_packages,COALESCE(st.planned_packages,0)-COALESCE(st.delivered_packages,0) AS gap FROM depots d INNER JOIN routes r ON r.depot_id=d.depot_id LEFT OUTER JOIN stop_totals st ON st.route_id=r.route_id WHERE r.status<>'cancelled' AND COALESCE(st.delivered_packages,0)<COALESCE(st.planned_packages,0) ORDER BY gap DESC,r.route_code;"}],starter:"",expected:"SELECT d.depot_name,r.route_code,r.status,COALESCE(SUM(s.planned_packages),0) planned_packages,COALESCE(SUM(s.delivered_packages),0) delivered_packages,COALESCE(SUM(s.planned_packages),0)-COALESCE(SUM(s.delivered_packages),0) gap FROM depots d INNER JOIN routes r ON r.depot_id=d.depot_id LEFT OUTER JOIN stops s ON s.route_id=r.route_id WHERE r.status<>'cancelled' GROUP BY r.route_id,d.depot_name,r.route_code,r.status HAVING COALESCE(SUM(s.delivered_packages),0)<COALESCE(SUM(s.planned_packages),0) ORDER BY gap DESC,r.route_code;",note:"אל תחפשו שם של operator; התחילו מה-Grain ומהמשמעות העסקית של NULL.",hints:["row אחת בפלט מייצגת route.","route ללא stops צריכה להישאר כדי שתוכלו להחליט אם יש בה gap.","הסינון על הפער נעשה אחרי סיכום stops לכל route."],solution:"SELECT d.depot_name,r.route_code,r.status,COALESCE(SUM(s.planned_packages),0) AS planned_packages,COALESCE(SUM(s.delivered_packages),0) AS delivered_packages,COALESCE(SUM(s.planned_packages),0)-COALESCE(SUM(s.delivered_packages),0) AS gap FROM depots d INNER JOIN routes r ON r.depot_id=d.depot_id LEFT OUTER JOIN stops s ON s.route_id=r.route_id WHERE r.status<>'cancelled' GROUP BY r.route_id,d.depot_name,r.route_code,r.status HAVING COALESCE(SUM(s.delivered_packages),0)<COALESCE(SUM(s.planned_packages),0) ORDER BY gap DESC,r.route_code;",principle:"Reconciliation אמין מגדיר Grain, שומר יחידות חסרות, מטפל ב-NULL ומסנן רק אחרי חישוב המדדים."},

function mixedInlineHtml(text){
 return esc(text||'').replace(/`([^`]+)`/g,'<bdi class="inline-ltr" dir="ltr">$1</bdi>');
}

function formatStageTerms(text,seen){
 let out=esc(text||'');
 const defs=[["relation","טבלה"],["tuple","שורה"],["attribute","עמודה"],["value","ערך"]];
 defs.forEach(([term,he])=>{
   if(seen.has(term))return;
   const re=new RegExp("\\b"+term+"\\b(?!\\s*\\("+he+"\\))","i");
   if(re.test(out)){out=out.replace(re,term+" ("+he+")");seen.add(term);}
 });
 return out;
}

function migrateState(x){
 const raw=x||{};
 const out=Object.assign(defaults(),raw);
 function newIndex(i,forCurrent){
   i=Number(i);
   if(!Number.isInteger(i))return null;
   if(i===0)return 0;
   if(i===1||i===2)return forCurrent?1:null;
   return i>=3?i-2:null;
 }
 function remapList(list){
   const seen=new Set();
   (Array.isArray(list)?list:[]).forEach(i=>{const n=newIndex(i,false);if(n!==null)seen.add(n);});
   return [...seen];
 }
 function remapMap(obj){
   const next={};
   Object.keys(obj||{}).forEach(k=>{const n=newIndex(+k,false);if(n!==null)next[n]=obj[k];});
   return next;
 }
 if((raw.version||0)<2){
   out.stage=newIndex(raw.stage||0,true);
   out.sql=remapMap(raw.sql);
   out.notes=remapMap(raw.notes);
   out.scratch=remapMap(raw.scratch);
   out.predAnswers=remapMap(raw.predAnswers);

const SQL_HINT_KEYWORDS=[
 "SELECT","FROM","WHERE","INNER JOIN","LEFT OUTER JOIN","ON","AS","AND","OR","NOT",
 "EXISTS","NOT EXISTS","GROUP BY","HAVING","ORDER BY","ASC","DESC","DISTINCT",
 "COUNT","SUM","AVG","MIN","MAX","COALESCE","CASE","WHEN","THEN","ELSE","END","WITH","NULL","IS NULL","IS NOT NULL"
];
const SQL_RESERVED_ALIAS=new Set(["WHERE","INNER","LEFT","RIGHT","FULL","JOIN","ON","GROUP","ORDER","HAVING","LIMIT","UNION","AND","OR","AS"]);

function aliasMapFromSql(sql){
 const map={};
 const re=/\b(?:FROM|JOIN)\s+([A-Za-z_][A-Za-z0-9_]*)(?:\s+(?:AS\s+)?([A-Za-z_][A-Za-z0-9_]*))?/gi;
 let m;
 while((m=re.exec(String(sql||"")))){
   const table=m[1],alias=m[2];
   if(!DOMAINS[table])continue;
   map[table]=table;
   if(alias&&!SQL_RESERVED_ALIAS.has(alias.toUpperCase()))map[alias]=table;
 }
 return map;
}
function completionItem(text,label,type){
 return {text:text,displayText:text+(label?"  · "+label:""),className:type?"sql-hint-"+type:""};
}
function sqlCompletionHint(editor){
 const cur=editor.getCursor();
 const line=editor.getLine(cur.line);
 const before=line.slice(0,cur.ch);
 const aliases=aliasMapFromSql(editor.getValue());
 let from=CodeMirror.Pos(cur.line,cur.ch),to=CodeMirror.Pos(cur.line,cur.ch),prefix="",items=[];

 const dotted=before.match(/([A-Za-z_][A-Za-z0-9_]*)\.([A-Za-z_][A-Za-z0-9_]*)?$/);
 if(dotted){
   const qualifier=dotted[1],table=aliases[qualifier]||(DOMAINS[qualifier]?qualifier:null);
   prefix=dotted[2]||"";
   from=CodeMirror.Pos(cur.line,cur.ch-prefix.length);
   if(table)items=Object.keys(DOMAINS[table]).map(col=>completionItem(col,table,"column"));
 }else{
   const word=before.match(/[A-Za-z_][A-Za-z0-9_]*$/);
   prefix=word?word[0]:"";
   from=CodeMirror.Pos(cur.line,cur.ch-prefix.length);
   const context=before.slice(0,cur.ch-prefix.length);
   const wantsTable=/\b(?:FROM|JOIN)\s*$/i.test(context);
   if(wantsTable){
     items=Object.keys(DOMAINS).map(t=>completionItem(t,"relation","table"));
   }else{
     const tables=Object.keys(DOMAINS).map(t=>completionItem(t,"relation","table"));
     const columns=[];
     Object.keys(DOMAINS).forEach(t=>Object.keys(DOMAINS[t]).forEach(col=>columns.push(completionItem(col,t,"column"))));
     const keywords=SQL_HINT_KEYWORDS.map(k=>completionItem(k,"SQL","keyword"));
     items=[...tables,...columns,...keywords];
   }
 }

 const p=prefix.toLowerCase();
 items=items.filter(x=>!p||x.text.toLowerCase().startsWith(p));
 const seen=new Set();
 items=items.filter(x=>{const k=x.text+"|"+x.displayText;if(seen.has(k))return false;seen.add(k);return true;});
 return {list:items,from:from,to:to};
}
function showSqlHints(editor,force){
 if(!window.CodeMirror||!CodeMirror.showHint)return;
 if(!force){
   const cur=editor.getCursor(),line=editor.getLine(cur.line).slice(0,cur.ch);
   const dotted=/[A-Za-z_][A-Za-z0-9_]*\.[A-Za-z0-9_]*$/.test(line);
   const word=(line.match(/[A-Za-z_][A-Za-z0-9_]*$/)||[""])[0];
   if(!dotted&&word.length<2)return;
 }
 CodeMirror.showHint(editor,sqlCompletionHint,{completeSingle:false,alignWithWord:true});
}

 const hintOpen=state.hint[state.stage]!==undefined;
 const solutionOpen=!!state.solution[state.stage];
 const alts=Array.isArray(s.altSolutions)?s.altSolutions:[];
 const choice=Math.max(0,Math.min(Number((state.solutionChoice||{})[state.stage]||0),alts.length));
 const options=[{label:'הדרך המרכזית',sql:s.solution,note:''}].concat(alts.map((a,i)=>({label:a.label||('דרך חלופית '+(i+1)),sql:a.sql,note:(s.operation&&s.operation.alt&&i===0)?s.operation.alt:''})));
 let out='<section class="sql-support"><div class="support-actions"><button class="hintbtn" id="hint">רמז</button><button class="solutionbtn" id="solution">פתרונות</button><button class="clearbtn" id="clearStage">נקה שלב</button></div>';
 if(hintOpen)out+='<div class="hintbox">'+hintText+'</div>';
 if(solutionOpen){
   out+='<div class="solutionbox"><div class="solution-tabs">'+options.map((x,i)=>'<button class="solution-option '+(choice===i?'active':'')+'" data-solution-choice="'+i+'">פתרון '+(i+1)+' · '+esc(x.label)+'</button>').join('')+'</div><pre>'+esc(options[choice].sql)+'</pre>';
   if(options[choice].note)out+='<p class="solution-note">'+esc(options[choice].note)+'</p>';
   if(s.gotcha)out+='<p><b>מלכודת:</b> '+esc(s.gotcha)+'</p>';
   out+='<p><b>עיקרון:</b> '+principleText+'</p></div>';
 }
 return out+'</section>';
}


function render(){
 const s=curr(), pct=Math.round(state.completed.length/STAGES.length*100);
 const noteVal=state.notes[state.stage]||'';
 const needNote=!!s.requireNote;
 const dbStatus=db?'מסד הנתונים מוכן':esc(dbError||'טוען SQLite…');
 const canInsert=!s.intro&&!s.summary;
 const seenTerms=new Set();
 const contextText=formatStageTerms(s.context,seenTerms);
 const taskText=formatStageTerms(s.task,seenTerms);
 const predText=s.pred?formatStageTerms(s.pred,seenTerms):'';
 const noteText=formatStageTerms(s.note,seenTerms);
 const hintText=state.hint[state.stage]!==undefined?formatStageTerms(s.hints[state.hint[state.stage]],seenTerms):'';
 const principleText=state.solution[state.stage]?formatStageTerms(s.principle,seenTerms):'';

 document.getElementById('app').innerHTML=
 '<header class="top"><div><div class="kicker">ROUTECRAFT · OPERATIONS SQL LAB</div><h1>תעלומת המסלולים שלא נסגרו</h1></div>'+
 '<div class="progress"><div class="progline"><span>'+state.completed.length+' מתוך '+STAGES.length+' הושלמו</span><span>'+pct+'%</span></div><div class="track"><span style="width:'+pct+'%"></span></div></div>'+
 '<div class="topbtns"><a class="ghostbtn" href="schema-map.html" target="_blank" rel="noopener" title="פתח מפת Schema מלאה">▦ מפת Schema</a><button class="ghostbtn" id="theme" title="מצב תצוגה">'+(state.theme==='dark'?'☀️':'🌙')+'</button><button class="ghostbtn" id="export" title="ייצוא התקדמות">⬇︎ ייצוא</button><button class="ghostbtn" id="importBtn" title="ייבוא התקדמות">⬆︎ ייבוא</button><input type="file" id="importFile" accept="application/json" hidden><button class="reset" id="reset">איפוס</button></div></header>'+
 '<main class="layout">'+
 '<aside class="steps card"><h3>מסלול החקירה</h3><nav>'+STAGES.map((x,i)=>'<button class="step '+(i===state.stage?'active ':'')+'" data-step="'+i+'"><span class="n">'+(done(i)?'✓':i+1)+'</span><span><b>'+esc(x.short)+'</b><small>'+esc(x.title)+'</small></span></button>').join('')+'</nav></aside>'+
 '<section class="main">'+
 ((state.stage===1)?'<section class="card case-brief"><b>CASE BRIEF · NETWORK OPERATIONS</b><p>'+esc(CASE_BRIEF)+'</p></section>':'')+
 '<article class="card hero"><div class="eyebrow">'+esc(s.eye)+'</div><h2>'+(state.stage+1)+'. '+esc(s.title)+'</h2><div class="context">'+contextText+'</div><div class="task"><b>'+(s.output?'הבקשה העסקית':'המשימה')+'</b><br>'+taskText+'</div>'+(s.output?('<div class="output-toggle"><button id="toggleOutput">'+(state.outputOpen[state.stage]?'הסתר דרישות פלט':'הצג דרישות פלט')+'</button></div>'+(state.outputOpen[state.stage]?'<div class="output-req"><b>דרישות פלט</b><span>'+esc(s.output)+'</span></div>':'')):'')+'</article>'+
 relationalModelHtml(s)+
 scratchHtml(s)+
 operationHtml(s)+
 joinVizDisclosureHtml(s)+
 sanityHtml(s,false)+
 ((s.summary||s.intro)?'':'<section class="editor"><div class="editorhead"><b>SQL editor · אתם כותבים ומריצים</b><span>'+dbStatus+'</span></div><div id="cmwrap"><textarea id="sql" spellcheck="false" placeholder="כתבו כאן את שאילתת ה-SQL שלכם...">'+esc(sqlText())+'</textarea></div><div class="editorfoot"><span>'+(s.mapping?'הריצו relation אחד בכל פעם · Highlight = הרצת הבחירה בלבד · Ctrl/Cmd+Enter להרצה':'Highlight = הרצת הבחירה בלבד · Ctrl/Cmd+Enter להרצה · Ctrl/Cmd+Z לביטול · נשמר אוטומטית')+'</span><div class="editor-buttons"><button class="run" id="run" '+(!db?'disabled':'')+' title="אם מסומן SQL, יורץ רק הטקסט המסומן">▶ Run Query</button><button class="checkquery" id="checkQuery" '+(!db?'disabled':'')+'>✓ בדוק שאילתה</button></div></div></section>')+
 ((lastResult||lastError)?'<section class="card result" id="resultCard"><div class="resulthead"><b>Query result</b><span>'+(lastResult?lastResult.values.length+' rows':'error')+'</span></div>'+(lastError?'<div class="err" aria-live="polite">'+esc(lastError)+'</div>':resultHtml(lastResult))+(lastResult&&s.sanity?'<div class="result-verify"><b>Verify:</b> '+mixedInlineHtml(s.sanity.after)+'</div>':'')+'</section>':'')+
 (queryFeedback?'<div id="queryFeedback" class="feedback '+(queryFeedback.startsWith('נכון')||queryFeedback.startsWith('השאילתה תקינה')||queryFeedback.startsWith('התוצאה נכונה')?'ok':'bad')+'" aria-live="polite">'+esc(queryFeedback)+'</div>':'')+
 (queryFeedback&&s.fanoutTrap?fanoutLessonHtml(state.sql[state.stage]||''):'')+
 ((s.intro||s.mapping||s.summary)?('<section class="card reason"><label>'+(s.intro?'מפת המונחים':s.mapping?'תשובה מובנית':'סיכום · מסגרת החלטה')+'</label><small>'+noteText+'</small>'+(s.intro?introHtml():s.mapping?structuredHtml():decisionHtml())+'<div class="actions">'+(s.intro?'<button class="check" id="checkIntro">הבנתי, אפשר להמשיך</button>':s.mapping?'<button class="check" id="check">בדוק תשובה</button>':'<button class="check" id="checkDecision">בדוק תשובות</button>')+(s.intro?'':'<button class="hintbtn" id="hint">רמז</button><button class="solutionbtn" id="solution">פתרון</button>')+'</div>'+(state.hint[state.stage]!==undefined&&!s.intro?'<div class="hintbox">'+hintText+'</div>':'')+(feedback?'<div class="feedback '+(feedback.startsWith('נכון')||feedback.startsWith('מצוין')||feedback.startsWith('מעולה')?'ok':'bad')+'">'+esc(feedback)+'</div>':'')+(state.solution[state.stage]&&!s.intro?'<div class="solutionbox"><b>פתרון מוצע</b><p>'+esc(s.solution)+'</p><p><b>עיקרון:</b> '+principleText+'</p></div>':'')+'</section>'):sqlSupportHtml(s,hintText,principleText))+
 '<div class="nav"><button id="prev" '+(state.stage===0?'disabled':'')+'>← הקודם</button><button class="next" id="next" '+(!done(state.stage)?'disabled':'')+'>'+(state.stage===STAGES.length-1?'סיום':'הבא ←')+'</button></div>'+
 '</section>'+
 '<aside class="side"><section class="card schema"><h3>Schema + Domain</h3><div class="schema-relations">'+Object.keys(TABLES).map(t=>'<span class="relation-chip"><button data-table="'+t+'" class="'+(t===preview?'sel':'')+'">'+t+'</button>'+(canInsert?'<button class="insert-mini" data-insert-token="'+esc(t)+'" title="הוסף relation לעורך">＋</button>':'')+'</span>').join('')+'</div>'+(canInsert?'<div class="insert-help">＋ מוסיף לעורך במקום הסמן · Ctrl+Space פותח autocomplete</div>':'')+(relationGraphUnlocked()?'<button class="relation-toggle" id="toggleRelations">'+(relationGraphOpen()?'הסתר קשרים':'הצג קשרים')+'</button>'+(relationGraphOpen()?schemaGraphHtml():''):'<div class="schema-note relation-lock">קשרי ה-FK מוסתרים עד שתנסו שאילתה או תבקשו רמז.</div>')+'<table class="schema-table"><thead><tr><th>Attribute</th><th class="domain">Domain</th></tr></thead><tbody>'+Object.keys(DOMAINS[preview]).map(a=>'<tr><td class="attr"><div class="attr-cell">'+(canInsert?'<button class="attr-name-insert" data-insert-token="'+esc(a)+'" title="לחץ להוספה לעורך">'+esc(a)+'</button>':'<span>'+esc(a)+'</span>')+(canInsert?'<button class="insert-attr" data-insert-token="'+esc(a)+'" title="הוסף attribute לעורך">＋</button>':'')+'</div></td><td class="domain">'+esc(DOMAINS[preview][a])+'</td></tr>').join('')+'</tbody></table><div class="schema-note"><b>Domain</b> = קבוצת הערכים שה-attribute יכול לקבל.</div><div class="data-preview"><h4>Data preview · 5 rows</h4>'+previewDataHtml(preview,canInsert)+'</div></section>'+
 glossaryHtml()+
 '<section class="card principles"><h3>עקרונות שנלמדו</h3><ul>'+(STAGES.filter((x,i)=>done(i)).length?STAGES.filter((x,i)=>done(i)).map(x=>'<li>'+esc(x.principle)+'</li>').join(''):'<li style="color:#9aa79f">עוד לא הושלמו שלבים.</li>')+'</ul></section></aside>'+
 '</main>';
 mountEditor();
 applyTheme();
 bind();
}
function applyTheme(){document.documentElement.setAttribute('data-theme',state.theme==='dark'?'dark':'light');}
function mountEditor(){
 cm=null;
 const ta=document.getElementById('sql');
 if(!ta)return;
 if(window.CodeMirror){
   cm=CodeMirror.fromTextArea(ta,{mode:'text/x-sql',lineNumbers:true,matchBrackets:true,direction:'ltr',lineWrapping:true,extraKeys:{
     'Ctrl-Enter':runCurrent,'Cmd-Enter':runCurrent,
     'Ctrl-Z':editor=>editor.undo(),'Cmd-Z':editor=>editor.undo(),
     'Ctrl-Y':editor=>editor.redo(),'Cmd-Shift-Z':editor=>editor.redo(),
     'Ctrl-Space':editor=>showSqlHints(editor,true)
   }});
   cm.setSize('100%',260);
   cm.on('change',()=>{state.sql[state.stage]=cm.getValue();save();invalidateResult();});
   cm.on('cursorActivity',()=>{rememberEditorCursor();});
   cm.on('focus',()=>{rememberEditorCursor();});
   lastEditorCursor=cm.getDoc().getCursor();
   cm.on('inputRead',(editor,change)=>{
     if(change&&change.origin==="complete")return;
     const typed=((change&&change.text)||[]).join("");
     if(/[A-Za-z0-9_.]/.test(typed))setTimeout(()=>{if(cm===editor)showSqlHints(editor,false);},0);
   });
 }
}
function invalidateResult(){
 lastResult=null;lastError='';queryFeedback='';
 const rc=document.getElementById('resultCard');if(rc)rc.remove();
 const qf=document.getElementById('queryFeedback');if(qf)qf.remove();
}
function runCurrent(){
 const val=pendingRunSql!==null?pendingRunSql:runnableSql();
 pendingRunSql=null;
 if(!val.trim()){lastResult=null;lastError='כתבו שאילתת SQL לפני ההרצה.';render();return;}
 if(!state.attempted.includes(state.stage))state.attempted.push(state.stage);
 save();
 try{lastResult=exec(val);lastError='';queryFeedback='';}
 catch(e){lastResult=null;lastError=friendlySqlError(e.message,val,state.stage);queryFeedback='';}
 render();
}
function clearTransient(){lastResult=null;lastError='';feedback='';queryFeedback='';}
function bind(){
 document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{state.stage=+b.dataset.step;save();clearTransient();render();});
 document.querySelectorAll('[data-table]').forEach(b=>b.onclick=()=>{preview=b.dataset.table;render();});
 document.querySelectorAll('[data-insert-token]').forEach(b=>b.onmousedown=e=>{e.preventDefault();e.stopPropagation();insertIntoEditor(b.dataset.insertToken);});
 const note=document.getElementById('note');
 if(note)note.oninput=()=>{state.notes[state.stage]=note.value;save();};
 const scratch=document.getElementById('scratch');
 if(scratch)scratch.oninput=()=>{state.scratch[state.stage]=scratch.value;save();};
 const sanityAnswer=document.getElementById('sanityAnswer');
 if(sanityAnswer)sanityAnswer.onchange=()=>{state.sanityAnswers[state.stage]=sanityAnswer.value;state.sanityChecked[state.stage]=false;save();render();};
 const checkSanity=document.getElementById('checkSanity');
 if(checkSanity)checkSanity.onclick=()=>{state.sanityChecked[state.stage]=true;save();render();};
 const operationHelp=document.getElementById('operationHelp');
 if(operationHelp)operationHelp.ontoggle=()=>{state.operationOpen[state.stage]=operationHelp.open;save();};
 const showOperationTool=document.getElementById('showOperationTool');
 if(showOperationTool)showOperationTool.onclick=()=>{state.operationChecked[state.stage]=true;save();render();};
 const operationAnswer=document.getElementById('operationAnswer');
 if(operationAnswer)operationAnswer.onchange=()=>{state.operationAnswers[state.stage]=operationAnswer.value;state.operationChecked[state.stage]=false;save();render();};
 const checkOperation=document.getElementById('checkOperation');
 if(checkOperation)checkOperation.onclick=()=>{state.operationChecked[state.stage]=true;save();render();};
 const operationHint=document.getElementById('operationHint');
 if(operationHint)operationHint.onclick=()=>{state.operationHints[state.stage]=!state.operationHints[state.stage];save();render();};
 document.querySelectorAll('[data-grain]').forEach(el=>el.onchange=()=>{state.structured.grain[el.dataset.grain]=el.value;save();render();});
 document.querySelectorAll('[data-card]').forEach(el=>el.onchange=()=>{state.structured.card[el.dataset.card]=el.value;save();render();});
 document.querySelectorAll('[data-decision]').forEach(el=>el.onchange=()=>{state.decision[el.dataset.decision]=el.value;save();render();});
 document.querySelectorAll('[data-predq]').forEach(el=>el.onchange=()=>{
   const k=String(state.stage), qi=String(el.dataset.predq);
   if(!state.predAnswers[k])state.predAnswers[k]={};
   state.predAnswers[k][qi]=el.value;
   if(state.predChecked[k]===true)state.predChecked[k]={};
   if(!state.predChecked[k]||typeof state.predChecked[k]!=='object')state.predChecked[k]={};
   state.predChecked[k][qi]=false;
   save();render();
 });
 document.querySelectorAll('[data-check-pred]').forEach(btn=>btn.onclick=()=>{
   const k=String(state.stage), qi=String(btn.dataset.checkPred);
   const answers=(state.predAnswers||{})[k]||{};
   if(!answers[qi]){
     const qbox=btn.closest('.pred-q');
     if(qbox){
       let msg=qbox.querySelector('.pred-inline-msg');
       if(!msg){msg=document.createElement('div');msg.className='feedback bad pred-inline-msg';qbox.appendChild(msg);}
       msg.textContent='בחרו תשובה לפני הבדיקה.';
     }
     return;
   }
   if(state.predChecked[k]===true)state.predChecked[k]={};
   if(!state.predChecked[k]||typeof state.predChecked[k]!=='object')state.predChecked[k]={};
   state.predChecked[k][qi]=true;
   save();render();
 });
 const toggleRelations=document.getElementById('toggleRelations');const toggleOutput=document.getElementById('toggleOutput');
 if(toggleOutput)toggleOutput.onclick=()=>{state.outputOpen[state.stage]=!state.outputOpen[state.stage];save();render();};
 
 if(toggleRelations)toggleRelations.onclick=()=>{state.graphOpen[state.stage]=!relationGraphOpen();save();render();};

 const runBtn=document.getElementById('run');
 if(runBtn){
   runBtn.onmousedown=()=>{pendingRunSql=runnableSql();};
   runBtn.onclick=runCurrent;
 }

 const hintBtn=document.getElementById('hint');
 if(hintBtn)hintBtn.onclick=()=>{const i=state.hint[state.stage];state.hint[state.stage]=i===undefined?0:Math.min(i+1,curr().hints.length-1);save();render();};
 document.querySelectorAll('[data-solution-choice]').forEach(btn=>btn.onclick=()=>{state.solutionChoice[state.stage]=+btn.dataset.solutionChoice;save();render();});
 const solutionBtn=document.getElementById('solution');
 if(solutionBtn)solutionBtn.onclick=()=>{if(!state.solution[state.stage]&&state.hint[state.stage]===undefined&&!confirm('להציג את הפתרונות? אפשר קודם לנסות רמז אם תרצו.'))return;state.solution[state.stage]=!state.solution[state.stage];save();render();};

 const clearStage=document.getElementById('clearStage');
 if(clearStage)clearStage.onclick=()=>{if(confirm('לנקות את ה-SQL, ההסבר, הרמז והפתרון של השלב הנוכחי? שאר ההתקדמות תישמר.')){delete state.sql[state.stage];delete state.notes[state.stage];delete state.scratch[state.stage];delete state.predAnswers[state.stage];delete state.predChecked[state.stage];delete state.sanityAnswers[state.stage];delete state.sanityChecked[state.stage];delete state.operationAnswers[state.stage];delete state.operationChecked[state.stage];delete state.operationHints[state.stage];delete state.operationOpen[state.stage];delete state.outputOpen[state.stage];delete state.hint[state.stage];delete state.solution[state.stage];delete state.solutionChoice[state.stage];delete state.graphOpen[state.stage];state.attempted=(state.attempted||[]).filter(i=>i!==state.stage);state.completed=state.completed.filter(i=>i!==state.stage);state.skipped=(state.skipped||[]).filter(i=>i!==state.stage);save();clearTransient();render();}};

 const checkQueryNow=()=>{
   const val=editorValue();
   try{
     if(curr().requireNote&&!(state.notes[state.stage]||'').trim()){
       queryFeedback='לפני שבודקים: רשמו קודם את התחזית/ההסבר שלכם בשדה למטה. אפשר להריץ ולחקור, אבל הבדיקה הסופית מחייבת לנסח מה אתם חושבים.';
       save();render();return;
     }
     if(val.trim()&&!state.attempted.includes(state.stage))state.attempted.push(state.stage);
     if(!val.trim()){queryFeedback='כתבו שאילתת SQL לפני הבדיקה.';}
     else if(curr().mapping){
       const user=exec(val);
       queryFeedback='השאילתה תקינה ורצה. התקבלו '+user.values.length+' rows ו-'+user.columns.length+' columns. עכשיו השתמשו בנתונים כדי להסיק Grain ו-cardinality.';
     }else{
       const user=exec(val),exp=exec(curr().expected);
       if(sameResultValues(user,exp)){
         queryFeedback=curr().fanoutTrap?fanoutCorrectFeedback(val):(user.columns.join('|')===exp.columns.join('|')?'נכון. השאילתה מחזירה את התוצאה הצפויה.':'נכון. הערכים נכונים. שמות העמודות שונים מהפתרון, וזה לא פוסל את השאילתה.');
         if(!done(state.stage))state.completed.push(state.stage);
         state.skipped=(state.skipped||[]).filter(i=>i!==state.stage);
       }else{
         const trap=curr().fanoutTrap?fanoutWrongFeedback(val,user,exp):"";
         queryFeedback=trap||diagnoseResult(user,exp,state.stage);
       }
     }
   }catch(e){queryFeedback='לא ניתן להריץ את השאילתה: '+friendlySqlError(e.message,val,state.stage);}
   save();render();
 };
 const checkQuery=document.getElementById('checkQuery');
 if(checkQuery)checkQuery.onclick=checkQueryNow;

 const checkIntro=document.getElementById('checkIntro');
 if(checkIntro)checkIntro.onclick=()=>{if(!done(state.stage))state.completed.push(state.stage);state.skipped=(state.skipped||[]).filter(i=>i!==state.stage);feedback='מעולה. אפשר להמשיך — והמילון יישאר זמין בצד.';save();render();};

 const checkAnswer=document.getElementById('check');
 if(checkAnswer)checkAnswer.onclick=()=>{const r=checkStructured();feedback=r.msg;if(r.ok){if(!done(state.stage))state.completed.push(state.stage);state.skipped=(state.skipped||[]).filter(i=>i!==state.stage);}save();render();};

 const checkDec=document.getElementById('checkDecision');
 if(checkDec)checkDec.onclick=()=>{const r=checkDecision();feedback=r.msg;if(r.ok){if(!done(state.stage))state.completed.push(state.stage);state.skipped=(state.skipped||[]).filter(i=>i!==state.stage);}save();render();};

 document.getElementById('prev').onclick=()=>{if(state.stage>0){state.stage--;save();clearTransient();render();}};
 document.getElementById('next').onclick=()=>{if(done(state.stage)&&state.stage<STAGES.length-1){state.stage++;save();clearTransient();render();}};
 document.getElementById('reset').onclick=()=>{if(confirm('לאפס את כל ההתקדמות והכתיבה?')){localStorage.removeItem(STORAGE_KEY);state=defaults();clearTransient();render();}};

 const theme=document.getElementById('theme');
 if(theme)theme.onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';save();render();};

 const exp=document.getElementById('export');
 if(exp)exp.onclick=()=>{
   const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
   const url=URL.createObjectURL(blob);
   const a=document.createElement('a');a.href=url;a.download='routecraft-progress.json';a.click();
   URL.revokeObjectURL(url);
 };
 const impBtn=document.getElementById('importBtn'),impFile=document.getElementById('importFile');
 if(impBtn&&impFile){
   impBtn.onclick=()=>impFile.click();
   impFile.onchange=()=>{
     const file=impFile.files[0];if(!file)return;
     const r=new FileReader();
     r.onload=()=>{try{const parsed=JSON.parse(r.result);state=migrateState(parsed);save();clearTransient();render();alert('ההתקדמות יובאה בהצלחה.');}catch(e){alert('קובץ לא תקין: '+e.message);}};
     r.readAsText(file);
   };
 }
}
async function init(){
 try{
   const SQL=await initSqlJs({locateFile:f=>'https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/'+f});
   db=new SQL.Database();
   db.run(SEED_SQL);
 }catch(e){dbError='SQLite לא נטען: '+e.message;}
 render();
}
render();init();
