const STAGES=[
{title:"מה באמת מייצגת כל שורה?",short:"Grain ו-cardinality",eye:"פתיחת החקירה · מיפוי הנתונים",context:"צוות הכספים של PulseBoard טוען שמספרי החיוב בדשבורד לא עקביים. לפני שנוגעים במטריקה, צריך להבין מה כל relation מייצג. בשלב הזה ה-SQL הוא כלי חקירה: אתם מריצים שאילתה תקינה על כל relation, בוחנים את הרשומות, ואז מסיקים מה ה-Grain ומה סוג הקשר.",task:"כתבו והריצו SELECT על accounts. אחר כך החליפו בעצמכם את שם ה-relation ובדקו גם subscriptions, users, invoices ו-payments. רק אחרי שראיתם את הנתונים, מלאו למטה מה מייצגת שורה אחת בכל relation ומה סוג הקשר בין הישויות.",pred:"ה-SQL כאן אינו 'התשובה'. הוא הדרך שלכם לחקור את הנתונים. אל תנחשו לפי שם הטבלה — בדקו Primary Key, Foreign Key, UNIQUE וחזרות בפועל.",starter:"",expected:null,note:"בחרו את ה-Grain של כל relation ואת סוג הקשר: אחד לאחד, אחד לרבים או רבים לרבים.",hints:["איזו עמודה מזהה tuple באופן ייחודי?","האם account_id חוזר ב-users וב-invoices?","ב-subscriptions account_id הוא UNIQUE; ב-users וב-invoices הוא לא."],solution:"accounts: שורה לחשבון. subscriptions: שורה למינוי ולכל היותר אחת לחשבון. users: שורה למשתמש. invoices: שורה לחשבונית. payments: שורה לתשלום. account→users ו-account→invoices הם 1:M; invoice→payments הוא 1:M.",principle:"Grain = מה מייצגת שורה אחת."},
{title:"קובעים Baseline לפני JOIN",short:"Baseline",eye:"בקרה · לפני ה-JOIN הראשון",context:"כדי לזהות ניפוח בהמשך, צריך מספרי בקרה שלא תלויים ב-JOIN.",task:"החזירו בשורה אחת: מספר accounts, מספר invoices וסכום amount_due של כל החשבוניות.",starter:"",expected:"SELECT (SELECT COUNT(*) FROM accounts) account_count,(SELECT COUNT(*) FROM invoices) invoice_count,(SELECT SUM(amount_due) FROM invoices) issued_total;",note:"מה בדיוק סופר או מסכם כל מספר?",hints:["כל מספר מגיע מ-relation אחר.","צריך COUNT(*) על invoices ו-SUM(amount_due).","השתמשו ב-scalar subqueries."],solution:"SELECT (SELECT COUNT(*) FROM accounts) AS account_count, (SELECT COUNT(*) FROM invoices) AS invoice_count, (SELECT SUM(amount_due) FROM invoices) AS issued_total;",principle:"Baseline = נקודת בקרה לפני שינוי Grain."},
{title:"מי חויב, מתי ובכמה?",short:"JOIN משנה Grain",eye:"JOIN ראשון · חזרות תקינות",context:"מנהלת הכספים רוצה שם account ליד כל invoice.",task:"הציגו account_name, invoice_id, issued_at ו-amount_due לכל invoice, לפי invoice_id.",pred:"מה יהיה ה-output Grain? האם account_name יכול לחזור בלי שזו כפילות?",starter:"",expected:"SELECT a.account_name,i.invoice_id,i.issued_at,i.amount_due FROM accounts a JOIN invoices i ON i.account_id=a.account_id ORDER BY i.invoice_id;",note:"כתבו תחזית: כמה rows ומה מייצגת כל row?",hints:["איזו עמודה ב-invoices מצביעה על account?","השוו account_id משני הצדדים.","ON i.account_id = a.account_id"],solution:"SELECT a.account_name,i.invoice_id,i.issued_at,i.amount_due FROM accounts a JOIN invoices i ON i.account_id=a.account_id ORDER BY i.invoice_id;",principle:"JOIN 1:M מייצר שורה לכל match; חזרת entity אינה duplicate tuple."},

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function curr(){return STAGES[state.stage];}
function sqlText(){return state.sql[state.stage]===undefined?curr().starter:state.sql[state.stage];}
function done(i){return state.completed.includes(i);}
function skipped(i){return (state.skipped||[]).includes(i);}
function passed(i){return done(i)||skipped(i);}
function firstIncomplete(){for(let i=0;i<STAGES.length;i++)if(!passed(i))return i;return STAGES.length-1;}
function allowed(i){return i<=firstIncomplete();}
function norm(r){if(!r)return'';return JSON.stringify([r.columns,r.values.map(x=>x.map(v=>v===null?null:v)).sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b)))]);}
function rowKey(row){return JSON.stringify(row.map(v=>v===null?null:v));}
function sortedRowKeys(r){return (r&&r.values?r.values:[]).map(rowKey).sort();}
function sameResultValues(a,b){
 if(!a||!b||a.columns.length!==b.columns.length)return false;
 const av=sortedRowKeys(a),bv=sortedRowKeys(b);
 return av.length===bv.length&&av.every((x,i)=>x===bv[i]);
}
function duplicateRows(r){
 const seen=new Map(),dups=[];
 (r&&r.values?r.values:[]).forEach(row=>{const k=rowKey(row);seen.set(k,(seen.get(k)||0)+1);});
 seen.forEach((n,k)=>{if(n>1)dups.push({row:JSON.parse(k),count:n});});
 return dups;
}
function multisetDiff(a,b){
 const counts=new Map();
 b.forEach(k=>counts.set(k,(counts.get(k)||0)+1));
 const extra=[];
 a.forEach(k=>{const n=counts.get(k)||0;if(n)counts.set(k,n-1);else extra.push(k);});
 const missing=[];
 counts.forEach((n,k)=>{for(let i=0;i<n;i++)missing.push(k);});
 return {extra,missing};
}
function formatRowKey(k){
 try{return JSON.parse(k).map(v=>v===null?'NULL':String(v)).join(' | ');}
 catch(e){return k;}
}

function friendlySqlError(msg){
 const m=String(msg||'');
 if(/near ";": syntax error/i.test(m))return "יש שגיאת תחביר ממש לפני ;. בדקו אם נשאר פסיק, WHERE/ON/GROUP BY לא גמור, או ביטוי שחסר לפני סוף השאילתה.";
 if(/no such column:/i.test(m))return "SQLite לא מוצא אחת העמודות. בדקו את שם ה-attribute ב-Schema ואת ה-alias של הטבלה. ("+m+")";
 if(/ambiguous column name:/i.test(m))return "שם עמודה אינו חד-משמעי כי הוא קיים ביותר מטבלה אחת. הוסיפו alias, למשל a.account_id. ("+m+")";
 if(/no such table:/i.test(m))return "SQLite לא מוצא את ה-relation הזה. בדקו את שם הטבלה ב-Schema. ("+m+")";
 if(/syntax error/i.test(m))return "יש שגיאת תחביר ב-SQL. SQLite אומר: "+m;
 return m;
}
function diagnoseResult(user,exp,stage){
 const parts=[];
 if(user.columns.length!==exp.columns.length){
   parts.push("מספר העמודות שונה: קיבלתם "+user.columns.length+", והמשימה מצפה ל-"+exp.columns.length+".");
   parts.push("העמודות שהתוצאה הצפויה מייצגת: "+exp.columns.join(", ")+".");
 }else if(user.values.length!==exp.values.length){
   parts.push("מספר השורות שונה: קיבלתם "+user.values.length+", והפלט הצפוי מכיל "+exp.values.length+".");
 }
 const dups=duplicateRows(user), expDups=duplicateRows(exp);
 if(dups.length&&!expDups.length){
   parts.push("יש אצלכם שורות זהות שחוזרות. לדוגמה: "+dups.slice(0,1).map(x=>x.row.map(v=>v===null?'NULL':v).join(" | ")+" ("+x.count+" פעמים)").join("")+".");
 }
 if(user.columns.length===exp.columns.length){
   const diff=multisetDiff(sortedRowKeys(user),sortedRowKeys(exp));
   if(diff.missing.length)parts.push("חסרה למשל שורה: "+formatRowKey(diff.missing[0])+".");
   if(diff.extra.length)parts.push("יש למשל שורה שלא אמורה להיות: "+formatRowKey(diff.extra[0])+".");
 }
 if(STAGE_DIAGNOSTIC_TIPS[stage])parts.push("כיוון: "+STAGE_DIAGNOSTIC_TIPS[stage]);
 return parts.join(" ");
}

   return '<div class="schema-note">לא ניתן לטעון preview.</div>';

  acc_sub:"subscriptions.account_id הוא UNIQUE, ולכן לאותו account לא יכולות להיות כמה subscriptions. לכן סוג הקשר הוא אחד לאחד. הערת מודל: ה-schema לא מחייב שלכל account תהיה subscription, אבל אנחנו לא מכניסים את האופציונליות לסימון הקשר כאן.",
  acc_users:"users.account_id אינו UNIQUE, ולכן אותו account_id יכול להופיע בכמה rows של users. כל user שייך ל-account אחד, אבל ל-account אחד יכולים להיות כמה users.",
  acc_inv:"invoices.account_id אינו UNIQUE, ולכן אותו account_id יכול להופיע בכמה invoices. כל invoice שייכת ל-account אחד, אבל ל-account אחד יכולות להיות כמה invoices.",
  inv_pay:"payments.invoice_id אינו UNIQUE, ולכן אותה invoice יכולה להופיע בכמה rows של payments. כל payment שייך ל-invoice אחת, אבל ל-invoice אחת יכולים להיות כמה payments."
 };
 if(!choice)return "";
 const ok=choice===correct[key];
 return '<div class="answer-exp '+(ok?'good':'wrong')+'"><b>'+(ok?'נכון. ':'לא. התשובה היא '+labels[correct[key]]+'. ')+'</b>'+why[key]+'</div>';
}
function structuredHtml(){
 const g=state.structured.grain||{}, k=state.structured.card||{};
 const rels=["accounts","subscriptions","users","invoices","payments"];
 const pairs=[
   ["acc_sub","accounts → subscriptions"],
   ["acc_users","accounts → users"],
   ["acc_inv","accounts → invoices"],
   ["inv_pay","invoices → payments"]
 ];
 return '<div class="structured">'+
   '<div class="subq"><h4>1. מה מייצגת שורה אחת?</h4><p>בחרו את ה-Grain של כל relation.</p><div class="answergrid">'+
   rels.map(r=>'<div class="rel">'+r+'</div><select data-grain="'+r+'">'+opts(GRAIN_OPTIONS,g[r]||'')+'</select>'+grainExplanation(r,g[r]||'')).join('')+
   '</div></div><div class="divider"></div>'+
   '<div class="subq"><h4>2. מה סוג הקשר?</h4><p>בחרו: אחד לאחד, אחד לרבים או רבים לרבים. כרגע לא משתמשים בסימוני אופציונליות כמו 0..1.</p><div class="answergrid">'+
   pairs.map(([key,label])=>'<div class="rel">'+label+'</div><select data-card="'+key+'">'+opts(CARD_OPTIONS,k[key]||'')+'</select>'+cardExplanation(key,k[key]||'')).join('')+
   '</div></div></div>';
}
function checkStructured(){
 const g=state.structured.grain||{}, k=state.structured.card||{};
 const grainExpected={accounts:"account",subscriptions:"subscription",users:"user",invoices:"invoice",payments:"payment"};
 const cardExpected={acc_sub:"1:1",acc_users:"1:M",acc_inv:"1:M",inv_pay:"1:M"};
 const missing=[...Object.keys(grainExpected).filter(x=>!g[x]),...Object.keys(cardExpected).filter(x=>!k[x])];
 if(missing.length) return {ok:false,msg:"עוד לא. נשארו שדות שלא מולאו."};
 const badGrain=Object.keys(grainExpected).filter(x=>g[x]!==grainExpected[x]);
 const badCard=Object.keys(cardExpected).filter(x=>k[x]!==cardExpected[x]);
 if(badGrain.length||badCard.length){
   const parts=[];
   if(badGrain.length) parts.push("בדקו שוב את ה-Grain של: "+badGrain.join(", "));
   if(badCard.length) parts.push("בדקו שוב את ה-cardinality של: "+badCard.map(x=>({acc_sub:"accounts → subscriptions",acc_users:"accounts → users",acc_inv:"accounts → invoices",inv_pay:"invoices → payments"}[x])).join(", "));
   return {ok:false,msg:parts.join(" · ")};
 }
 return {ok:true,msg:"נכון. עכשיו יש לנו מיפוי ברור: מה כל row מייצגת ואיך הישויות קשורות זו לזו."};
}

function render(){
 const s=curr(), pct=Math.round(state.completed.length/STAGES.length*100);
 document.getElementById('app').innerHTML=
 '<header class="top"><div><div class="kicker">PULSEBOARD · SQL INVESTIGATION</div><h1>תעלומת החיובים שלא מסתדרים</h1></div>'+
 '<div class="progress"><div class="progline"><span>'+state.completed.length+' מתוך '+STAGES.length+' הושלמו</span><span>'+pct+'%</span></div><div class="track"><span style="width:'+pct+'%"></span></div></div>'+
 '<button class="reset" id="reset">איפוס</button></header>'+
 '<main class="layout">'+
 '<aside class="steps card"><h3>מסלול החקירה</h3><nav>'+STAGES.map((x,i)=>'<button class="step '+(i===state.stage?'active ':'')+(!allowed(i)?'locked':'')+'" data-step="'+i+'" '+(!allowed(i)?'disabled':'')+'><span class="n">'+(done(i)?'✓':skipped(i)?'↷':i+1)+'</span><span><b>'+esc(x.short)+'</b><small>'+esc(x.title)+(skipped(i)?' · דולג':'')+'</small></span></button>').join('')+'</nav></aside>'+
 '<section class="main">'+
 '<article class="card hero"><div class="eyebrow">'+esc(s.eye)+'</div><h2>'+(state.stage+1)+'. '+esc(s.title)+'</h2><div class="context">'+esc(s.context)+'</div><div class="task"><b>המשימה</b><br>'+esc(s.task)+'</div>'+(s.pred?'<div class="prediction"><b>לפני ההרצה:</b> '+esc(s.pred)+'</div>':'')+'</article>'+
 '<section class="editor"><div class="editorhead"><b>SQL editor · אתם כותבים ומריצים</b><span>'+(db?'מסד הנתונים מוכן':esc(dbError||'טוען SQLite…'))+'</span></div><textarea id="sql" spellcheck="false" placeholder="כתבו כאן את שאילתת ה-SQL שלכם...">'+esc(sqlText())+'</textarea><div class="editorfoot"><span>'+(state.stage===0?'הריצו relation אחד בכל פעם · הכתיבה נשמרת אוטומטית':'נשמר אוטומטית בכל הקלדה')+'</span><div class="editor-buttons"><button class="run" id="run" '+(!db?'disabled':'')+'>▶ Run Query</button>'+'<button class="checkquery" id="checkQuery" '+(!db?'disabled':'')+'>✓ בדוק שאילתה</button>'+'</div></div></section>'+
 ((lastResult||lastError)?'<section class="card result" id="resultCard"><div class="resulthead"><b>Query result</b><span>'+(lastResult?lastResult.values.length+' rows':'error')+'</span></div>'+(lastError?'<div class="err">'+esc(lastError)+'</div>':resultHtml(lastResult))+'</section>':'')+
 (queryFeedback?'<div id="queryFeedback" class="feedback '+(queryFeedback.startsWith('נכון')||queryFeedback.startsWith('השאילתה תקינה')?'ok':'bad')+'">'+esc(queryFeedback)+'</div>':'')+
 '<section class="card reason"><label>'+(state.stage===0?'תשובה מובנית':'הסבר / תחזית')+'</label><small>'+esc(s.note)+'</small>'+(state.stage===0?structuredHtml():'<textarea id="note">'+esc(state.notes[state.stage]||'')+'</textarea>')+'<div class="actions">'+(state.stage===0?'<button class="check" id="check">בדוק תשובה</button>':'')+'<button class="hintbtn" id="hint">רמז</button><button class="solutionbtn" id="solution">פתרון</button></div>'+
 (state.hint[state.stage]!==undefined?'<div class="hintbox">'+esc(s.hints[state.hint[state.stage]])+'</div>':'')+
 (feedback?'<div class="feedback '+(feedback.startsWith('נכון')?'ok':'bad')+'">'+esc(feedback)+'</div>':'')+
 (state.solution[state.stage]?'<div class="solutionbox"><b>פתרון מוצע</b><pre>'+esc(s.solution)+'</pre><p><b>עיקרון:</b> '+esc(s.principle)+'</p></div>':'')+
 '</section>'+
 '<div class="nav"><button id="prev" '+(state.stage===0?'disabled':'')+'>← הקודם</button><button class="skip" id="skip" '+(state.stage===STAGES.length-1?'disabled':'')+'>דלג לשלב הבא ↷</button><button class="next" id="next" '+(!done(state.stage)?'disabled':'')+'>'+(state.stage===STAGES.length-1?'סיום':'הבא →')+'</button></div>'+
 '</section>'+
 '<aside class="side"><section class="card schema"><h3>Schema + Domain</h3><div>'+Object.keys(TABLES).map(t=>'<button data-table="'+t+'" class="'+(t===preview?'sel':'')+'">'+t+'</button>').join('')+'</div><table class="schema-table"><thead><tr><th>Attribute</th><th class="domain">Domain</th></tr></thead><tbody>'+Object.keys(DOMAINS[preview]).map(a=>'<tr><td class="attr">'+esc(a)+'</td><td class="domain">'+esc(DOMAINS[preview][a])+'</td></tr>').join('')+'</tbody></table><div class="schema-note"><b>Domain</b> = קבוצת הערכים שה-attribute יכול לקבל.</div><div class="data-preview"><h4>Data preview · 5 rows</h4>'+previewDataHtml(preview)+'</div></section><section class="card principles"><h3>עקרונות שנלמדו</h3><ul>'+STAGES.filter((x,i)=>done(i)).map(x=>'<li>'+esc(x.principle)+'</li>').join('')+'</ul></section></aside>'+
 '</main>';
 bind();
}
function bind(){
 document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{state.stage=+b.dataset.step;save();lastResult=null;lastError='';feedback='';queryFeedback='';render();});
 document.querySelectorAll('[data-table]').forEach(b=>b.onclick=()=>{preview=b.dataset.table;render();});
 const ed=document.getElementById('sql'), note=document.getElementById('note');
 ed.oninput=()=>{state.sql[state.stage]=ed.value;save();lastResult=null;lastError='';queryFeedback='';const rc=document.getElementById('resultCard');if(rc)rc.remove();const qf=document.getElementById('queryFeedback');if(qf)qf.remove();};
 if(note) note.oninput=()=>{state.notes[state.stage]=note.value;save();};
 document.querySelectorAll('[data-grain]').forEach(el=>el.onchange=()=>{state.structured.grain[el.dataset.grain]=el.value;save();render();});
 document.querySelectorAll('[data-card]').forEach(el=>el.onchange=()=>{state.structured.card[el.dataset.card]=el.value;save();render();});
 document.getElementById('run').onclick=()=>{if(!ed.value.trim()){lastResult=null;lastError='כתבו שאילתת SQL לפני ההרצה.';render();return;}try{lastResult=exec(ed.value);lastError='';queryFeedback='';}catch(e){lastResult=null;lastError=friendlySqlError(e.message);queryFeedback='';}render();};
 document.getElementById('hint').onclick=()=>{const i=state.hint[state.stage];state.hint[state.stage]=i===undefined?0:Math.min(i+1,curr().hints.length-1);save();render();};
 document.getElementById('solution').onclick=()=>{state.solution[state.stage]=!state.solution[state.stage];save();render();};
 const checkQueryNow=()=>{
   try{
     if(!ed.value.trim()){queryFeedback='כתבו שאילתת SQL לפני הבדיקה.';}
     else if(state.stage===0){
       const user=exec(ed.value);
       queryFeedback='השאילתה תקינה ורצה. התקבלו '+user.values.length+' rows ו-'+user.columns.length+' columns. עכשיו השתמשו בנתונים כדי להסיק Grain ו-cardinality.';
     }else{
       const user=exec(ed.value),exp=exec(curr().expected);
       if(sameResultValues(user,exp)){
         queryFeedback=user.columns.join('|')===exp.columns.join('|')
           ?'נכון. השאילתה מחזירה את התוצאה הצפויה.'
           :'נכון. הערכים נכונים. שמות העמודות שונים מהפתרון, וזה לא פוסל את השאילתה.';
         if(!done(state.stage))state.completed.push(state.stage);
         state.skipped=(state.skipped||[]).filter(i=>i!==state.stage);
       }else{
         queryFeedback=diagnoseResult(user,exp,state.stage);
       }
     }
   }catch(e){queryFeedback='לא ניתן להריץ את השאילתה: '+friendlySqlError(e.message);}
   save();render();
 };
 const checkQuery=document.getElementById('checkQuery');
 if(checkQuery)checkQuery.onclick=checkQueryNow;
 const checkAnswer=document.getElementById('check');
 if(checkAnswer)checkAnswer.onclick=()=>{
   const r=checkStructured();
   feedback=r.msg;
   if(r.ok){if(!done(0))state.completed.push(0);state.skipped=(state.skipped||[]).filter(i=>i!==0);}
   save();render();
 };
 document.getElementById('prev').onclick=()=>{if(state.stage>0){state.stage--;save();lastResult=null;lastError='';feedback='';queryFeedback='';render();}};
 document.getElementById('skip').onclick=()=>{if(state.stage<STAGES.length-1){if(!done(state.stage)&&!skipped(state.stage)){state.skipped=state.skipped||[];state.skipped.push(state.stage);}state.stage++;save();lastResult=null;lastError='';feedback='';queryFeedback='';render();}};
 document.getElementById('next').onclick=()=>{if(done(state.stage)&&state.stage<STAGES.length-1){state.stage++;save();lastResult=null;lastError='';feedback='';queryFeedback='';render();}};
 document.getElementById('reset').onclick=()=>{if(confirm('לאפס את כל ההתקדמות והכתיבה?')){localStorage.removeItem(STORAGE_KEY);state=defaults();lastResult=null;lastError='';feedback='';queryFeedback='';render();}};
}
async function init(){
 try{
   const SQL=await initSqlJs({locateFile:f=>'https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/'+f});
   db=new SQL.Database();
   db.run(SEED_SQL);
 }catch(e){dbError='SQLite לא נטען: '+e.message;}
 render();
}
render();init();
</script>
</body>
