const STAGES=[
{title:"שפת הקורס",short:"שפת הקורס",eye:"פתיחה · המודל לפני התחביר",intro:true,context:"לפני שמתחילים לכתוב SQL, מיישרים קו על השפה שבה נתאר נתונים. המטרה היא להפריד בין המודל הרלציוני לבין האופן שבו SQL מציג תוצאות.",task:"עברו על מפת המונחים למטה. לא צריך לשנן; המילון הקבוע בצד יישאר זמין לאורך כל הקורס.",pred:"Database → Relation (טבלה) → Attribute (עמודה) / Tuple (שורה) / Value (ערך). Schema = המבנה; Instance = הנתונים ברגע נתון; Domain = הערכים המותרים; Grain = מה מייצגת שורה אחת.",starter:"",expected:null,note:"המונחים האלה הם שפת העבודה שלנו. אפשר לחזור למילון בכל שלב.",hints:["המילון בצד נשאר זמין לכל אורך המסלול."],solution:"Relation היא המקבילה התאורטית לטבלה במודל הרלציוני. Relation היא קבוצה של tuples: אין בה tuple כפול ואין משמעות לסדר. תוצאת SQL, לעומת זאת, עשויה להכיל שורות כפולות, וסדר מופיע רק כשמגדירים אותו במפורש.",principle:"לפני תחביר SQL, מגדירים במדויק מה הנתונים מייצגים."},
{title:"ממפים את ה-database",short:"מיפוי database",mapping:true,eye:"שלב 1 בחקירה · להבין את הנתונים",context:"עוד לא מחשבים את הפער. קודם בונים מפה של הנתונים: מה מייצגת row אחת בכל relation, ואיך relations קשורים זה לזה. המטרה בסוף השלב היא לדעת על איזה Grain יושבים accounts, subscriptions, users, invoices ו-payments.",task:"כתבו והריצו SELECT על accounts. אחר כך החליפו בעצמכם את שם ה-relation ובדקו גם subscriptions, users, invoices ו-payments. רק אחרי שראיתם את הנתונים, מלאו למטה מה מייצגת שורה אחת בכל relation ומה סוג הקשר בין הישויות.",pred:"ה-SQL כאן אינו 'התשובה'. הוא הדרך שלכם לחקור את הנתונים. אל תנחשו לפי שם הטבלה — בדקו Primary Key, Foreign Key, UNIQUE וחזרות בפועל.",starter:"",expected:null,note:"בחרו את ה-Grain של כל relation ואת סוג הקשר: אחד לאחד, אחד לרבים או רבים לרבים.",hints:["איזו עמודה מזהה tuple באופן ייחודי?","האם account_id חוזר ב-users וב-invoices?","ב-subscriptions account_id הוא UNIQUE; ב-users וב-invoices הוא לא."],solution:"accounts: שורה לחשבון. subscriptions: שורה למינוי ולכל היותר אחת לחשבון. users: שורה למשתמש. invoices: שורה לחשבונית. payments: שורה לתשלום. account→users ו-account→invoices הם 1:M; invoice→payments הוא 1:M.",principle:"Grain = מה מייצגת שורה אחת."},
{title:"קובעים נקודות בקרה",short:"Baseline",baseline:true,eye:"שלב 2 בחקירה · מספרי בקרה",context:"עכשיו, אחרי שמיפינו את ה-database, מודדים את שני הצדדים של הבעיה לפני שמחברים אותם: כמה invoices וכמה כסף חויבו, וכמה payments וכמה כסף שולם. המספרים האלה ישמשו נקודת ייחוס להמשך. כלל אצבע לבדיקה ראשונית: כששואלים כמה rows יש, העדיפו COUNT(*). ‏COUNT(column) סופר רק rows שבהן ל-column יש value שאינו NULL — את ההבדל המלא נלמד בהמשך.",task:"החזירו בשורה אחת ארבע נקודות בקרה: מספר invoices, סכום amount_due הכולל, מספר payments וסכום amount הכולל של payments.",starter:"",expected:"SELECT (SELECT COUNT(*) FROM invoices) invoice_count,(SELECT SUM(amount_due) FROM invoices) issued_total,(SELECT COUNT(*) FROM payments) payment_count,(SELECT SUM(amount) FROM payments) paid_total;",note:"מה כל אחד מארבעת המספרים אומר לכם לפני שמחברים את הנתונים?",hints:["התחילו ב-invoices: כמה יש ומה סכום amount_due הכולל?","אחר כך בדקו payments: כמה יש ומה סכום amount הכולל?","אפשר להחזיר כמה scalar subqueries באותה row."],solution:"SELECT (SELECT COUNT(*) FROM invoices) AS invoice_count, (SELECT SUM(amount_due) FROM invoices) AS issued_total, (SELECT COUNT(*) FROM payments) AS payment_count, (SELECT SUM(amount) FROM payments) AS paid_total;",principle:"לפני שמחברים או מסכמים נתונים, שומרים כמה מספרי מקור פשוטים שאפשר לחזור אליהם. אם אחרי JOIN הסכומים או הספירות משתנים בצורה לא צפויה, יש לנו נקודת ייחוס שמראה שמשהו קרה בדרך."},
{title:"INNER JOIN: מי חויב, מתי ובכמה?",short:"INNER JOIN",eye:"JOIN ראשון · חזרות תקינות",joinViz:"inner",scratch:"שרבטו accounts ↔ invoices. סמנו את ה-cardinality שמצאתם במיפוי, ולמטה כתבו: output grain = ___.",context:"מנהלת הכספים רוצה שם account ליד כל invoice.",task:"הציגו account_name, invoice_id, issued_at ו-amount_due לכל invoice, לפי invoice_id.",pred:"מה יהיה ה-output Grain? האם account_name יכול לחזור בלי שזו כפילות?",starter:"",expected:"SELECT a.account_name,i.invoice_id,i.issued_at,i.amount_due FROM accounts a INNER JOIN invoices i ON i.account_id=a.account_id ORDER BY i.invoice_id;",note:"כתבו תחזית: כמה rows ומה מייצגת כל row?",hints:["איזו עמודה ב-invoices מצביעה על account?","השוו account_id משני הצדדים.","ON i.account_id = a.account_id"],solution:"SELECT a.account_name,i.invoice_id,i.issued_at,i.amount_due FROM accounts a INNER JOIN invoices i ON i.account_id=a.account_id ORDER BY i.invoice_id;",principle:"ב-JOIN של 1:M, ה-Grain של התוצאה נקבע בדרך כלל לפי הצד של ה-M. לדוגמה, בחיבור accounts→invoices כל row מייצגת invoice אחת. אם לאותו account יש 3 invoices, account_name יופיע 3 פעמים — פעם לצד כל invoice. זו לא כפילות, כי ה-invoice_id שונה בכל row. חזרה על value כמו account_name אינה duplicate; duplicate אמיתי הוא חזרה של אותו tuple כולו."},
{title:"INNER JOIN: account וה-users שלו",short:"JOIN 1:M",eye:"תרגול JOIN · חזרת parent",joinViz:"inner",scratch:"שרבטו accounts ↔ users וסמנו 1/M. שאלו את עצמכם: אם ל-account אחד יש כמה users, כמה rows הוא יכול לייצר?",context:"עכשיו מחברים accounts ל-users. לכל user יש account_id, ולאותו account יכולים להיות כמה users.",task:"החזירו account_name, full_name ו-role לכל user. סדרו לפי user_id.",pred:"לפני הכתיבה: מה יהיה ה-Grain של התוצאה? האם account_name יכול להופיע כמה פעמים ועדיין להיות תקין?",starter:"",expected:"SELECT a.account_name,u.full_name,u.role FROM accounts a INNER JOIN users u ON u.account_id=a.account_id ORDER BY u.user_id;",note:"התוצאה צריכה להיות ב-Grain של user.",hints:["התחילו מה-relation שה-row שלו צריך להופיע בתוצאה.","users.account_id מצביע על accounts.account_id.","תנאי ה-ON מחבר את שני ה-account_id."],solution:"SELECT a.account_name,u.full_name,u.role FROM accounts a INNER JOIN users u ON u.account_id=a.account_id ORDER BY u.user_id;",principle:"ב-INNER JOIN של 1:M, ה-Grain בדרך כלל עובר לצד ה-M כאשר כל match מוחזר כ-row."},
{title:"אילו accounts כוללים גם user וגם invoice?",short:"עוד JOIN?",eye:"תרגול · לבחור איך לענות",trapId:"early-fanout",fanoutTrap:true,scratch:"ציירו account במרכז, users בענף אחד ו-invoices בענף שני. סמנו את ה-cardinality של כל ענף. אל תפתרו עדיין — רק שאלו: מה יקרה למספר ה-rows אם שני הענפים מתחברים יחד?",context:"מנהלת הכספים רוצה רשימה של accounts שיש בהם לפחות user אחד וגם לפחות invoice אחת. היא צריכה רשימת accounts — לא את פרטי ה-users או החשבוניות.",task:"החזירו account_name פעם אחת לכל account שיש לו לפחות user אחד וגם לפחות invoice אחת. סדרו לפי account_id.",pred:"לפני הכתיבה: מה ה-Grain של התוצאה המבוקשת? איך תוודאו שכל account מופיע פעם אחת?",starter:"",expected:"SELECT a.account_name FROM accounts a WHERE EXISTS (SELECT 1 FROM users u WHERE u.account_id=a.account_id) AND EXISTS (SELECT 1 FROM invoices i WHERE i.account_id=a.account_id) ORDER BY a.account_id;",note:"אחרי הבדיקה המערכת תנתח לא רק אם הפלט נכון, אלא גם האם בדרך נוצרו שילובים מיותרים.",hints:["המשימה שואלת האם קיים לפחות user והאם קיימת לפחות invoice — היא לא מבקשת את פרטי ה-child rows.","אפשר לנסות קודם JOIN כפי שנראה טבעי לכם ולבדוק מה קורה למספר ה-rows.","אם צריך רק תשובת כן/לא על קיום, EXISTS יכול לבדוק כל תנאי בלי לחבר את שתי קבוצות ה-child rows זו לזו."],solution:"SELECT a.account_name FROM accounts a WHERE EXISTS (SELECT 1 FROM users u WHERE u.account_id=a.account_id) AND EXISTS (SELECT 1 FROM invoices i WHERE i.account_id=a.account_id) ORDER BY a.account_id;",principle:"כשצריך רק לדעת האם child rows קיימות, EXISTS שומר על ה-Grain של ה-parent. JOIN של שני ענפי 1:M עלול ליצור fan-out; DISTINCT או GROUP BY יכולים לנקות את הפלט אחר כך, אבל אינם מונעים את ההתרבות הלוגית."},
{title:"INNER JOIN: subscription וה-plan שלו",short:"JOIN לפי FK",eye:"תרגול JOIN · Foreign Key",joinViz:"inner",context:"ב-subscriptions שמור רק plan_id. השם והמחיר של החבילה נמצאים ב-plans.",task:"החזירו subscription_id, plan_name ו-monthly_price לכל subscription. סדרו לפי subscription_id.",pred:"איזה attribute מחבר בין subscriptions ל-plans?",starter:"",expected:"SELECT s.subscription_id,p.plan_name,p.monthly_price FROM subscriptions s INNER JOIN plans p ON p.plan_id=s.plan_id ORDER BY s.subscription_id;",note:"המטרה היא לזהות את ה-FK ולבנות תנאי ON מדויק.",hints:["חפשו ב-Schema איזה attribute ב-subscriptions מסומן FK→plans.","ההתאמה היא בין plan_id בשני relations.","כתבו INNER JOIN plans ... ON ..."],solution:"SELECT s.subscription_id,p.plan_name,p.monthly_price FROM subscriptions s INNER JOIN plans p ON p.plan_id=s.plan_id ORDER BY s.subscription_id;",principle:"תנאי JOIN מבטא את הקשר בין המפתחות; הוא לא נבחר לפי שמות דומים בלבד."},
{title:"LEFT OUTER JOIN: שומרים גם accounts בלי invoice",short:"LEFT OUTER JOIN",eye:"תרגול JOIN · שמירת הצד השמאלי",joinViz:"left",context:"Harbor Legal קיים ב-accounts אבל אין לו אף invoice. הפעם אסור שהוא ייעלם.",task:"החזירו account_name, invoice_id ו-amount_due לכל account. גם account בלי invoice חייב להופיע. סדרו לפי account_id ואז invoice_id.",pred:"מה יופיע בעמודות של invoice עבור account שאין לו match?",starter:"",expected:"SELECT a.account_name,i.invoice_id,i.amount_due FROM accounts a LEFT OUTER JOIN invoices i ON i.account_id=a.account_id ORDER BY a.account_id,i.invoice_id;",note:"השוו בראש בין INNER JOIN לבין LEFT OUTER JOIN: מי נשמר כאשר אין match?",hints:["ה-relation שחייב להישמר כולו צריך להיות בצד שמאל.","LEFT OUTER JOIN שומר כל row מהצד השמאלי גם בלי match.","כשאין invoice, הערכים מ-invoices יהיו NULL."],solution:"SELECT a.account_name,i.invoice_id,i.amount_due FROM accounts a LEFT OUTER JOIN invoices i ON i.account_id=a.account_id ORDER BY a.account_id,i.invoice_id;",principle:"LEFT OUTER JOIN שומר את כל rows של הצד השמאלי; כשאין match, attributes מהצד הימני הם NULL."},
{title:"JOIN של שלושה relations: account → subscription → plan",short:"3-way JOIN",eye:"תרגול JOIN · שרשרת קשרים",joinViz:"chain",scratch:"ציירו את שלושת ה-relations בקו. חברו רק relations שיש ביניהם קשר אמיתי, וסמנו ליד כל חיבור איזה key מחבר ביניהם.",context:"השם של ה-account נמצא ב-accounts, סטטוס המינוי ב-subscriptions, ושם החבילה והמחיר ב-plans.",task:"החזירו account_name, status, plan_name ו-monthly_price לכל account שיש לו subscription. סדרו לפי account_id.",pred:"אין קיצור דרך בין accounts ל-plans: דרך איזה relation עוברת השרשרת?",starter:"",expected:"SELECT a.account_name,s.status,p.plan_name,p.monthly_price FROM accounts a INNER JOIN subscriptions s ON s.account_id=a.account_id INNER JOIN plans p ON p.plan_id=s.plan_id ORDER BY a.account_id;",note:"חברו כל זוג relations לפי הקשר שלו, צעד אחד בכל פעם.",hints:["החיבור הראשון הוא accounts ↔ subscriptions.","החיבור השני הוא subscriptions ↔ plans.","אל תחברו accounts ישירות ל-plans רק מפני ששניהם קשורים עסקית."],solution:"SELECT a.account_name,s.status,p.plan_name,p.monthly_price FROM accounts a INNER JOIN subscriptions s ON s.account_id=a.account_id INNER JOIN plans p ON p.plan_id=s.plan_id ORDER BY a.account_id;",principle:"ב-JOIN של כמה relations בונים שרשרת של קשרים אמיתיים; כל ON מתאר קשר אחד."},
{title:"לאילו accounts יש לפחות invoice paid אחת?",short:"קיום התאמה",eye:"EXISTS · שומרים account Grain",context:"צריך רשימת accounts, לא רשימת invoices. פרטי החשבונית לא דרושים.",task:"החזירו account_name פעם אחת לכל account שיש לו לפחות invoice אחת ב-status='paid'.",pred:"JOIN רגיל יוצר row לכל invoice תואמת. האם זה ה-Grain הרצוי?",starter:"",expected:"SELECT a.account_name FROM accounts a WHERE EXISTS (SELECT 1 FROM invoices i WHERE i.account_id=a.account_id AND i.status='paid') ORDER BY a.account_name;",note:"איזו יחידה אתם רוצים להחזיר?",hints:["ה-relation השני משמש רק כתנאי.","בדקו האם קיימת לפחות התאמה אחת.","השתמשו ב-EXISTS correlated."],solution:"SELECT a.account_name FROM accounts a WHERE EXISTS (SELECT 1 FROM invoices i WHERE i.account_id=a.account_id AND i.status='paid') ORDER BY a.account_name;",principle:"EXISTS בודק קיום בלי לייצר matching rows בתוצאה."},
{title:"איזה account עדיין לא קיבל אף invoice?",short:"Anti-Join",eye:"NOT EXISTS · היעדר התאמה",context:"צריך למצוא account שאין לו שום row ב-invoices.",task:"החזירו account_name של כל account שאין לו אף invoice.",starter:"",expected:"SELECT a.account_name FROM accounts a WHERE NOT EXISTS (SELECT 1 FROM invoices i WHERE i.account_id=a.account_id) ORDER BY a.account_name;",note:"מה פירוש 'אין אף התאמה' במונחי relations?",hints:["אי אפשר למצוא שורה חסרה מתוך invoices בלבד.","בדקו עבור כל account אם קבוצת ההתאמות ריקה.","NOT EXISTS."],solution:"SELECT a.account_name FROM accounts a WHERE NOT EXISTS (SELECT 1 FROM invoices i WHERE i.account_id=a.account_id) ORDER BY a.account_name;",principle:"Anti-Join שומר rows מההורה שאין להן match.",gotcha:"מלכודת NULL: אפשר לכתוב anti-join גם עם NOT IN, אבל אם רשימת ה-subquery מכילה ולו NULL אחד, NOT IN עלול להחזיר 0 שורות בגלל SQL three-valued logic. NOT EXISTS חסין לכך ולכן עדיף כברירת מחדל."},
{title:"שומרים גם accounts בלי invoices",short:"LEFT OUTER JOIN ו-NULL",eye:"Outer Join · counting unit",context:"הפעם רוצים report לכל account, כולל Harbor Legal שאין לו invoice.",task:"החזירו לכל account: account_name, מספר invoices וסכום amount_due. account בלי invoices צריך לקבל 0 ו-0.",pred:"אחרי LEFT OUTER JOIN, למה COUNT(*) עלול לספור 1 גם כשאין invoice?",starter:"",expected:"SELECT a.account_name,COUNT(i.invoice_id) invoice_count,COALESCE(SUM(i.amount_due),0) total_issued FROM accounts a LEFT OUTER JOIN invoices i ON i.account_id=a.account_id GROUP BY a.account_id,a.account_name ORDER BY a.account_id;",note:"מה COUNT(*) סופר כאן ומה COUNT(i.invoice_id) סופר?",hints:["LEFT OUTER JOIN שומר row של account גם בלי match.","COUNT(column) מתעלם מ-NULL.","השתמשו COUNT(i.invoice_id) ו-COALESCE(SUM(...),0)."],solution:"SELECT a.account_name,COUNT(i.invoice_id) AS invoice_count,COALESCE(SUM(i.amount_due),0) AS total_issued FROM accounts a LEFT OUTER JOIN invoices i ON i.account_id=a.account_id GROUP BY a.account_id,a.account_name ORDER BY a.account_id;",principle:"ב-LEFT OUTER JOIN, COUNT(*) סופר output rows; COUNT(child_id) סופר matches אמיתיים."},
{title:"שלושה COUNTs, שלוש שאלות",short:"COUNT ו-NULL",eye:"NULL semantics",context:"ב-payments יש method חסר בחלק מהתשלומים.",task:"החזירו payment_rows, recorded_methods ו-distinct_methods.",starter:"",expected:"SELECT COUNT(*) payment_rows,COUNT(method) recorded_methods,COUNT(DISTINCT method) distinct_methods FROM payments;",note:"הסבירו rows, non-NULL values ו-distinct non-NULL values.",hints:["method חסר בשתי rows.","COUNT(column) מתעלם מ-NULL.","הוסיפו COUNT(method) ו-COUNT(DISTINCT method)."],solution:"SELECT COUNT(*) AS payment_rows,COUNT(method) AS recorded_methods,COUNT(DISTINCT method) AS distinct_methods FROM payments;",principle:"COUNT(*) סופר rows; COUNT(column) non-NULL; COUNT(DISTINCT) values שונים."},
{title:"אילו accounts צברו חיוב של לפחות 200 ₪?",short:"WHERE מול HAVING",eye:"סינון rows לעומת groups",context:"הדרישה עוסקת בסכום המצטבר לכל account, לא בגודל invoice בודדת.",task:"החזירו account_name ו-total_issued עבור accounts שסכום כל ה-invoices שלהם לפחות 200.",pred:"WHERE amount_due>=200 יסנן invoices לפני הקיבוץ — זו שאלה אחרת.",starter:"",expected:"SELECT a.account_name,SUM(i.amount_due) total_issued FROM accounts a JOIN invoices i ON i.account_id=a.account_id GROUP BY a.account_id,a.account_name HAVING SUM(i.amount_due)>=200 ORDER BY a.account_name;",note:"מה מסננים לפני GROUP BY ומה אחרי?",hints:["WHERE עובד על input rows.","HAVING עובד על groups.","HAVING SUM(i.amount_due)>=200"],solution:"SELECT a.account_name,SUM(i.amount_due) AS total_issued FROM accounts a JOIN invoices i ON i.account_id=a.account_id GROUP BY a.account_id,a.account_name HAVING SUM(i.amount_due)>=200 ORDER BY a.account_name;",principle:"WHERE מסנן rows; HAVING מסנן groups אחרי aggregation."},
{title:"מה סך החיוב בכל חודש?",short:"GROUP BY משנה Grain",eye:"Aggregation · Grain חדש",context:"כעת יחידת הניתוח היא חודש, לא account ולא invoice.",task:"החזירו issue_month, invoice_count ו-total_issued לכל חודש, לפי issue_month.",starter:"",expected:"SELECT i.issue_month,COUNT(*) invoice_count,SUM(i.amount_due) total_issued FROM invoices i GROUP BY i.issue_month ORDER BY i.issue_month;",note:"מה מייצגת שורה אחת אחרי GROUP BY?",hints:["עמודת הקיבוץ מגדירה את ה-Grain החדש.","אל תוסיפו account_name אם השאלה היא חודשית.","GROUP BY i.issue_month"],solution:"SELECT i.issue_month,COUNT(*) AS invoice_count,SUM(i.amount_due) AS total_issued FROM invoices i GROUP BY i.issue_month ORDER BY i.issue_month;",principle:"GROUP BY מגדיר Grain חדש: row אחת לכל combination של ערכי הקיבוץ."},
{title:"כמה projects משויכים לכל user?",short:"Many-to-Many",eye:"Bridge relation · יחידת הספירה",scratch:"ציירו users ↔ project_memberships ↔ projects. כתבו ליד ה-bridge: row אחת = ___. אחר כך כתבו מה אתם באמת רוצים לספור.",context:"users ו-projects קשורים M:M דרך project_memberships.",task:"החזירו full_name ו-project_count לכל user, כולל מי שאין לו project, לפי user_id.",starter:"",expected:"SELECT u.full_name,COUNT(DISTINCT pm.project_id) project_count FROM users u LEFT OUTER JOIN project_memberships pm ON pm.user_id=u.user_id GROUP BY u.user_id,u.full_name ORDER BY u.user_id;",note:"מה מייצגת row ב-bridge ומה אתם רוצים לספור?",hints:["project_memberships מייצג relationship.","COUNT(*) על LEFT OUTER JOIN שוב כולל row NULL.","ספרו project_id ייחודיים."],solution:"SELECT u.full_name,COUNT(DISTINCT pm.project_id) AS project_count FROM users u LEFT OUTER JOIN project_memberships pm ON pm.user_id=u.user_id GROUP BY u.user_id,u.full_name ORDER BY u.user_id;",principle:"ב-M:M, bridge rows מייצגים relationships; הגדירו במפורש את יחידת הספירה."},
{title:"Invoices × Users: מלכודת ה-Fan-out",short:"Pre-aggregation",eye:"1:M × 1:M · ניפוח מדדים",scratch:"ציירו account עם שני ענפים: users ו-invoices. קחו דוגמה של 2 users ו-3 invoices ושרבטו כמה combinations נוצרים. אחר כך סמנו לאיזה Grain צריך לצמצם כל ענף לפני החיבור.",context:"רוצים report לכל account עם מספר users, מספר invoices וסכום invoices. JOIN ישיר ל-users וגם invoices יוצר שילובים.",task:"החזירו לכל account account_name, user_count, invoice_count ו-total_issued בלי לנפח אף מדד. בצעו aggregation לכל child relation לפני החיבור.",pred:"נסו לחזות לפני ההרצה: אם ל-account יש כמה users וגם כמה invoices, כמה rows ייצור JOIN ישיר לשניהם? מה יקרה ל-SUM(amount_due)? רשמו את הניחוש שלכם בשדה ההסבר, ורק אז הריצו את הגרסה הנאיבית ובדקו.",requireNote:true,starter:"",expected:"WITH inv AS (SELECT account_id,COUNT(*) invoice_count,SUM(amount_due) total_issued FROM invoices GROUP BY account_id), usr AS (SELECT account_id,COUNT(*) user_count FROM users GROUP BY account_id) SELECT a.account_name,COALESCE(usr.user_count,0) user_count,COALESCE(inv.invoice_count,0) invoice_count,COALESCE(inv.total_issued,0) total_issued FROM accounts a LEFT OUTER JOIN inv ON inv.account_id=a.account_id LEFT OUTER JOIN usr ON usr.account_id=a.account_id ORDER BY a.account_id;",note:"למה DISTINCT על SUM אינו תיקון כללי ל-fan-out?",hints:["זה 1:M × 1:M.","צמצמו כל child ל-row אחת לכל account קודם.","CTE אחד ל-invoices ואחד ל-users."],solution:"WITH inv AS (SELECT account_id,COUNT(*) AS invoice_count,SUM(amount_due) AS total_issued FROM invoices GROUP BY account_id), usr AS (SELECT account_id,COUNT(*) AS user_count FROM users GROUP BY account_id) SELECT a.account_name,COALESCE(usr.user_count,0) AS user_count,COALESCE(inv.invoice_count,0) AS invoice_count,COALESCE(inv.total_issued,0) AS total_issued FROM accounts a LEFT OUTER JOIN inv ON inv.account_id=a.account_id LEFT OUTER JOIN usr ON usr.account_id=a.account_id ORDER BY a.account_id;",principle:"כשכמה child relations הם 1:M, pre-aggregate כל {title:"Capstone: accounts עם פעילות תשלום מתאימה",short:"Capstone",eye:"משימה פתוחה · בחרו את הכלים",scratch:"לפני SQL, כתבו שלושה דברים בלבד: 1) output grain, 2) אילו relations תורמים rows למדד, 3) אילו relations רק בודקים תנאי.",context:"קיבלתם דרישה עסקית. הפעם לא נאמר באיזה operator להשתמש; החליטו לפי ה-Grain ולפי התפקיד של כל relation.",task:"החזירו account_name ו-total_paid עבור accounts שסך התשלומים שלהם לפחות 120, שיש להם לפחות invoice paid אחת, ושאין להם שום invoice open. סדרו לפי account_name.",starter:"",expected:"SELECT a.account_name,SUM(p.amount) total_paid FROM accounts a JOIN invoices i ON i.account_id=a.account_id JOIN payments p ON p.invoice_id=i.invoice_id WHERE EXISTS (SELECT 1 FROM invoices ip WHERE ip.account_id=a.account_id AND ip.status='paid') AND NOT EXISTS (SELECT 1 FROM invoices io WHERE io.account_id=a.account_id AND io.status='open') GROUP BY a.account_id,a.account_name HAVING SUM(p.amount)>=120 ORDER BY a.account_name;",note:"לפני ה-SQL: מה ה-Grain הרצוי? אילו relations צריכים לתרום rows למדד, ואילו נדרשים רק כדי לבדוק תנאי?",requireNote:true,hints:["שאלו קודם איזה relation מכיל את הערכים שצריך לסכם.","תנאי של יש לפחות אחד לא מחייב בהכרח לייצר rows בתוצאה.","תנאי של אין אף אחד הוא בדיקת היעדר התאמה."],solution:"SELECT a.account_name,SUM(p.amount) AS total_paid FROM accounts a JOIN invoices i ON i.account_id=a.account_id JOIN payments p ON p.invoice_id=i.invoice_id WHERE EXISTS (SELECT 1 FROM invoices ip WHERE ip.account_id=a.account_id AND ip.status='paid') AND NOT EXISTS (SELECT 1 FROM invoices io WHERE io.account_id=a.account_id AND io.status='open') GROUP BY a.account_id,a.account_name HAVING SUM(p.amount)>=120 ORDER BY a.account_name;",principle:"במשימה פתוחה מתחילים מה-Grain ומהתפקיד של כל relation, ורק אז בוחרים את הפעולות המתאימות."},

const GLOSSARY=[
 ["relation","המקבילה התאורטית לטבלה במודל הרלציוני; relation היא קבוצה לא-מסודרת של tuples ללא כפילויות."],
 ["tuple","רשומה אחת בתוך relation, שמכילה value לכל attribute לפי ה-schema."],
 ["attribute","שדה במבנה של relation — המקבילה התאורטית לעמודה."],
 ["value","הערך הקונקרטי שנמצא ב-attribute של tuple מסוים."],
 ["instance","אוסף ה-tuples שקיימים ב-database ברגע נתון."],
 ["schema","המבנה המוגדר של ה-database: relations, attributes, domains ואילוצים."],
 ["domain","קבוצת הערכים שה-attribute רשאי לקבל."],
 ["grain","מה tuple אחת ב-relation או בתוצאה מייצגת מבחינה עסקית."],
 ["Primary Key","attribute או צירוף attributes שמזהה כל tuple באופן ייחודי."],
 ["Foreign Key","attribute שמפנה למפתח ב-relation אחר וכך מייצג קשר בין ישויות."],
 ["UNIQUE","אילוץ שמונע חזרה של אותו ערך או צירוף ערכים באותו שדה או צירוף שדות."],
 ["cardinality","כמה מופעים מצד אחד של קשר יכולים להתאים למופעים בצד השני, למשל 1:1, 1:M או M:M."],
 ["NULL","סמן ב-SQL לחוסר ערך ידוע או רלוונטי; הוא אינו value רגיל."],
 ["three-valued logic","לוגיקה שבה תנאי SQL יכול להיות TRUE, FALSE או UNKNOWN, בין היתר בגלל NULL."],
 ["aggregate","פונקציה שמסכמת כמה rows לערך אחד, למשל COUNT או SUM."],
 ["scalar subquery","תת-שאילתה שמחזירה value יחיד ולכן יכולה לשמש כביטוי."],
 ["correlated subquery","תת-שאילתה שמתייחסת ל-row מהשאילתה החיצונית ולכן נבחנת בהקשר שלה."],
 ["anti-join","דפוס שמחזיר rows מצד אחד שאין להן match בצד השני, למשל באמצעות NOT EXISTS."],
 ["bridge relation","relation שמייצגת קשר M:M באמצעות Foreign Keys לשני הצדדים."],
 ["fan-out","התרבות rows בעקבות JOIN עם כמה matches, שעלולה לנפח ספירות וסכומים."],
 ["pre-aggregation","צמצום relation ל-Grain הרצוי באמצעות aggregation לפני שמחברים אותה ב-JOIN."]
];

function formatStageTerms(text,seen){
 let out=esc(text||'');
 const defs=[["relation","טבלה"],["tuple","שורה"],["attribute","עמודה"],["value","ערך"]];
 defs.forEach(([term,he])=>{
   if(seen.has(term))return;
   const re=new RegExp("\\b"+term+"\\b(?!\\s*\\("+he+"\\))","i");
   if(re.test(out)){out=out.replace(re,term+" ("+he+")");seen.add(term);}
 });
 return out;
}

const defaults=()=>({version:APP_STATE_VERSION,stage:0,sql:{},notes:{},scratch:{},completed:[],skipped:[],hint:{},solution:{},decision:{},structured:{grain:{},card:{}},theme:'light',attempted:[],graphOpen:{}});
let state=load();
function migrateState(x){
 const raw=x||{};
 const out=Object.assign(defaults(),raw);
 out.structured=Object.assign({grain:{},card:{}},raw.structured||{});
 out.structured.grain=out.structured.grain||{};
 out.structured.card=out.structured.card||{};
 out.decision=raw.decision||{};
 out.scratch=raw.scratch||{};
 out.skipped=out.skipped||[];
 out.attempted=Array.isArray(out.attempted)?out.attempted:[];
 out.graphOpen=out.graphOpen||{};
 out.theme=out.theme==='dark'?'dark':'light';
 if(out.structured.card.acc_sub==="1:0..1")out.structured.card.acc_sub="1:1";
 const v=(raw.version||0);
 const hasSavedState=Object.keys(raw).length>0;

 // Historical migration: four JOIN practice stages were inserted before old stage 3.
 if(v<5&&hasSavedState){
   const shiftIndex=i=>Number(i)>=3?Number(i)+4:Number(i);
   const shiftMap=o=>Object.fromEntries(Object.entries(o||{}).map(([k,val])=>[String(shiftIndex(k)),val]));
   out.completed=(out.completed||[]).map(shiftIndex);
   out.skipped=(out.skipped||[]).map(shiftIndex);
   out.attempted=(out.attempted||[]).map(shiftIndex);
   out.sql=shiftMap(out.sql);
   out.notes=shiftMap(out.notes);
   out.hint=shiftMap(out.hint);
   out.solution=shiftMap(out.solution);
   out.graphOpen=shiftMap(out.graphOpen);
   if(Number(out.stage)>=3)out.stage=3;
 }

 // v9 adds a new intro at index 0. Existing learners keep their exact old stage/progress,
 // shifted by +1, and the new intro is marked complete so it does not block them.
 if(v<9&&hasSavedState){
   const plusOne=i=>Number(i)+1;
   const shiftMap=o=>Object.fromEntries(Object.entries(o||{}).map(([k,val])=>[String(plusOne(k)),val]));
   out.stage=plusOne(out.stage||0);
   out.completed=[0,...(out.completed||[]).map(plusOne)].filter((v,i,a)=>a.indexOf(v)===i);
   out.skipped=(out.skipped||[]).map(plusOne);
   out.attempted=(out.attempted||[]).map(plusOne);
   out.sql=shiftMap(out.sql);
   out.notes=shiftMap(out.notes);
   out.hint=shiftMap(out.hint);
   out.solution=shiftMap(out.solution);
   out.graphOpen=shiftMap(out.graphOpen);
 }
 // v10 inserts the early fan-out trap at index 5.
 // Preserve all saved work, shift old stages 5+ by one, and bring learners
 // who were already past this point back to the new required lesson.
 if(v<10&&hasSavedState){
   const oldStage=Number(out.stage||0);
   const shiftIndex=i=>Number(i)>=5?Number(i)+1:Number(i);
   const shiftMap=o=>Object.fromEntries(Object.entries(o||{}).map(([k,val])=>[String(shiftIndex(k)),val]));
   out.completed=(out.completed||[]).map(shiftIndex);
   out.skipped=(out.skipped||[]).map(shiftIndex);
   out.attempted=(out.attempted||[]).map(shiftIndex);
   out.sql=shiftMap(out.sql);
   out.notes=shiftMap(out.notes);
   out.hint=shiftMap(out.hint);
   out.solution=shiftMap(out.solution);
   out.graphOpen=shiftMap(out.graphOpen);
   out.stage=oldStage>=5?5:oldStage;
 }
 out.version=APP_STATE_VERSION;
 return out;
}
function load(){try{
 const raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
 const out=migrateState(raw);
 if((raw.version||0)<APP_STATE_VERSION)localStorage.setItem(STORAGE_KEY,JSON.stringify(out));
 return out;
}catch(e){return defaults();}}

function fanoutApproach(sql){
 const q=String(sql||"");

 if(/\bDISTINCT\b/i.test(q))return "distinct";
 if(/\bGROUP\s+BY\b/i.test(q))return "group";
 if(/\bLEFT\s+(?:OUTER\s+)?JOIN\b/i.test(q))return "left";
 if(/\bINNER\s+JOIN\b/i.test(q)||/\bJOIN\b/i.test(q))return "join";
 if(/\bWHERE\b/i.test(q))return "filter";
 return "other";
}

function diagnoseResult(user,exp,stage){
 const parts=[];
 if(user.columns.length!==exp.columns.length){
   parts.push("מספר העמודות שונה: קיבלתם "+user.columns.length+", והמשימה מצפה ל-"+exp.columns.length+".");
   parts.push("העמודות שהתוצאה הצפויה מייצגת: "+exp.columns.join(", ")+".");
 }else if(user.values.length!==exp.values.length){
   parts.push("מספר השורות שונה: קיבלתם "+user.values.length+", והפלט הצפוי מכיל "+exp.values.length+".");
 }
 const dups=duplicateRows(user), expDups=duplicateRows(exp);
 if(dups.length&&!expDups.length){
   parts.push("יש אצלכם שורות זהות שחוזרות. לדוגמה: "+dups.slice(0,1).map(x=>x.row.map(v=>v===null?'NULL':v).join(" | ")+" ("+x.count+" פעמים)").join("")+".");
 }
 if(user.columns.length===exp.columns.length){
   const diff=multisetDiff(sortedRowKeys(user),sortedRowKeys(exp));
   if(diff.missing.length)parts.push("חסרה למשל שורה: "+formatRowKey(diff.missing[0])+".");
   if(diff.extra.length)parts.push("יש למשל שורה שלא אמורה להיות: "+formatRowKey(diff.extra[0])+".");
 }
 const h=stageErrorHint(stage); if(h)parts.push("כיוון: "+h);

}

 return rs[rs.length-1];
}

   ta.selectionStart=ta.selectionEnd=start+token.length;
   state.sql[state.stage]=ta.value;
   save();
   ta.focus();
   showInsertToast(token);
 }
}
function showInsertToast(token){

   el=document.createElement('div');

const SQL_HINT_KEYWORDS=[
 "SELECT","FROM","WHERE","INNER JOIN","LEFT OUTER JOIN","ON","AS","AND","OR","NOT",
 "EXISTS","NOT EXISTS","GROUP BY","HAVING","ORDER BY","ASC","DESC","DISTINCT",
 "COUNT","SUM","AVG","MIN","MAX","COALESCE","CASE","WHEN","THEN","ELSE","END","WITH","NULL","IS NULL","IS NOT NULL"
];
const SQL_RESERVED_ALIAS=new Set(["WHERE","INNER","LEFT","RIGHT","FULL","JOIN","ON","GROUP","ORDER","HAVING","LIMIT","UNION","AND","OR","AS"]);

function aliasMapFromSql(sql){
 const map={};
 const re=/\b(?:FROM|JOIN)\s+([A-Za-z_][A-Za-z0-9_]*)(?:\s+(?:AS\s+)?([A-Za-z_][A-Za-z0-9_]*))?/gi;
 let m;
 while((m=re.exec(String(sql||"")))){
   const table=m[1],alias=m[2];
   if(!DOMAINS[table])continue;
   map[table]=table;
   if(alias&&!SQL_RESERVED_ALIAS.has(alias.toUpperCase()))map[alias]=table;
 }
 return map;
}
function completionItem(text,label,type){
 return {text:text,displayText:text+(label?"  · "+label:""),className:type?"sql-hint-"+type:""};
}
function sqlCompletionHint(editor){
 const cur=editor.getCursor();
 const line=editor.getLine(cur.line);
 const before=line.slice(0,cur.ch);
 const aliases=aliasMapFromSql(editor.getValue());
 let from=CodeMirror.Pos(cur.line,cur.ch),to=CodeMirror.Pos(cur.line,cur.ch),prefix="",items=[];

 const dotted=before.match(/([A-Za-z_][A-Za-z0-9_]*)\.([A-Za-z_][A-Za-z0-9_]*)?$/);
 if(dotted){
   const qualifier=dotted[1],table=aliases[qualifier]||(DOMAINS[qualifier]?qualifier:null);
   prefix=dotted[2]||"";
   from=CodeMirror.Pos(cur.line,cur.ch-prefix.length);
   if(table)items=Object.keys(DOMAINS[table]).map(col=>completionItem(col,table,"column"));
 }else{
   const word=before.match(/[A-Za-z_][A-Za-z0-9_]*$/);
   prefix=word?word[0]:"";
   from=CodeMirror.Pos(cur.line,cur.ch-prefix.length);
   const context=before.slice(0,cur.ch-prefix.length);
   const wantsTable=/\b(?:FROM|JOIN)\s*$/i.test(context);
   if(wantsTable){
     items=Object.keys(DOMAINS).map(t=>completionItem(t,"relation","table"));
   }else{
     const tables=Object.keys(DOMAINS).map(t=>completionItem(t,"relation","table"));
     const columns=[];
     Object.keys(DOMAINS).forEach(t=>Object.keys(DOMAINS[t]).forEach(col=>columns.push(completionItem(col,t,"column"))));
     const keywords=SQL_HINT_KEYWORDS.map(k=>completionItem(k,"SQL","keyword"));
     items=[...tables,...columns,...keywords];
   }
 }

 const p=prefix.toLowerCase();
 items=items.filter(x=>!p||x.text.toLowerCase().startsWith(p));
 const seen=new Set();
 items=items.filter(x=>{const k=x.text+"|"+x.displayText;if(seen.has(k))return false;seen.add(k);return true;});
 return {list:items,from:from,to:to};
}
function showSqlHints(editor,force){
 if(!window.CodeMirror||!CodeMirror.showHint)return;
 if(!force){
   const cur=editor.getCursor(),line=editor.getLine(cur.line).slice(0,cur.ch);
   const dotted=/[A-Za-z_][A-Za-z0-9_]*\.[A-Za-z0-9_]*$/.test(line);
   const word=(line.match(/[A-Za-z_][A-Za-z0-9_]*$/)||[""])[0];
   if(!dotted&&word.length<2)return;
 }
 CodeMirror.showHint(editor,sqlCompletionHint,{completeSingle:false,alignWithWord:true});
}

function grainExplanation(rel,choice){
 const correct={accounts:"account",subscriptions:"subscription",users:"user",invoices:"invoice",payments:"payment"};
 const labels={account:"חשבון אחד",subscription:"מינוי אחד",user:"משתמש אחד",invoice:"חשבונית אחת",payment:"תשלום אחד"};
 const why={
  accounts:"account_id הוא Primary Key, ולכן כל tuple ב-accounts מייצג חשבון אחד.",
  subscriptions:"subscription_id הוא Primary Key, ולכן כל tuple ב-subscriptions מייצג מינוי אחד. account_id רק מציין לאיזה account המינוי שייך.",
  users:"user_id הוא Primary Key, ולכן כל tuple ב-users מייצג משתמש אחד. account_id יכול לחזור כי לאותו account יכולים להיות כמה users.",
  invoices:"invoice_id הוא Primary Key, ולכן כל tuple ב-invoices מייצג חשבונית אחת.",
  payments:"payment_id הוא Primary Key, ולכן כל tuple ב-payments מייצג תשלום אחד. invoice_id יכול לחזור כי חשבונית יכולה לקבל כמה payments."
 };
 if(!choice)return "";
 const ok=choice===correct[rel];
 return '<div class="answer-exp '+(ok?'good':'wrong')+'"><b>'+(ok?'נכון. ':'לא. התשובה היא '+labels[correct[rel]]+'. ')+'</b>'+why[rel]+'</div>';
}
function cardExplanation(key,choice){
 const correct={acc_sub:"1:1",acc_users:"1:M",acc_inv:"1:M",inv_pay:"1:M"};
 const labels={"1:1":"1:1 — אחד לאחד","1:M":"1:M — אחד לרבים","M:M":"M:M — רבים לרבים"};
 const why={
  acc_sub:"subscriptions.account_id הוא UNIQUE, ולכן לאותו account לא יכולות להיות כמה subscriptions. לכן סוג הקשר הוא אחד לאחד. הערת מודל: ה-schema לא מחייב שלכל account תהיה subscription, אבל אנחנו לא מכניסים את האופציונליות לסימון הקשר כאן.",
  acc_users:"users.account_id אינו UNIQUE, ולכן אותו account_id יכול להופיע בכמה rows של users. כל user שייך ל-account אחד, אבל ל-account אחד יכולים להיות כמה users.",
  acc_inv:"invoices.account_id אינו UNIQUE, ולכן אותו account_id יכול להופיע בכמה invoices. כל invoice שייכת ל-account אחד, אבל ל-account אחד יכולות להיות כמה invoices.",
  inv_pay:"payments.invoice_id אינו UNIQUE, ולכן אותה invoice יכולה להופיע בכמה rows של payments. כל payment שייך ל-invoice אחת, אבל ל-invoice אחת יכולים להיות כמה payments."
 };
 if(!choice)return "";
 const ok=choice===correct[key];
 return '<div class="answer-exp '+(ok?'good':'wrong')+'"><b>'+(ok?'נכון. ':'לא. התשובה היא '+labels[correct[key]]+'. ')+'</b>'+why[key]+'</div>';
}
function structuredHtml(){
 const g=state.structured.grain||{}, k=state.structured.card||{};

   pairs.map(([key,label])=>'<div class="rel">'+label+'</div><select data-card="'+key+'">'+opts(CARD_OPTIONS,k[key]||'')+'</select>'+cardExplanation(key,k[key]||'')).join('')+

function checkStructured(){
 const g=state.structured.grain||{}, k=state.structured.card||{};
 const grainExpected={accounts:"account",subscriptions:"subscription",users:"user",invoices:"invoice",payments:"payment"};
 const cardExpected={acc_sub:"1:1",acc_users:"1:M",acc_inv:"1:M",inv_pay:"1:M"};
 const missing=[...Object.keys(grainExpected).filter(x=>!g[x]),...Object.keys(cardExpected).filter(x=>!k[x])];
 if(missing.length) return {ok:false,msg:"עוד לא. נשארו שדות שלא מולאו."};
 const badGrain=Object.keys(grainExpected).filter(x=>g[x]!==grainExpected[x]);
 const badCard=Object.keys(cardExpected).filter(x=>k[x]!==cardExpected[x]);
 if(badGrain.length||badCard.length){
   const parts=[];
   if(badGrain.length) parts.push("בדקו שוב את ה-Grain של: "+badGrain.join(", "));
   if(badCard.length) parts.push("בדקו שוב את ה-cardinality של: "+badCard.map(x=>({acc_sub:"accounts → subscriptions",acc_users:"accounts → users",acc_inv:"accounts → invoices",inv_pay:"invoices → payments"}[x])).join(", "));
   return {ok:false,msg:parts.join(" · ")};
 }
 return {ok:true,msg:"נכון. עכשיו יש לנו מיפוי ברור: מה כל row מייצגת ואיך הישויות קשורות זו לזו."};
}

 '<div class="nav"><button id="prev" '+(state.stage===0?'disabled':'')+'>← הקודם</button><button class="next" id="next" '+(!done(state.stage)?'disabled':'')+'>'+(state.stage===STAGES.length-1?'סיום':'הבא →')+'</button></div>'+
 '</section>'+
 '<aside class="side"><section class="card schema"><h3>Schema + Domain</h3><div class="schema-relations">'+Object.keys(TABLES).map(t=>'<span class="relation-chip"><button data-table="'+t+'" class="'+(t===preview?'sel':'')+'">'+t+'</button>'+(canInsert?'<button class="insert-mini" data-insert-token="'+esc(t)+'" title="הוסף relation לעורך">＋</button>':'')+'</span>').join('')+'</div>'+(canInsert?'<div class="insert-help">＋ מוסיף לעורך במקום הסמן · Ctrl+Space פותח autocomplete</div>':'')+(relationGraphUnlocked()?'<button class="relation-toggle" id="toggleRelations">'+(relationGraphOpen()?'הסתר קשרים':'הצג קשרים')+'</button>'+(relationGraphOpen()?schemaGraphHtml():''):'<div class="schema-note relation-lock">קשרי ה-FK מוסתרים עד שתנסו שאילתה או תבקשו רמז.</div>')+'<table class="schema-table"><thead><tr><th>Attribute</th><th class="domain">Domain</th></tr></thead><tbody>'+Object.keys(DOMAINS[preview]).map(a=>'<tr><td class="attr"><div class="attr-cell">'+(canInsert?'<button class="attr-name-insert" data-insert-token="'+esc(a)+'" title="לחץ להוספה לעורך">'+esc(a)+'</button>':'<span>'+esc(a)+'</span>')+(canInsert?'<button class="insert-attr" data-insert-token="'+esc(a)+'" title="הוסף attribute לעורך">＋</button>':'')+'</div></td><td class="domain">'+esc(DOMAINS[preview][a])+'</td></tr>').join('')+'</tbody></table><div class="schema-note"><b>Domain</b> = קבוצת הערכים שה-attribute יכול לקבל.</div><div class="data-preview"><h4>Data preview · 5 rows</h4>'+previewDataHtml(preview,canInsert)+'</div></section>'+
 glossaryHtml()+
 '<section class="card principles"><h3>עקרונות שנלמדו</h3><ul>'+(STAGES.filter((x,i)=>done(i)).length?STAGES.filter((x,i)=>done(i)).map(x=>'<li>'+esc(x.principle)+'</li>').join(''):'<li style="color:#9aa79f">עוד לא הושלמו שלבים.</li>')+'</ul></section></aside>'+
 '</main>';
 mountEditor();
 applyTheme();
 bind();
}
function applyTheme(){document.documentElement.setAttribute('data-theme',state.theme==='dark'?'dark':'light');}
function mountEditor(){
 cm=null;
 const ta=document.getElementById('sql');
 if(!ta)return;
 if(window.CodeMirror){
   cm=CodeMirror.fromTextArea(ta,{mode:'text/x-sql',lineNumbers:true,matchBrackets:true,direction:'ltr',lineWrapping:true,extraKeys:{
     'Ctrl-Enter':runCurrent,'Cmd-Enter':runCurrent,
     'Ctrl-Z':editor=>editor.undo(),'Cmd-Z':editor=>editor.undo(),
     'Ctrl-Y':editor=>editor.redo(),'Cmd-Shift-Z':editor=>editor.redo(),
     'Ctrl-Space':editor=>showSqlHints(editor,true)
   }});
   cm.setSize('100%',260);
   cm.on('change',()=>{state.sql[state.stage]=cm.getValue();save();invalidateResult();});
   cm.on('cursorActivity',()=>{rememberEditorCursor();});
   cm.on('focus',()=>{rememberEditorCursor();});
   lastEditorCursor=cm.getDoc().getCursor();
   cm.on('inputRead',(editor,change)=>{
     if(change&&change.origin==="complete")return;
     const typed=((change&&change.text)||[]).join("");
     if(/[A-Za-z0-9_.]/.test(typed))setTimeout(()=>{if(cm===editor)showSqlHints(editor,false);},0);
   });
 }
}
function invalidateResult(){
 lastResult=null;lastError='';queryFeedback='';
 const rc=document.getElementById('resultCard');if(rc)rc.remove();
 const qf=document.getElementById('queryFeedback');if(qf)qf.remove();
}
function runCurrent(){
 const val=pendingRunSql!==null?pendingRunSql:runnableSql();
 pendingRunSql=null;
 if(!val.trim()){lastResult=null;lastError='כתבו שאילתת SQL לפני ההרצה.';render();return;}
 if(!state.attempted.includes(state.stage))state.attempted.push(state.stage);
 save();
 try{lastResult=exec(val);lastError='';queryFeedback='';}
 catch(e){lastResult=null;lastError=friendlySqlError(e.message,val,state.stage);queryFeedback='';}
 render();
}
function clearTransient(){lastResult=null;lastError='';feedback='';queryFeedback='';}
function bind(){
 document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{state.stage=+b.dataset.step;save();clearTransient();render();});
 document.querySelectorAll('[data-table]').forEach(b=>b.onclick=()=>{preview=b.dataset.table;render();});
 document.querySelectorAll('[data-insert-token]').forEach(b=>b.onmousedown=e=>{e.preventDefault();e.stopPropagation();insertIntoEditor(b.dataset.insertToken);});
 const note=document.getElementById('note');
 if(note)note.oninput=()=>{state.notes[state.stage]=note.value;save();};
 const scratch=document.getElementById('scratch');
 if(scratch)scratch.oninput=()=>{state.scratch[state.stage]=scratch.value;save();};
 document.querySelectorAll('[data-grain]').forEach(el=>el.onchange=()=>{state.structured.grain[el.dataset.grain]=el.value;save();render();});
 document.querySelectorAll('[data-card]').forEach(el=>el.onchange=()=>{state.structured.card[el.dataset.card]=el.value;save();render();});
 document.querySelectorAll('[data-decision]').forEach(el=>el.onchange=()=>{state.decision[el.dataset.decision]=el.value;save();render();});
 const toggleRelations=document.getElementById('toggleRelations');
 if(toggleRelations)toggleRelations.onclick=()=>{state.graphOpen[state.stage]=!relationGraphOpen();save();render();};

 const runBtn=document.getElementById('run');
 if(runBtn){
   runBtn.onmousedown=()=>{pendingRunSql=runnableSql();};
   runBtn.onclick=runCurrent;
 }

 const hintBtn=document.getElementById('hint');
 if(hintBtn)hintBtn.onclick=()=>{const i=state.hint[state.stage];state.hint[state.stage]=i===undefined?0:Math.min(i+1,curr().hints.length-1);save();render();};
 const solutionBtn=document.getElementById('solution');
 if(solutionBtn)solutionBtn.onclick=()=>{if(!state.solution[state.stage]&&state.hint[state.stage]===undefined&&!confirm('להציג את הפתרון המלא? כדאי קודם לנסות רמז ולהריץ ניסיון משלכם.'))return;state.solution[state.stage]=!state.solution[state.stage];save();render();};

 const clearStage=document.getElementById('clearStage');
 if(clearStage)clearStage.onclick=()=>{if(confirm('לנקות את ה-SQL, ההסבר, הרמז והפתרון של השלב הנוכחי? שאר ההתקדמות תישמר.')){delete state.sql[state.stage];delete state.notes[state.stage];delete state.scratch[state.stage];delete state.hint[state.stage];delete state.solution[state.stage];delete state.graphOpen[state.stage];state.attempted=(state.attempted||[]).filter(i=>i!==state.stage);state.completed=state.completed.filter(i=>i!==state.stage);state.skipped=(state.skipped||[]).filter(i=>i!==state.stage);save();clearTransient();render();}};

 const checkQueryNow=()=>{
   const val=editorValue();
   try{
     if(curr().requireNote&&!(state.notes[state.stage]||'').trim()){
       queryFeedback='לפני שבודקים: רשמו קודם את התחזית/ההסבר שלכם בשדה למטה. אפשר להריץ ולחקור, אבל הבדיקה הסופית מחייבת לנסח מה אתם חושבים.';
       save();render();return;
     }
     if(val.trim()&&!state.attempted.includes(state.stage))state.attempted.push(state.stage);
     if(!val.trim()){queryFeedback='כתבו שאילתת SQL לפני הבדיקה.';}
     else if(curr().mapping){
       const user=exec(val);
       queryFeedback='השאילתה תקינה ורצה. התקבלו '+user.values.length+' rows ו-'+user.columns.length+' columns. עכשיו השתמשו בנתונים כדי להסיק Grain ו-cardinality.';
     }else{
       const user=exec(val),exp=exec(curr().expected);
       if(sameResultValues(user,exp)){
         queryFeedback=curr().fanoutTrap?fanoutCorrectFeedback(val):(user.columns.join('|')===exp.columns.join('|')?'נכון. השאילתה מחזירה את התוצאה הצפויה.':'נכון. הערכים נכונים. שמות העמודות שונים מהפתרון, וזה לא פוסל את השאילתה.');
         if(!done(state.stage))state.completed.push(state.stage);
         state.skipped=(state.skipped||[]).filter(i=>i!==state.stage);
       }else{
         const trap=curr().fanoutTrap?fanoutWrongFeedback(val,user,exp):"";
         queryFeedback=trap||diagnoseResult(user,exp,state.stage);
       }
     }
   }catch(e){queryFeedback='לא ניתן להריץ את השאילתה: '+friendlySqlError(e.message,val,state.stage);}
   save();render();
 };
 const checkQuery=document.getElementById('checkQuery');
 if(checkQuery)checkQuery.onclick=checkQueryNow;

 const checkIntro=document.getElementById('checkIntro');
 if(checkIntro)checkIntro.onclick=()=>{if(!done(state.stage))state.completed.push(state.stage);state.skipped=(state.skipped||[]).filter(i=>i!==state.stage);feedback='מעולה. אפשר להמשיך — והמילון יישאר זמין בצד.';save();render();};

 const checkAnswer=document.getElementById('check');
 if(checkAnswer)checkAnswer.onclick=()=>{const r=checkStructured();feedback=r.msg;if(r.ok){if(!done(state.stage))state.completed.push(state.stage);state.skipped=(state.skipped||[]).filter(i=>i!==state.stage);}save();render();};

 const checkDec=document.getElementById('checkDecision');
 if(checkDec)checkDec.onclick=()=>{const r=checkDecision();feedback=r.msg;if(r.ok){if(!done(state.stage))state.completed.push(state.stage);state.skipped=(state.skipped||[]).filter(i=>i!==state.stage);}save();render();};

 document.getElementById('prev').onclick=()=>{if(state.stage>0){state.stage--;save();clearTransient();render();}};
 document.getElementById('next').onclick=()=>{if(done(state.stage)&&state.stage<STAGES.length-1){state.stage++;save();clearTransient();render();}};
 document.getElementById('reset').onclick=()=>{if(confirm('לאפס את כל ההתקדמות והכתיבה?')){localStorage.removeItem(STORAGE_KEY);state=defaults();clearTransient();render();}};

 const theme=document.getElementById('theme');
 if(theme)theme.onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';save();render();};

 const exp=document.getElementById('export');
 if(exp)exp.onclick=()=>{
   const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
   const url=URL.createObjectURL(blob);
   const a=document.createElement('a');a.href=url;a.download='pulseboard-progress.json';a.click();
   URL.revokeObjectURL(url);
 };
 const impBtn=document.getElementById('importBtn'),impFile=document.getElementById('importFile');
 if(impBtn&&impFile){
   impBtn.onclick=()=>impFile.click();
   impFile.onchange=()=>{
     const file=impFile.files[0];if(!file)return;
     const r=new FileReader();
     r.onload=()=>{try{const parsed=JSON.parse(r.result);state=migrateState(parsed);save();clearTransient();render();alert('ההתקדמות יובאה בהצלחה.');}catch(e){alert('קובץ לא תקין: '+e.message);}};
     r.readAsText(file);
   };
 }
}
async function init(){
 try{
   const SQL=await initSqlJs({locateFile:f=>'https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/'+f});
   db=new SQL.Database();
   db.run(SEED_SQL);
 }catch(e){dbError='SQLite לא נטען: '+e.message;}
 render();
}
render();init();
</script>
</body>
</html>
