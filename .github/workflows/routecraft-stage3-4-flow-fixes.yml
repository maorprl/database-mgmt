name: RouteCraft Stage 3-4 flow fixes

on:
  push:
    branches:
      - routecraft-stage3-4-flow-fixes

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'Trigger Stage 3-4 flow fixes')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: routecraft-stage3-4-flow-fixes
          fetch-depth: 0
      - name: Patch and validate
        run: python .github/routecraft-stage3-4-fix.py
      - name: Verify scope and commit app only
        run: |
          test "$(git diff --name-only | sort)" = "sql-lab/index.html"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sql-lab/index.html
          git commit -m "Fix Stage 3-4 question flow and wording"
          git push origin routecraft-stage3-4-flow-fixes
