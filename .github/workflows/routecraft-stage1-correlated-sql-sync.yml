name: RouteCraft Stage 1 correlated SQL sync validation
on:
  push:
    branches: [routecraft-stage1-correlated-sql-sync]
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: routecraft-stage1-correlated-sql-sync
      - name: Patch synchronized SQL visualizer
        run: python .github/routecraft-stage1-correlated-sql-sync.py
      - name: Validate JavaScript and guardrails
        shell: bash
        run: |
          python -c "from pathlib import Path; import re; s=Path('sql-lab/index.html').read_text(encoding='utf-8'); assert 'ה-SQL · השורות הפעילות מודגשות בכל שלב' in s; assert 'const activeByStep=[[11],[5],[3,4],[6],[7,8,9,10]];' in s; assert 'זו בדיוק הקורלציה' in s; assert 'Correlated subquery היא query בתוך query אחר' in s; scripts=re.findall(r'<script[^>]*>([\\s\\S]*?)</script>',s); inline=[x for x in scripts if x.strip()]; Path('/tmp/app.js').write_text(inline[-1],encoding='utf-8')"
          node --check /tmp/app.js
          test "$(git diff --name-only)" = "sql-lab/index.html"
      - name: Commit patch
        shell: bash
        run: |
          git config user.name maorprl
          git config user.email maorperlov@gmail.com
          git add sql-lab/index.html
          git commit -m "Sync Stage 1 subquery steps with SQL"
          git push origin HEAD:routecraft-stage1-correlated-sql-sync
