name: RouteCraft single editor fix
on:
  push:
    branches:
      - routecraft-single-editor-fix
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: routecraft-single-editor-fix
          fetch-depth: 0
      - name: Patch and validate
        run: |
          python .github/scripts/routecraft_single_editor_fix.py
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('sql-lab/index.html').read_text(encoding='utf-8')
          scripts=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I):
              if 'src=' not in attrs.lower(): scripts.append(body)
          Path('/tmp/routecraft-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/routecraft-inline.js
          git diff --check
      - name: Commit app if changed
        run: |
          if git diff --quiet -- sql-lab/index.html; then
            echo "No app changes needed"
            exit 0
          fi
          test "$(git diff --name-only | sort)" = "sql-lab/index.html"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sql-lab/index.html
          git commit -m 'Use one SQL editor in Stage 1'
          git push origin routecraft-single-editor-fix
