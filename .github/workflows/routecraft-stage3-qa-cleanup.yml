name: RouteCraft Stage 3 QA cleanup
on:
  push:
    branches: [routecraft-stage3-qa-cleanup]
permissions:
  contents: write
jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: routecraft-stage3-qa-cleanup
      - name: Remove stray scratchpad and align Stage 3 sanity label
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sql-lab/index.html')
          s=p.read_text(encoding='utf-8')
          old=s

          scratch='fanoutTrap:true,scratch:"ציירו depot במרכז, drivers בענף אחד ו-routes בענף שני. השאירו ליד כל קו מקום לכתוב את ה-Cardinality אחרי שתסיקו אותה.",context:'
          replacement='fanoutTrap:true,context:'
          if s.count(scratch)!=1:
              raise SystemExit(f'expected exactly one Stage 3 scratch marker, found {s.count(scratch)}')
          s=s.replace(scratch,replacement,1)

          sanity_old="const sanityTitle=state.stage===1?'⚠ SANITY CHECK · לפני החיבור':'⚠ SANITY CHECK · לפני SQL';"
          sanity_new="const sanityTitle=state.stage===1?'⚠ SANITY CHECK · לפני החיבור':(state.stage===3?'⚠ SANITY CHECK · לפני בחירת הפעולה':'⚠ SANITY CHECK · לפני SQL');"
          if s.count(sanity_old)!=1:
              raise SystemExit('sanity title marker missing or duplicated')
          s=s.replace(sanity_old,sanity_new,1)

          if s==old:
              raise SystemExit('no changes made')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate Stage 3 learner flow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('sql-lab/index.html').read_text(encoding='utf-8')

          # Stage 3 itself no longer owns a scratchpad.
          m=re.search(r'^\{title:"אילו אתרים באמת פעילים\?".*$',s,re.M)
          if not m:
              raise SystemExit('Stage 3 definition not found')
          stage=m.group(0)
          if 'scratch:' in stage or 'צריך לשרבט' in stage:
              raise SystemExit('Stage 3 still contains scratchpad content')

          # Questions reveal one by one.
          sequential=[
            'let out=renderQ(0);',
            'if(predQuestionResolved(3,s,0))out+=renderQ(1);',
            'if(predQuestionResolved(3,s,1))out+=stage3RelationsHtml()+stage3KeyGuideHtml()+renderQ(2);',
            'if(predQuestionResolved(3,s,2))out+=stage3CardinalityMapHtml()+renderQ(3);',
            'if(predQuestionResolved(3,s,3))out+=renderQ(4);',
            'if(predQuestionResolved(3,s,4))out+=stage3GrainMismatchHtml();'
          ]
          for x in sequential:
              if x not in s:
                  raise SystemExit('missing sequential Stage 3 step: '+x)

          # Sanity precedes operator choice in the guided flow.
          g=re.search(r'function stage3GuidedFlowHtml\(s\)\{(.*?)\n\}',s,re.S)
          if not g:
              raise SystemExit('stage3GuidedFlowHtml missing')
          body=g.group(1)
          sanity_pos=body.find('let out=sanityHtml(s,false);')
          op_pos=body.find('out+=operationHtml(s);')
          if sanity_pos<0 or op_pos<0 or sanity_pos>op_pos:
              raise SystemExit('Stage 3 sanity/operator order is wrong')

          # Operator is a normal visible card, not optional help/details.
          if 'if(state.stage===1||state.stage===2||state.stage===3)return' not in s:
              raise SystemExit('Stage 3 direct operation branch missing')
          if '<section class=\\"card operation-card\\"><div class=\\"operation-title\\">בחירת הפעולה</div>' not in s:
              raise SystemExit('direct operation card markup missing')

          # SQL remains gated by both sanity and the correct operation.
          gate='(state.stage===3&&(!stage3SanityResolved(s)||!operationChoiceResolved(s)))'
          if gate not in s:
              raise SystemExit('Stage 3 SQL gate missing')

          # Wrong answers use Stage-3-specific feedback.
          if 'function stage3PredictionWrongFeedback(qi,choice)' not in s:
              raise SystemExit('Stage 3 prediction feedback missing')
          if 'stage3OperationWrongFeedback(cur)' not in s:
              raise SystemExit('Stage 3 operation feedback not wired')

          # Sanity label matches its position before operator selection.
          if "state.stage===3?'⚠ SANITY CHECK · לפני בחירת הפעולה'" not in s:
              raise SystemExit('Stage 3 sanity label not aligned to flow')

          # Both solution paths keep explanations.
          if 'function stage3SolutionExplanationHtml(choice)' not in s:
              raise SystemExit('Stage 3 solution explanation missing')
          if "else if(state.stage===3)out+=stage3SolutionExplanationHtml(choice)" not in s:
              raise SystemExit('Stage 3 solution explanation not rendered')
          PY
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('sql-lab/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          inline=[x for x in scripts if x.strip()]
          if not inline:
              raise SystemExit('no inline script found')
          Path('/tmp/routecraft.js').write_text(inline[-1],encoding='utf-8')
          PY
          node --check /tmp/routecraft.js
      - name: Commit validated app change
        run: |
          if git diff --quiet -- sql-lab/index.html; then
            echo 'No app diff' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sql-lab/index.html
          git commit -m 'Clean up Stage 3 learner flow'
          git push origin HEAD:routecraft-stage3-qa-cleanup
