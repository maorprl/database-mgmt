name: RouteCraft v11 flow validation
on:
  push:
    branches:
      - routecraft-early-pedagogy-v11
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch early-stage flow and validate
        shell: bash
        run: |
          python -c "import base64;exec(base64.b64decode(' xMSkKICAgIG9sZD0iIiIgc2NyYXRjaEh0bWwocykrCiBvcGVyYXRpb25IdG1sKHMpKwogam9pblZpelRpc2Nsb3N1cmVIdG1sKHMpKwogc2FuaXR5SHRtbChzLGZhbHNlKSsKIHNjYWZmb2xkSHRtbChzKSsKIHNjYWZmb2xkR2F0ZUh0bWwocykrCiAoKHMuc3VtbWFyeXx8cy5pbnRyb3x8IXNjYWZmb2xkQ29tcGxldGUocykpPyc nOic8c2VjdGlvbiBjbGFzcz0iZWRpdG9yIj4iIiIKICAgIG5ldz0iIiIgc2NyYXRjaEh0bWwocykrCiAoZWFybHlQcmVkaWN0aW9uUmVzb2x2ZWQocy k/b3BlcmF0aW9uSHRtbChzKTonJykrCiBqb2luVml6RGlzY2xvc3VyZUh0bWwocykrCiAoKCF  k8fChlYXJseVN0YWdlRmxvdygpJiYoIW9wZXJhdGlvbkNob2ljZVJlc29sdmVkKHMpfHwhZWFybHlTYW5pdHlSZXNvbHZlZChzKSkpPyc  '))"
          node --check /tmp/routecraft.js
          if git diff --quiet -- sql-lab/index.html; then echo 'No patch needed'; exit 0; fi
          git config user.name routecraft-bot
          git config user.email routecraft-bot@users.noreply.github.com
          git add sql-lab/index.html
          git commit -m 'Enforce early relational reasoning flow'
          git push
