name: RouteCraft v11 flow validation
on:
  push:
    branches:
      - routecraft-early-pedagogy-v11
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch early-stage flow
        run: python .github/scripts/patch_routecraft_flow.py
      - name: Validate JavaScript syntax
        run: node --check /tmp/routecraft.js
      - name: Commit patched lab
        shell: bash
        run: |
          if git diff --quiet -- sql-lab/index.html; then
            echo 'No patch needed'
            exit 0
          fi
          git config user.name routecraft-bot
          git config user.email routecraft-bot@users.noreply.github.com
          git add sql-lab/index.html
          git commit -m 'Enforce early relational reasoning flow'
          git push
