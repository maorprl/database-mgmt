name: RouteCraft Stage 2 focus validation
on:
  push:
    branches:
      - routecraft-stage2-focus-and-solution2
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: routecraft-stage2-focus-and-solution2
      - name: Patch app
        run: python tools/patch_stage2_focus.py
      - name: Validate JavaScript
        run: |
          git diff --check
          node --check /tmp/app.js
      - name: Commit app change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sql-lab/index.html
          git commit -m 'Focus Stage 2 on transfer and NULL' || exit 0
          git push origin HEAD:routecraft-stage2-focus-and-solution2
