name: Publish standalone Stages 1-4

on:
  push:
    paths:
      - '.github/workflows/publish-stages-1-4-simple.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild standalone HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, zlib

          parts_dir = Path('sql-lab/stages-1-4-data')
          payload = ''.join((parts_dir / f'part-{i}.txt').read_text(encoding='utf-8').strip() for i in range(1, 9))
          raw = base64.b64decode(payload)
          try:
              decoded = gzip.decompress(raw)
          except gzip.BadGzipFile:
              decoded = zlib.decompress(raw[10:-8], -zlib.MAX_WBITS)
          html = decoded.decode('utf-8')

          html = html.replace("const STORAGE_KEY='routecraft-sql-lab-stages-1-4-v1';", "const STORAGE_KEY='routecraft-sql-lab-stages-1-4-simple-v1';")
          html = html.replace("const SQL=await initSqlJs({locateFile:f=>'https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/'+f});", "const SQL=await initSqlJs();")

          out = Path('sql-lab/stages-1-4-simple.html')
          out.write_text(html, encoding='utf-8')

          assert 'STAGES.splice(5)' in html
          assert 'fetch(' not in html
          assert "const SQL=await initSqlJs();" in html
          print(f'Wrote {out} ({out.stat().st_size} bytes)')
          PY

      - name: Commit standalone HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sql-lab/stages-1-4-simple.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "publish standalone stages 1-4 html"
            git push
          fi
