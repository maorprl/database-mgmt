name: RouteCraft Stage 3 fanout flow
on:
  push:
    branches: [routecraft-stage3-fanout-flow]
permissions:
  contents: write
jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: routecraft-stage3-fanout-flow
      - name: Patch Stage 3
        run: python .github/scripts/patch_stage3.py
      - name: Validate Stage 3
        run: |
          git diff --check
          python .github/scripts/validate_stage3.py
          node --check /tmp/app.js
      - name: Commit Stage 3 app change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sql-lab/index.html
          git commit -m 'Rewrite Stage 3 around fanout and EXISTS' || exit 0
          git push origin HEAD:routecraft-stage3-fanout-flow
