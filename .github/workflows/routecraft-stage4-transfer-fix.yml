name: RouteCraft Stage 4 transfer fix
on:
  push:
    branches: [routecraft-stage4-transfer-fix]
permissions:
  contents: write
jobs:
  build-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'Run Stage 4 transfer rewrite') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: routecraft-stage4-transfer-fix
          fetch-depth: 0
      - name: Rewrite Stage 4 only
        run: python .github/stage4_transfer_patch.py
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('sql-lab/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          inline=[x for x in scripts if x.strip()]
          if not inline: raise SystemExit('no inline script found')
          Path('/tmp/routecraft.js').write_text(inline[-1],encoding='utf-8')
          PY
          node --check /tmp/routecraft.js
      - name: Verify scope and commit app only
        run: |
          changed=$(git diff --name-only)
          if [ "$changed" != "sql-lab/index.html" ]; then
            echo "Unexpected working-tree changes: $changed" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sql-lab/index.html
          git commit -m 'Rework Stage 4 as M-to-1 transfer'
          git push origin HEAD:routecraft-stage4-transfer-fix
