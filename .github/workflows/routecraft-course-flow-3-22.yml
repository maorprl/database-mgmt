name: RouteCraft course flow 3-22
on:
  push:
    branches: [routecraft-course-flow-3-22]
permissions:
  contents: write
jobs:
  rewrite-and-validate:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'Run course-wide rewrite')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: routecraft-course-flow-3-22
          fetch-depth: 1
      - name: Apply course-wide rewrite
        run: |
          cat .github/routecraft-flow-parts/part_* | base64 -d | gzip -d > /tmp/course_flow_rewrite.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/course_flow_rewrite.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('# Verify all expected SQL against the seed database')
          end=s.index("con=sqlite3.connect(':memory:')",start)
          replacement='''# Verify all expected SQL against the seed database. SEED_SQL is a JS array of quoted statements.\nhtml=P.read_text(encoding='utf-8')\nseed_m=re.search(r'const\\s+SEED_SQL\\s*=\\s*\\[([\\s\\S]*?)\\]\\.join\\(\\"\\\\n\\"\\);',html)\nif not seed_m: raise SystemExit('SEED_SQL array not found')\ntry:\n    seed_parts=json.loads('['+seed_m.group(1)+']')\nexcept json.JSONDecodeError as e:\n    raise SystemExit('SEED_SQL parse failed: '+str(e))\nseed='\\n'.join(seed_parts)\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile /tmp/course_flow_rewrite.py
          python /tmp/course_flow_rewrite.py
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('sql-lab/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          inline=[x for x in scripts if x.strip()]
          if not inline:
              raise SystemExit('no inline script found')
          Path('/tmp/routecraft.js').write_text(inline[-1],encoding='utf-8')
          PY
          node --check /tmp/routecraft.js
      - name: Validate learner-flow contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('sql-lab/index.html').read_text(encoding='utf-8')
          required=[
            'const COURSE_FLOW_VERSION=1;',
            'function guidedPredictionQuizHtml(s)',
            'function guidedStageFlowHtml(s)',
            'function guidedSqlUnlocked(s)',
            'function guidedRelationsHtml()',
            'function guidedSolutionExplanationHtml(choice)',
            'אילו אתרים באמת פעילים?',
            'מה קורה כשאין tracker לרכב?',
            'איזה משלוח נסע באיזה מסלול?',
            'איזה משלוח עוד לא שובץ?',
            'איך מדרגים מסלולים בתוך כל אתר?',
            'Transfer: סכמה זרה'
          ]
          for marker in required:
              if marker not in s:
                  raise SystemExit('missing contract marker: '+marker)
          start=s.index('אילו אתרים באמת פעילים?')
          end=s.index('function introHtml()',start)
          stage_slice=s[start:end]
          if 'scratch:' in stage_slice or 'צריך לשרבט' in stage_slice:
              raise SystemExit('scratchpad content remains in rewritten stages')
          if 'showRelationsAfter:0' not in s:
              raise SystemExit('Stage 3 relation timing contract missing')
          for idx in [4,9,10,13,18,19,20,21,22]:
              if f'"{idx}":{{' not in s:
                  raise SystemExit(f'guided metadata missing for stage {idx}')
          for marker in ['function stage1GuidedFlowHtml(s)','function stage2GuidedFlowHtml(s)','function stage1CorrelatedVizHtml()','function stage2CorrelatedVizHtml()']:
              if marker not in s:
                  raise SystemExit('Stage 1-2 regression: '+marker)
          PY
      - name: Commit validated app only
        run: |
          if git diff --quiet -- sql-lab/index.html; then
            echo 'No app diff produced' >&2
            exit 1
          fi
          changed=$(git diff --name-only)
          if [ "$changed" != "sql-lab/index.html" ]; then
            echo "Unexpected working-tree changes: $changed" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sql-lab/index.html
          git commit -m 'Rebuild course flow for Stages 3-22'
          git push origin HEAD:routecraft-course-flow-3-22
