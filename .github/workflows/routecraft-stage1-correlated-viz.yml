name: RouteCraft Stage 1 correlated subquery visualizer validation
on:
  push:
    branches: [routecraft-stage1-correlated-viz]
    paths: [.github/workflows/routecraft-stage1-correlated-viz.yml]
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: routecraft-stage1-correlated-viz
      - name: Patch Stage 1 solution 2 visualizer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sql-lab/index.html')
          s=p.read_text()

          css_old=""".solution-note{font-size:12px;color:var(--muted);line-height:1.65}\n:root[data-theme=\"dark\"] .operation-help .op-tool,:root[data-theme=\"dark\"] .solution-option.active{background:#173025;border-color:#365844;color:#bfe2ca}"""
          css_new=""".solution-note{font-size:12px;color:var(--muted);line-height:1.65}\n.correlated-viz{margin-top:12px;padding:14px;border:1px solid #d8e4dc;border-radius:12px;background:#fbfdfb}\n.correlated-viz-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.correlated-viz-head b{font-size:12px}.correlated-viz-head span{font-size:11px;color:var(--muted);font-weight:800}\n.correlated-flow{display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr;gap:7px;align-items:stretch;direction:ltr}.correlated-node{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;min-width:0;transition:.18s ease;opacity:.58}.correlated-node.active{opacity:1;border-color:#7eb196;box-shadow:0 0 0 2px rgba(38,113,84,.10);transform:translateY(-2px)}.correlated-node b{display:block;font-size:11px;margin-bottom:6px;color:#365747}.correlated-node code{display:block;white-space:normal;overflow-wrap:anywhere;font:11px/1.55 Consolas,monospace;color:var(--ink)}.correlated-arrow{display:grid;place-items:center;color:#729082;font-size:20px;font-weight:900}.correlated-step-text{margin-top:11px;padding:10px 12px;border-radius:9px;background:#eef7f1;color:#315b47;font-size:12px;line-height:1.65;min-height:54px}.correlated-controls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}.correlated-controls button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 12px;font-weight:800;cursor:pointer}.correlated-controls button:disabled{opacity:.35;cursor:default}.correlated-dots{display:flex;gap:5px;direction:ltr}.correlated-dot{width:7px;height:7px;border-radius:99px;background:#ccd8d1}.correlated-dot.active{background:#267154}.correlated-caption{margin-top:9px;font-size:11px;line-height:1.55;color:var(--muted)}\n:root[data-theme=\"dark\"] .correlated-viz{background:#152019;border-color:#34483d}:root[data-theme=\"dark\"] .correlated-node,:root[data-theme=\"dark\"] .correlated-controls button{background:#10241c;border-color:#46534c}:root[data-theme=\"dark\"] .correlated-step-text{background:#173025;color:#bfe2ca}\n@media(max-width:760px){.correlated-flow{grid-template-columns:1fr}.correlated-arrow{transform:rotate(90deg)}}\n:root[data-theme=\"dark\"] .operation-help .op-tool,:root[data-theme=\"dark\"] .solution-option.active{background:#173025;border-color:#365844;color:#bfe2ca}"""
          if css_old not in s:
              raise SystemExit('solution CSS marker not found')
          s=s.replace(css_old,css_new,1)

          fn_marker="""function sqlSupportHtml(s,hintText,principleText){"""
          fn_new="""function stage1CorrelatedVizHtml(){\n const total=5;\n const step=Math.max(0,Math.min(total-1,Number(((state.correlatedVizStep||{})[1])||0)));\n const texts=[\n   'השאילתה החיצונית נמצאת על route אחת כרגע. בדוגמה: route_id = 1003.',\n   'מה-row הנוכחית לוקחים את r.depot_id. כאן הערך הוא 2.',\n   'ה-subquery רצה מול depots עם התנאי d.depot_id = r.depot_id, כלומר d.depot_id = 2.',\n   'ה-subquery מחזירה ערך אחד: d.depot_name = Riverbend Crossdock.',\n   'הערך חוזר ל-row של route 1003. ה-Grain נשאר route, ואז עוברים ל-route הבאה.'\n ];\n const nodeClass=i=>'correlated-node '+(step===i||((i===0||i===1)&&step===1)||((i===2)&&step===2)||((i===3||i===4)&&step>=3)?'active':'');\n const dots=Array.from({length:total},(_,i)=>'<span class=\"correlated-dot '+(i===step?'active':'')+'\"></span>').join('');\n return '<div class=\"correlated-viz\"><div class=\"correlated-viz-head\"><b>איך ה-Correlated subquery עובדת?</b><span>שלב '+(step+1)+' מתוך '+total+'</span></div>'+\n   '<div class=\"correlated-flow\">'+\n     '<div class=\"'+nodeClass(0)+'\"><b>1 · row נוכחית ב-routes</b><code>route_id = 1003<br>route_code = RB-0820-A<br>depot_id = 2</code></div>'+\n     '<div class=\"correlated-arrow\">→</div>'+\n     '<div class=\"'+nodeClass(2)+'\"><b>2 · lookup ב-depots</b><code>WHERE d.depot_id = r.depot_id<br>→ d.depot_id = 2</code></div>'+\n     '<div class=\"correlated-arrow\">→</div>'+\n     '<div class=\"'+nodeClass(4)+'\"><b>3 · value שחוזר</b><code>depot_name<br>= Riverbend Crossdock</code></div>'+\n   '</div>'+\n   '<div class=\"correlated-step-text\">'+esc(texts[step])+'</div>'+\n   '<div class=\"correlated-controls\"><button id=\"correlatedPrev\" '+(step===0?'disabled':'')+'>← הקודם</button><div class=\"correlated-dots\">'+dots+'</div><button id=\"correlatedNext\" '+(step===total-1?'disabled':'')+'>הבא →</button></div>'+\n   '<div class=\"correlated-caption\">אותה בקשה עסקית ואותו Output Grain; ההבדל הוא שבמקום JOIN, ה-subquery מבצעת lookup עבור כל row של ה-query החיצוני.</div></div>';\n}\n\nfunction sqlSupportHtml(s,hintText,principleText){"""
          if fn_marker not in s:
              raise SystemExit('sqlSupportHtml marker not found')
          s=s.replace(fn_marker,fn_new,1)

          sol_old="""   out+='<div class=\"solutionbox\"><div class=\"solution-tabs\">'+options.map((x,i)=>'<button class=\"solution-option '+(choice===i?'active':'')+'\" data-solution-choice=\"'+i+'\">פתרון '+(i+1)+' · '+esc(x.label)+'</button>').join('')+'</div><pre>'+esc(options[choice].sql)+'</pre>';\n   if(options[choice].note)out+='<p class=\"solution-note\">'+esc(options[choice].note)+'</p>';"""
          sol_new="""   out+='<div class=\"solutionbox\"><div class=\"solution-tabs\">'+options.map((x,i)=>'<button class=\"solution-option '+(choice===i?'active':'')+'\" data-solution-choice=\"'+i+'\">פתרון '+(i+1)+' · '+esc(x.label)+'</button>').join('')+'</div><pre>'+esc(options[choice].sql)+'</pre>';\n   if(state.stage===1&&choice===1)out+=stage1CorrelatedVizHtml();\n   if(options[choice].note)out+='<p class=\"solution-note\">'+esc(options[choice].note)+'</p>';"""
          if sol_old not in s:
              raise SystemExit('solution render marker not found')
          s=s.replace(sol_old,sol_new,1)

          bind_old=""" document.querySelectorAll('[data-solution-choice]').forEach(btn=>btn.onclick=()=>{state.solutionChoice[state.stage]=+btn.dataset.solutionChoice;save();render();});\n const solutionBtn=document.getElementById('solution');"""
          bind_new=""" document.querySelectorAll('[data-solution-choice]').forEach(btn=>btn.onclick=()=>{state.solutionChoice[state.stage]=+btn.dataset.solutionChoice;save();render();});\n const correlatedPrev=document.getElementById('correlatedPrev'),correlatedNext=document.getElementById('correlatedNext');\n if(correlatedPrev)correlatedPrev.onclick=()=>{if(!state.correlatedVizStep)state.correlatedVizStep={};state.correlatedVizStep[1]=Math.max(0,Number(state.correlatedVizStep[1]||0)-1);save();render();};\n if(correlatedNext)correlatedNext.onclick=()=>{if(!state.correlatedVizStep)state.correlatedVizStep={};state.correlatedVizStep[1]=Math.min(4,Number(state.correlatedVizStep[1]||0)+1);save();render();};\n const solutionBtn=document.getElementById('solution');"""
          if bind_old not in s:
              raise SystemExit('solution choice bind marker not found')
          s=s.replace(bind_old,bind_new,1)

          p.write_text(s)
          PY
      - name: Validate JavaScript and visualizer guardrails
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('sql-lab/index.html').read_text()
          a=s.index('<script>', s.index('sql.js'))+len('<script>')
          b=s.rindex('</script>')
          Path('/tmp/routecraft.js').write_text(s[a:b])
          assert 'function stage1CorrelatedVizHtml()' in s
          assert "state.stage===1&&choice===1" in s
          assert 'id="correlatedPrev"' in s
          assert 'id="correlatedNext"' in s
          assert 'route_id = 1003' in s
          assert 'Riverbend Crossdock' in s
          assert 'Output Grain' in s
          assert 'Correlated subquery' in s
          PY
          node --check /tmp/routecraft.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "maorprl"
          git config user.email "maorperlov@gmail.com"
          git add sql-lab/index.html
          git commit -m "Visualize Stage 1 correlated subquery" || exit 0
          git push origin HEAD:routecraft-stage1-correlated-viz
